/* Componentes del tablero. Los COLORES, FUENTES y RADIOS no están aquí:
   se generan desde config/tema.json (ver src/modulo1/tema.js). Si buscas
   cambiar el diseño, ese es el archivo. */

*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--tinta);
  font-family:var(--fam-cuerpo);
  font-size:14.5px; line-height:1.55; -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{margin:0; text-wrap:balance; font-weight:800; letter-spacing:-.02em}
h1{font-size:26px} h2{font-size:19px} h3{font-size:15.5px; font-weight:700}
h4{font-size:13px; font-weight:700}
p{margin:0}
.mono{font-family:var(--fam-datos)}
.num{font-variant-numeric:tabular-nums}
.rot{font-size:10.5px; font-weight:800; letter-spacing:.1em; text-transform:uppercase;
  color:var(--tinta-3)}

/* ═══ armazón ═══ */
.app{display:grid; grid-template-columns:var(--lateral-w) 1fr; min-height:100vh}
@media (max-width:900px){ .app{grid-template-columns:1fr} }

/* ═══ lateral ═══ */
.lateral{background:var(--lateral); color:var(--lateral-tex); padding:24px 16px;
  display:flex; flex-direction:column; gap:26px; position:sticky; top:0;
  height:100vh; overflow-y:auto}
@media (max-width:900px){
  .lateral{position:static; height:auto; flex-direction:row; align-items:center;
    gap:14px; overflow-x:auto; padding:14px 16px}
  .lateral .marca-txt{display:none}
}
.logo{display:flex; align-items:center; gap:11px; flex:0 0 auto}
.logo .g{width:34px; height:34px; border-radius:10px; flex:0 0 auto;
  background:linear-gradient(135deg,var(--marca-fondo),var(--marca-fondo-2));
  display:grid; place-items:center; font-weight:800; font-size:15px; color:#fff}
.logo b{font-size:14.5px; font-weight:800; letter-spacing:-.01em; display:block; line-height:1.2}
.logo span{font-size:11px; color:var(--lateral-tenue); display:block}
.nav{display:flex; flex-direction:column; gap:3px; flex:1 1 auto}
@media (max-width:900px){ .nav{flex-direction:row; flex:0 0 auto} }
.nav a{display:flex; align-items:center; gap:10px; padding:9px 12px;
  border-radius:var(--r-xs); color:var(--lateral-tenue); text-decoration:none;
  font-size:13.5px; font-weight:600; white-space:nowrap}
.nav a:hover{background:var(--lateral-act); color:var(--lateral-tex)}
.nav a.on{background:var(--lateral-act); color:var(--lateral-tex)}
.nav a:focus-visible{outline:2px solid var(--marca); outline-offset:1px}
.nav a i{width:7px; height:7px; border-radius:50%; background:currentColor;
  opacity:.5; flex:0 0 auto}
.nav a .badge{margin-left:auto; background:var(--marca-fondo); color:#fff; font-size:10.5px;
  font-weight:800; min-width:19px; height:19px; border-radius:999px; display:grid;
  place-items:center; padding:0 5px; font-variant-numeric:tabular-nums}
@media (max-width:900px){ .nav a .badge{margin-left:5px} }
.nav a.on i{opacity:1; background:var(--marca)}
.lateral .pie{font-size:11px; color:var(--lateral-tenue); line-height:1.5}
@media (max-width:900px){ .lateral .pie{display:none} }

/* ═══ principal ═══ */
.principal{padding:26px 30px 60px; min-width:0}
@media (max-width:640px){ .principal{padding:20px 16px 44px} }
.barra{display:flex; flex-wrap:wrap; gap:14px; align-items:center;
  justify-content:space-between; margin-bottom:22px}
.barra .izq h1{line-height:1.2}
.barra .izq p{color:var(--tinta-2); font-size:13.5px; margin-top:3px}
.barra .der{display:flex; gap:9px; align-items:center; flex-wrap:wrap}

/* ═══ botones ═══ */
.btn{display:inline-flex; align-items:center; gap:8px; border-radius:999px;
  border:1px solid var(--borde-2); background:var(--sup); color:var(--tinta);
  font:inherit; font-size:13px; font-weight:700; padding:9px 16px; cursor:pointer;
  white-space:nowrap; transition:transform .12s ease, box-shadow .12s ease}
.btn:hover{box-shadow:var(--sombra); transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn:focus-visible{outline:2px solid var(--marca); outline-offset:2px}
.btn[disabled]{opacity:.45; cursor:not-allowed; transform:none; box-shadow:none}
.btn.pri{background:linear-gradient(135deg,var(--marca-fondo),var(--marca-fondo-2));
  border-color:transparent; color:#fff}
.btn.chico{font-size:12px; padding:7px 13px}
.btn svg{width:14px; height:14px; fill:none; stroke:currentColor; stroke-width:2.2;
  stroke-linecap:round; stroke-linejoin:round; flex:0 0 auto}
@media (prefers-reduced-motion:reduce){ .btn{transition:none} .btn:hover{transform:none} }

/* ═══ hero ═══ */
.hero{border-radius:var(--r); padding:26px 28px; margin-bottom:16px;
  background:linear-gradient(125deg,var(--marca-fondo-2) 0%,var(--marca-fondo) 60%,#8A6DF0 100%);
  color:#fff; box-shadow:var(--sombra-alta); position:relative; overflow:hidden}
.hero::after{content:""; position:absolute; right:-70px; top:-70px; width:240px;
  height:240px; border-radius:50%; background:rgba(255,255,255,.09)}
.hero .et{font-size:11px; font-weight:800; letter-spacing:.1em; text-transform:uppercase;
  opacity:.85}
.hero .cifra{font-size:clamp(42px,7vw,64px); font-weight:800; letter-spacing:-.035em;
  line-height:1; margin:10px 0 4px; font-variant-numeric:tabular-nums}
.hero .un{font-size:15px; font-weight:700; opacity:.95}
.hero .exp{font-size:13.5px; opacity:.9; max-width:60ch; margin-top:12px; line-height:1.5}
.hero .calc{font-family:var(--fam-datos); font-size:11.5px;
  background:rgba(255,255,255,.14); border-radius:var(--r-xs); padding:9px 12px;
  margin-top:14px; max-width:74ch; line-height:1.55; position:relative}
.hero .adv{font-size:12px; margin-top:11px; opacity:.9; font-style:italic; max-width:66ch}

/* ═══ tarjetas de cifra ═══ */
.cifras{display:grid; grid-template-columns:repeat(auto-fit,minmax(158px,1fr));
  gap:13px; margin-bottom:16px}
.cif{background:var(--sup); border:1px solid var(--borde); border-radius:var(--r-s);
  padding:15px 17px; box-shadow:var(--sombra)}
.cif .v{font-size:27px; font-weight:800; letter-spacing:-.025em; line-height:1.15;
  font-variant-numeric:tabular-nums}
.cif .e{font-size:12px; color:var(--tinta-2); margin-top:4px; line-height:1.4}
.cif.ojo{background:var(--falta-suave); border-color:var(--falta)}
.cif.ojo .v{color:var(--falta-tex)}
.cif.ok{background:var(--bien-suave); border-color:var(--bien)}
.cif.ok .v{color:var(--bien-tex); font-size:21px}

/* ═══ avisos ═══ */
.aviso{border-radius:var(--r-s); padding:16px 18px; margin-bottom:26px;
  background:var(--falta-suave); border:1px solid var(--falta)}
.aviso h4{color:var(--falta-tex); margin-bottom:10px; display:flex; align-items:center; gap:8px}
.aviso h4 svg{width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:2.2;
  stroke-linecap:round}
.aviso ul{margin:0; padding-left:18px; display:flex; flex-direction:column; gap:7px}
.aviso li{font-size:13.5px}
.aviso li b{font-weight:800}
.aviso .cierre{font-size:12px; font-style:italic; color:var(--falta-tex); margin-top:11px}
.lectura{background:var(--sup-3); border:1px solid var(--borde-2); border-radius:var(--r-s);
  padding:12px 16px; margin-bottom:18px; font-size:13px; color:var(--tinta-2)}

/* ═══ secciones ═══ */
section{margin-bottom:34px; scroll-margin-top:20px}
.cab{display:flex; flex-wrap:wrap; gap:12px; align-items:flex-end;
  justify-content:space-between; margin-bottom:5px}
.sub{color:var(--tinta-2); font-size:13.5px; max-width:76ch; margin-bottom:16px}

/* ═══ progreso ═══ */
.prog{background:var(--sup); border:1px solid var(--borde); border-radius:var(--r-s);
  padding:15px 18px; margin-bottom:14px; box-shadow:var(--sombra);
  display:flex; align-items:center; gap:18px; flex-wrap:wrap}
.prog .txt{flex:1 1 200px; min-width:0}
.prog .txt b{font-size:20px; font-weight:800; font-variant-numeric:tabular-nums}
.prog .txt span{font-size:12.5px; color:var(--tinta-2); display:block; margin-top:1px}
.prog .pista{flex:2 1 240px; height:9px; background:var(--pista); border-radius:5px;
  overflow:hidden}
.prog .rell{height:100%; border-radius:5px; transition:width .45s cubic-bezier(.2,.7,.3,1);
  background:linear-gradient(90deg,var(--marca),var(--bien))}
@media (prefers-reduced-motion:reduce){ .prog .rell{transition:none} }
.prog .acc{display:flex; gap:8px; flex-wrap:wrap}

/* ═══ tareas ═══ */
.tareas{display:flex; flex-direction:column; gap:12px}
.tarea{background:var(--sup); border:1px solid var(--borde); border-radius:var(--r-s);
  padding:17px 19px; box-shadow:var(--sombra); display:grid;
  grid-template-columns:1fr auto; gap:18px; align-items:start}
@media (max-width:640px){ .tarea{grid-template-columns:1fr} }
.tarea.si{border-color:var(--bien); background:var(--bien-suave)}
.tarea .cu{min-width:0}
.pill{display:inline-flex; align-items:center; gap:6px; font-size:10.5px; font-weight:800;
  letter-spacing:.05em; text-transform:uppercase; padding:4px 11px; border-radius:999px;
  margin-bottom:10px}
.pill.accion{background:var(--marca-suave); color:var(--marca-2)}
.pill.obtener_dato{background:var(--falta-suave); color:var(--falta-tex)}
.pill.integridad{background:var(--alerta-suave); color:var(--alerta-tex)}
.tarea h3{margin-bottom:6px}
.tarea .de{font-size:13.5px; margin-bottom:11px; color:var(--tinta)}
.tarea .por{font-size:12px; color:var(--tinta-2); background:var(--sup-2);
  border:1px solid var(--borde); border-radius:var(--r-xs); padding:10px 12px;
  line-height:1.55; white-space:pre-wrap; word-break:break-word}
.tarea .por b{color:var(--tinta); font-weight:700}

/* ═══ paneles y gráficos ═══ */
.dos{display:grid; grid-template-columns:1fr 1fr; gap:14px}
@media (max-width:900px){ .dos{grid-template-columns:1fr} }
.panel{background:var(--sup); border:1px solid var(--borde); border-radius:var(--r-s);
  padding:19px 21px; box-shadow:var(--sombra)}
.panel h3{margin-bottom:4px}
.panel .aclara{font-size:12.5px; color:var(--tinta-2); margin-bottom:16px; line-height:1.45}
.panel .fuente{font-size:11.5px; color:var(--tinta-3); margin-top:15px; line-height:1.45}

.barras{display:flex; flex-direction:column; gap:13px}
.fila .et{font-size:13px; display:flex; justify-content:space-between; gap:12px;
  align-items:baseline; margin-bottom:6px}
.fila .et b{font-weight:800; font-variant-numeric:tabular-nums; white-space:nowrap}
.fila .pista{height:10px; background:var(--pista); border-radius:5px; overflow:hidden}
.fila .rell{height:100%; border-radius:0 5px 5px 0; background:var(--marca);
  transition:width .5s cubic-bezier(.2,.7,.3,1)}
.fila.mejor .rell{background:var(--bien)}
.fila.mejor .et b{color:var(--bien-tex)}
@media (prefers-reduced-motion:reduce){ .fila .rell{transition:none} }

.apil{display:flex; height:38px; border-radius:var(--r-xs); overflow:hidden; gap:2px;
  background:var(--pista)}
.seg{display:grid; place-items:center; min-width:3px}
.seg b{font-size:12.5px; font-weight:800; color:#fff; font-variant-numeric:tabular-nums;
  text-shadow:0 1px 3px rgba(0,0,0,.4)}
.ley{display:flex; flex-wrap:wrap; gap:7px 16px; margin-top:14px; font-size:12.5px}
.ley span{color:var(--tinta-2); display:inline-flex; align-items:center; gap:7px}
.ley i{width:11px; height:11px; border-radius:3px; flex:0 0 auto}
.ley b{color:var(--tinta); font-weight:800; font-variant-numeric:tabular-nums}
.libre{margin-top:14px; background:var(--bien-suave); border:1px solid var(--bien);
  border-radius:var(--r-xs); padding:11px 13px; font-size:12.5px}
.libre b{color:var(--bien-tex); font-weight:800}

details{margin-top:14px; border-top:1px solid var(--borde); padding-top:11px}
summary{font-size:12px; color:var(--tinta-2); cursor:pointer; font-weight:700;
  list-style:none; display:flex; align-items:center; gap:7px}
summary::-webkit-details-marker{display:none}
summary::before{content:"+"; font-weight:800; color:var(--marca)}
details[open] summary::before{content:"−"}
summary:focus-visible{outline:2px solid var(--marca); outline-offset:2px}
.tablaEnv{overflow-x:auto; margin-top:10px}
table{width:100%; border-collapse:collapse; font-size:12.5px}
th,td{text-align:left; padding:7px 10px; border-bottom:1px solid var(--borde)}
th{font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--tinta-3);
  font-weight:800}
td.n,th.n{text-align:right; font-variant-numeric:tabular-nums}

/* ═══ hallazgos ═══ */
.grid3{display:grid; grid-template-columns:repeat(auto-fit,minmax(272px,1fr)); gap:13px;
  align-items:start}
.hal{background:var(--sup); border:1px solid var(--borde); border-radius:var(--r-s);
  padding:17px 19px; box-shadow:var(--sombra)}
.hal.riesgo{background:var(--alerta-suave); border-color:var(--alerta)}
.hal.oportunidad{background:var(--bien-suave); border-color:var(--bien)}
.hal .tp{font-size:10.5px; font-weight:800; letter-spacing:.06em; text-transform:uppercase;
  margin-bottom:9px}
.hal.riesgo .tp{color:var(--alerta-tex)} .hal.oportunidad .tp{color:var(--bien-tex)}
.hal h3{margin-bottom:7px}
.hal p{font-size:13.5px; margin-bottom:10px}
.hal .cal{font-family:var(--fam-datos); font-size:11.5px; color:var(--tinta-2);
  background:var(--sup); border:1px solid var(--borde); border-radius:var(--r-xs);
  padding:9px 11px; white-space:pre-wrap; word-break:break-word; line-height:1.55}
.hal .ev{font-size:11.5px; color:var(--tinta-2); margin-top:11px; padding-top:10px;
  border-top:1px solid var(--borde); line-height:1.55}
.hal .adv{font-size:11.5px; font-style:italic; color:var(--tinta-2); margin-top:10px}

/* ═══ pie ═══ */
.pieP{border-top:1px solid var(--borde); padding-top:18px; margin-top:34px;
  font-size:12px; color:var(--tinta-3); line-height:1.6}
.pieP code{font-family:var(--fam-datos); font-size:11px; background:var(--sup-3);
  padding:2px 6px; border-radius:5px; color:var(--tinta-2)}

/* ═══ aviso flotante ═══ */
.toast{position:fixed; left:50%; bottom:26px; transform:translateX(-50%);
  background:var(--lateral); color:#fff; padding:12px 20px; border-radius:999px;
  font-size:13px; font-weight:700; box-shadow:var(--sombra-alta); z-index:50;
  opacity:0; pointer-events:none; transition:opacity .2s ease}
.toast.ver{opacity:1}
@media (prefers-reduced-motion:reduce){ .toast{transition:none} }

tos embebidos y publica las aprobaciones como una versión\n   nueva del propio artefacto, para que el estado se comparta entre quienes abren\n   la página.\n\n   Nota de arquitectura: el ARCHIVO que se publica es un fragmento (sin doctype,\n   html, head ni body) porque el visor lo envuelve en su propio esqueleto. Pero\n   documento(), que usa la auto-publicación, sí devuelve un documento COMPLETO,\n   que es lo que exige la capability. Son dos contratos distintos y hay que\n   respetar cada uno. */\n(function () {\n  \"use strict\";\n\n  var leer = function (id) {\n    var n = document.getElementById(id);\n    try { return n ? JSON.parse(n.textContent) : null; } catch (e) { return null; }\n  };\n  var D = leer(\"datos\") || {};\n  var E = leer(\"estado\") || { aprobadas: {}, version: 1 };\n  var P = leer(\"plantilla\") || { head: \"\", app: \"\", estilos: \"\" };\n  if (!E.aprobadas) E.aprobadas = {};\n\n  var soloLectura = false, api = null, temaManual = null;\n\n  var esc = function (s) {\n    return String(s == null ? \"\" : s).replace(/[&<>\"']/g, function (c) {\n      return { \"&\": \"&amp;\", \"<\": \"&lt;\", \">\": \"&gt;\", '\"': \"&quot;\", \"'\": \"&#39;\" }[c];\n    });\n  };\n  var dinero = function (n) {\n    return \"$\" + Number(n).toLocaleString(\"en-US\",\n      { minimumFractionDigits: 2, maximumFractionDigits: 2 });\n  };\n  var ent = function (n) {\n    return Number(n).toLocaleString(\"en-US\", { maximumFractionDigits: 0 });\n  };\n  var CAT = [\"var(--c1)\", \"var(--c2)\", \"var(--c3)\", \"var(--c4)\"];\n\n  /* Capa de lenguaje llano: nadie debería necesitar saber qué es actions:lead. */\n  function enClaro(ind) {\n    if (!ind) return \"sin indicador\";\n    if (/QualifiedLead/i.test(ind)) return \"Leads calificados\";\n    if (/complete_registration/i.test(ind)) return \"Registros completados\";\n    if (/link_click/i.test(ind)) return \"Clics en el enlace\";\n    if (/:lead$/i.test(ind)) return \"Leads\";\n    if (ind === \"mixed\") return \"Mezclado\";\n    return ind.replace(/^actions:/, \"\");\n  }\n  var TIPO = {\n    accion: { et: \"Se puede hacer ya\", ex: \"El dato alcanza para actuar.\" },\n    obtener_dato: { et: \"Falta un dato\", ex: \"Antes de actuar hay que conseguirlo.\" },\n    integridad: { et: \"Hay que corregir\", ex: \"Algo está mal configurado.\" }\n  };\n  var SECCIONES = [\n    { id: \"resumen\", n: \"Resumen\" },\n    { id: \"decision\", n: \"Decisión\" },\n    { id: \"rendimiento\", n: \"Rendimiento\" },\n    { id: \"evidencia\", n: \"Evidencia\" }\n  ];\n  var ico = {\n    tic: '<svg viewBox=\"0 0 24 24\"><path d=\"M4 12.5 9 17.5 20 6.5\"/></svg>',\n    x: '<svg viewBox=\"0 0 24 24\"><path d=\"M6 6l12 12M18 6L6 18\"/></svg>',\n    ojo: '<svg viewBox=\"0 0 24 24\"><path d=\"M12 3v13M12 20h.01\"/></svg>',\n    tema: '<svg viewBox=\"0 0 24 24\"><circle cx=\"12\" cy=\"12\" r=\"4.5\"/><path d=\"M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19M19 5l-1.5 1.5M6.5 17.5 5 19\"/></svg>',\n    copiar: '<svg viewBox=\"0 0 24 24\"><rect x=\"9\" y=\"9\" width=\"11\" height=\"11\" rx=\"2\"/><path d=\"M5 15V5a2 2 0 0 1 2-2h8\"/></svg>'\n  };\n\n  /* ═════════════ piezas ═════════════ */\n\n  function lateral() {\n    var c = D.corrida || {};\n    return '<aside class=\"lateral\">' +\n      '<div class=\"logo\"><div class=\"g\">MC</div><div class=\"marca-txt\">' +\n        \"<b>Mesa Creativa</b><span>QPayPro · Mercadeo</span></div></div>\" +\n      '<nav class=\"nav\">' + SECCIONES.map(function (s, i) {\n        var T = D.tareas_propuestas || [];\n        var falta = s.id === \"decision\"\n          ? T.filter(function (x) { return !E.aprobadas[x.idempotencia]; }).length : 0;\n        return '<a href=\"#' + s.id + '\"' + (i === 0 ? ' class=\"on\"' : \"\") +\n          ' data-sec=\"' + s.id + '\"><i></i>' + s.n +\n          (falta ? '<b class=\"badge\">' + falta + \"</b>\" : \"\") + \"</a>\";\n      }).join(\"\") + \"</nav>\" +\n      '<div class=\"pie\">Corrida del<br><b>' + esc(c.rango || \"\") + \"</b></div>\" +\n      \"</aside>\";\n  }\n\n  function barra() {\n    var n = (D.tareas_propuestas || []).length;\n    return '<div class=\"barra\"><div class=\"izq\"><h1>Reunión creativa</h1>' +\n      \"<p>Lo que la semana dice, y las \" + n + \" decisiones que quedan para la mesa.</p></div>\" +\n      '<div class=\"der\">' +\n      '<button class=\"btn chico\" type=\"button\" id=\"bCopiar\">' + ico.copiar +\n        \"Copiar resumen</button>\" +\n      '<button class=\"btn chico\" type=\"button\" id=\"bTema\" aria-label=\"Cambiar tema\">' +\n        ico.tema + \"Tema</button>\" +\n      \"</div></div>\";\n  }\n\n  function hero() {\n    var recs = (D.plan || {}).recomendaciones || [];\n    var q = recs.filter(function (r) { return r.cantidad; })[0];\n    if (!q) {\n      return '<div class=\"hero\"><div class=\"et\">Esta semana</div>' +\n        '<div class=\"cifra\">0</div><div class=\"un\">recomendaciones cuantificadas</div>' +\n        '<p class=\"exp\">El análisis no encontró una diferencia que se pueda cuantificar ' +\n        \"con los datos de esta corrida. Lo que falta está listado más abajo.</p></div>\";\n    }\n    var v = Math.abs(q.cantidad.valor - Math.round(q.cantidad.valor)) < 1e-9\n      ? ent(q.cantidad.valor) : q.cantidad.valor.toFixed(0);\n    return '<div class=\"hero\"><div class=\"et\">El número de la semana</div>' +\n      '<div class=\"cifra\">' + v + \"</div>\" +\n      '<div class=\"un\">' + esc(q.cantidad.unidad) + \"</div>\" +\n      '<p class=\"exp\">' + esc(q.accion) + \"</p>\" +\n      '<div class=\"calc\">' + esc(q.cantidad.calculo) + \"</div>\" +\n      (q.advertencia ? '<p class=\"adv\">' + esc(q.advertencia) + \"</p>\" : \"\") +\n      \"</div>\";\n  }\n\n  function cifras() {\n    var i = D.integridad || {}, det = D.consolidados_detalle || {};\n    var exc = i.mercados_excluidos_con_gasto || {};\n    var lead = det[\"actions:lead\"];\n    var t = [];\n    if (lead && lead.costo_por_resultado != null) {\n      t.push(cif(dinero(lead.costo_por_resultado), \"cuesta cada lead, en promedio\", \"\"));\n    }\n    var mal = (i.campanas_incoherentes || []).length;\n    t.push(cif(mal === 0 ? \"Todo cuadra\" : String(mal),\n      mal === 0 ? \"los números de la API coinciden con la interfaz de Meta\"\n                : \"campañas cuyo costo no cuadra\", mal === 0 ? \"ok\" : \"ojo\"));\n    Object.keys(exc).forEach(function (k) {\n      t.push(cif(dinero(exc[k].gasto), \"gastado en \" + k + \", que ya no es mercado nuestro\", \"ojo\"));\n    });\n    t.push(cif(String((D.tareas_propuestas || []).length), \"decisiones esperando a la mesa\", \"\"));\n    return '<div class=\"cifras\">' + t.join(\"\") + \"</div>\";\n  }\n  function cif(v, e, cl) {\n    return '<div class=\"cif' + (cl ? \" \" + cl : \"\") + '\"><div class=\"v\">' + esc(v) +\n      '</div><div class=\"e\">' + esc(e) + \"</div></div>\";\n  }\n\n  function avisos() {\n    var h = D.huecos_declarados || [];\n    var exc = (D.integridad || {}).mercados_excluidos_con_gasto || {};\n    var li = h.map(function (x) {\n      return \"<li><b>\" + esc(x.fuente) + \".</b> \" + esc(x.descripcion) + \" \" +\n        esc(x.impacto) + \"</li>\";\n    });\n    Object.keys(exc).forEach(function (k) {\n      li.push(\"<li><b>Hubo gasto en \" + esc(k) + \", que ya no es mercado nuestro.</b> \" +\n        esc(exc[k].accion_pendiente) + \"</li>\");\n    });\n    if (!li.length) return \"\";\n    return '<div class=\"aviso\"><h4>' + ico.ojo + \"Lo que esta corrida NO incluye</h4>\" +\n      \"<ul>\" + li.join(\"\") + \"</ul>\" +\n      '<p class=\"cierre\">Se declara, no se rellena. Si un dato falta, el sistema lo ' +\n      \"dice en lugar de estimarlo.</p></div>\";\n  }\n\n  function decision() {\n    var T = D.tareas_propuestas || [];\n    if (!T.length) return \"\";\n    var si = T.filter(function (t) { return E.aprobadas[t.idempotencia]; }).length;\n    var pct = T.length ? (si / T.length) * 100 : 0;\n\n    var filas = T.map(function (t) {\n      var ap = !!E.aprobadas[t.idempotencia];\n      var meta = TIPO[t.tipo] || { et: t.tipo, ex: \"\" };\n      return '<article class=\"tarea' + (ap ? \" si\" : \"\") + '\">' +\n        '<div class=\"cu\"><span class=\"pill ' + esc(t.tipo) + '\">' + esc(meta.et) + \"</span>\" +\n          \"<h3>\" + esc(t.titulo) + \"</h3>\" +\n          '<p class=\"de\">' + esc(t.descripcion) + \"</p>\" +\n          '<div class=\"por\"><b>Por qué:</b> ' + esc(t.justificacion) + \"</div></div>\" +\n        '<button class=\"btn ' + (ap ? \"\" : \"pri\") + '\" type=\"button\"' +\n          ' aria-pressed=\"' + ap + '\" data-clave=\"' + esc(t.idempotencia) + '\"' +\n          (soloLectura ? \" disabled\" : \"\") + \">\" +\n          (ap ? ico.tic + \"Aprobada\" : \"Aprobar\") + \"</button></article>\";\n    });\n\n    return '<section id=\"decision\"><div class=\"cab\"><h2>Decisión de la mesa</h2></div>' +\n      '<p class=\"sub\">Marca lo que se acordó en la reunión. <b>Nada se crea en Zoho ' +\n      \"Sprint desde aquí</b>: esta página guarda la decisión, y el sistema crea \" +\n      \"después solo lo aprobado.</p>\" +\n      '<div class=\"prog\"><div class=\"txt\"><b>' + si + \" de \" + T.length + \"</b>\" +\n        \"<span>tareas aprobadas</span></div>\" +\n        '<div class=\"pista\"><div class=\"rell\" style=\"width:' + pct.toFixed(0) +\n        '%\"></div></div>' +\n        '<div class=\"acc\">' +\n          '<button class=\"btn chico\" type=\"button\" id=\"bTodas\"' +\n            (soloLectura ? \" disabled\" : \"\") + \">\" + ico.tic + \"Aprobar todas</button>\" +\n          '<button class=\"btn chico\" type=\"button\" id=\"bNada\"' +\n            (soloLectura || si === 0 ? \" disabled\" : \"\") + \">\" + ico.x + \"Limpiar</button>\" +\n        \"</div></div>\" +\n      '<div class=\"tareas\">' + filas.join(\"\") + \"</div>\" +\n      '<div class=\"aviso\" style=\"margin-top:16px\"><h4>' + ico.ojo +\n      \"Un hueco no se convierte en una acción</h4>\" +\n      \"<ul><li>Cuando el análisis no alcanza para justificar una cantidad, la tarea \" +\n      \"que propone el sistema es <b>conseguir el dato que falta</b>, no actuar sin él. \" +\n      \"Por eso varias de arriba dicen «Falta un dato».</li></ul></div></section>\";\n  }\n\n  function panelCosto() {\n    var c = ((D.campanas_por_indicador_principal) || []).slice()\n      .sort(function (a, b) { return b.costo_por_resultado - a.costo_por_resultado; });\n    if (!c.length) return \"\";\n    var max = Math.max.apply(null, c.map(function (x) { return x.costo_por_resultado; }));\n    var min = Math.min.apply(null, c.map(function (x) { return x.costo_por_resultado; }));\n    var limpio = function (s) {\n      var n = String(s).replace(/^Campaña\\s+/, \"\");\n      var m = n.match(/^(.*?)\\s*\\[([A-Z]{2})\\]$/);\n      if (!m) return n;\n      var base = m[1].trim();\n      return new RegExp(\"\\\\b\" + m[2] + \"$\").test(base) ? base : base + \" · \" + m[2];\n    };\n    var barras = c.map(function (x) {\n      var mejor = x.costo_por_resultado === min;\n      return '<div class=\"fila' + (mejor ? \" mejor\" : \"\") + '\">' +\n        '<div class=\"et\"><span>' + esc(limpio(x.etiqueta)) +\n        (mejor ? \" · el más barato\" : \"\") + \"</span><b>\" +\n        dinero(x.costo_por_resultado) + \"</b></div>\" +\n        '<div class=\"pista\"><div class=\"rell\" style=\"width:' +\n        ((x.costo_por_resultado / max) * 100).toFixed(1) + '%\"></div></div></div>';\n    });\n    var tabla = '<div class=\"tablaEnv\"><table><thead><tr><th>Campaña</th>' +\n      '<th class=\"n\">Costo por lead</th><th class=\"n\">Leads</th>' +\n      '<th class=\"n\">Invertido</th></tr></thead><tbody>' +\n      c.map(function (x) {\n        return \"<tr><td>\" + esc(limpio(x.etiqueta)) + '</td><td class=\"n\">' +\n          dinero(x.costo_por_resultado) + '</td><td class=\"n\">' + ent(x.resultados) +\n          '</td><td class=\"n\">' + dinero(x.gasto) + \"</td></tr>\";\n      }).join(\"\") + \"</tbody></table></div>\";\n    return '<div class=\"panel\"><h3>Cuánto cuesta cada lead</h3>' +\n      '<p class=\"aclara\">Barra más corta es mejor. Solo se comparan campañas que miden ' +\n      \"lo mismo — no se mezclan leads con clics.</p>\" +\n      '<div class=\"barras\">' + barras.join(\"\") + \"</div>\" +\n      \"<details><summary>Ver los números en tabla</summary>\" + tabla + \"</details>\" +\n      '<p class=\"fuente\">Periodo ' + esc((D.corrida || {}).rango || \"\") + \"</p></div>\";\n  }\n\n  function panelPresion() {\n    var comp = D.competencia || {}, m = Object.keys(comp);\n    if (!m.length) return \"\";\n    var pr = m.reduce(function (a, b) {\n      return comp[b].presion_total > comp[a].presion_total ? b : a;\n    }, m[0]);\n    var det = comp[pr].detalle || {};\n    var act = Object.keys(det).filter(function (n) { return det[n].presion_real > 0; })\n      .sort(function (a, b) { return det[b].presion_real - det[a].presion_real; });\n    if (!act.length) return \"\";\n    var total = act.reduce(function (s, n) { return s + det[n].presion_real; }, 0);\n    var decl = Object.keys(det).reduce(function (s, n) {\n      return s + det[n].activos_declarados; }, 0);\n    var segs = act.map(function (n, k) {\n      var v = det[n].presion_real, pct = (v / total) * 100;\n      return '<div class=\"seg\" style=\"flex:' + v + \";background:\" + CAT[k % 4] + '\">' +\n        (pct >= 9 ? \"<b>\" + v + \"</b>\" : \"\") + \"</div>\";\n    });\n    var ley = act.map(function (n, k) {\n      return \"<span><i style=\\\"background:\" + CAT[k % 4] + '\"></i>' + esc(n) +\n        \" <b>\" + det[n].presion_real + \"</b></span>\";\n    });\n    var libres = m.filter(function (x) { return comp[x].presion_total === 0; });\n    var tabla = '<div class=\"tablaEnv\"><table><thead><tr><th>Competidor</th>' +\n      '<th class=\"n\">Anuncios totales</th><th class=\"n\">De pagos</th></tr></thead><tbody>' +\n      Object.keys(det).sort(function (a, b) {\n        return det[b].presion_real - det[a].presion_real; }).map(function (n) {\n        return \"<tr><td>\" + esc(n) + '</td><td class=\"n\">' +\n          ent(det[n].activos_declarados) + '</td><td class=\"n\">' +\n          ent(det[n].presion_real) + \"</td></tr>\";\n      }).join(\"\") + \"</tbody></table></div>\";\n    return '<div class=\"panel\"><h3>Quién nos disputa el terreno en ' + esc(pr) + \"</h3>\" +\n      '<p class=\"aclara\">Contar anuncios engaña: entre todos suman ' + ent(decl) +\n      \" activos, pero solo <b>\" + ent(total) + \"</b> hablan de pagos. Esos son los \" +\n      \"que compiten con nosotros.</p>\" +\n      '<div class=\"apil\">' + segs.join(\"\") + \"</div>\" +\n      '<div class=\"ley\">' + ley.join(\"\") + \"</div>\" +\n      (libres.length ? '<div class=\"libre\"><b>' + esc(libres.join(\", \")) +\n        \" está libre.</b> Ninguno de los competidores que seguimos pauta ahí.</div>\" : \"\") +\n      \"<details><summary>Ver los números en tabla</summary>\" + tabla + \"</details>\" +\n      '<p class=\"fuente\">La biblioteca de anuncios de Meta no acepta fechas: es una foto ' +\n      \"del día de la corrida, no una serie histórica.</p></div>\";\n  }\n\n  function rendimiento() {\n    var det = D.consolidados_detalle || {};\n    var usables = Object.keys(det).filter(function (k) { return det[k].resultados > 0; });\n    var chips = usables.sort(function (a, b) { return det[b].gasto - det[a].gasto; })\n      .map(function (k) {\n        var v = det[k];\n        return '<div class=\"cif\"><div class=\"v\">' + ent(v.resultados) + \"</div>\" +\n          '<div class=\"e\"><b>' + esc(enClaro(k)) + \"</b><br>\" + dinero(v.gasto) + \" · \" +\n          (v.costo_por_resultado != null ? dinero(v.costo_por_resultado) + \" cada uno\" : \"—\") +\n          \"</div></div>\";\n      });\n    return '<section id=\"rendimiento\"><div class=\"cab\"><h2>Rendimiento</h2></div>' +\n      '<p class=\"sub\">Cada campaña mide un resultado distinto, así que se cuentan por ' +\n      \"separado. Sumarlos daría un número que parece correcto y no lo es.</p>\" +\n      (chips.length ? '<div class=\"cifras\">' + chips.join(\"\") + \"</div>\" : \"\") +\n      '<div class=\"dos\">' + panelCosto() + panelPresion() + \"</div></section>\";\n  }\n\n  function evidencia() {\n    var h = D.hallazgos || [];\n    if (!h.length) return \"\";\n    var ord = { oportunidad: 0, riesgo: 1, observacion: 2 };\n    var t = h.slice().sort(function (a, b) {\n      return (ord[a.tipo] || 9) - (ord[b.tipo] || 9);\n    }).map(function (x) {\n      var ev = (x.evidencia || []).map(function (e) {\n        return \"<b>\" + esc(e.dato) + \":</b> \" + esc(e.valor); }).join(\"<br>\");\n      return '<article class=\"hal ' + esc(x.tipo) + '\"><div class=\"tp\">' +\n        (x.tipo === \"riesgo\" ? \"Ojo con esto\" : x.tipo === \"oportunidad\"\n          ? \"Oportunidad\" : \"Observación\") + \"</div>\" +\n        \"<h3>\" + esc(x.titulo) + \"</h3><p>\" + esc(x.afirmacion) + \"</p>\" +\n        (x.calculo ? '<div class=\"cal\">' + esc(x.calculo) + \"</div>\" : \"\") +\n        (ev ? '<div class=\"ev\">' + ev + \"</div>\" : \"\") +\n        (x.advertencia ? '<p class=\"adv\">' + esc(x.advertencia) + \"</p>\" : \"\") +\n        \"</article>\";\n    });\n    return '<section id=\"evidencia\"><div class=\"cab\"><h2>Evidencia</h2></div>' +\n      '<p class=\"sub\">Lo que sostiene las decisiones de arriba. Cada punto cita el dato ' +\n      'del que salió.</p><div class=\"grid3\">' + t.join(\"\") + \"</div></section>\";\n  }\n\n  function cuerpo() {\n    var v = D.verificacion_semana_anterior || \"\";\n    return '<div class=\"app\">' + lateral() + '<main class=\"principal\">' +\n      (soloLectura ? '<div class=\"lectura\">Estás viendo esta página en <b>modo ' +\n        \"lectura</b>. Puedes revisar todo; las aprobaciones las registra quien tiene \" +\n        \"permiso de escritura.</div>\" : \"\") +\n      barra() +\n      '<section id=\"resumen\">' + hero() + cifras() + avisos() +\n      '<div class=\"panel\"><h3>Comparación con la semana anterior</h3>' +\n      '<p class=\"aclara\" style=\"margin:6px 0 0\">' + esc(v) + \"</p></div></section>\" +\n      decision() + rendimiento() + evidencia() +\n      '<footer class=\"pieP\">Cada cifra de esta página es trazable hasta la consulta ' +\n      \"que la produjo. Las respuestas crudas de las APIs quedan guardadas sin editar \" +\n      \"en <code>data/historico/</code> junto a la corrida, para que cualquiera pueda \" +\n      \"verificar de dónde salió un número.</footer>\" +\n      '</main></div><div class=\"toast\" id=\"toast\" role=\"status\"></div>';\n  }\n\n  /* ═════════════ interacción ═════════════ */\n\n  function avisar(txt) {\n    var t = document.getElementById(\"toast\");\n    if (!t) return;\n    t.textContent = txt; t.classList.add(\"ver\");\n    clearTimeout(avisar._t);\n    avisar._t = setTimeout(function () { t.classList.remove(\"ver\"); }, 2400);\n  }\n\n  /* Se renderiza en un contenedor propio, NUNCA reemplazando todo el body.\n     Cuando la página se publica como fragmento, el <style> y el <link> de\n     fuentes viven dentro del body: hacer body.innerHTML = ... los destruía y\n     la página quedaba sin una sola línea de CSS. Pasó, y así no puede volver\n     a pasar. */\n  function raiz() {\n    var r = document.getElementById(\"raiz\");\n    if (!r) {\n      r = document.createElement(\"div\");\n      r.id = \"raiz\";\n      document.body.appendChild(r);\n    }\n    return r;\n  }\n\n  function pintar() {\n    raiz().innerHTML = cuerpo();\n    if (temaManual) document.documentElement.setAttribute(\"data-theme\", temaManual);\n\n    raiz().querySelectorAll(\"[data-clave]\").forEach(function (b) {\n      b.addEventListener(\"click\", function () { alternar([b.dataset.clave]); });\n    });\n    var todas = document.getElementById(\"bTodas\");\n    if (todas) todas.addEventListener(\"click\", function () {\n      alternar((D.tareas_propuestas || []).filter(function (t) {\n        return !E.aprobadas[t.idempotencia];\n      }).map(function (t) { return t.idempotencia; }), \"aprobar\");\n    });\n    var nada = document.getElementById(\"bNada\");\n    if (nada) nada.addEventListener(\"click\", function () {\n      alternar(Object.keys(E.aprobadas), \"quitar\");\n    });\n    var tema = document.getElementById(\"bTema\");\n    if (tema) tema.addEventListener(\"click\", function () {\n      var actual = document.documentElement.getAttribute(\"data-theme\");\n      var oscuroSis = window.matchMedia &&\n        window.matchMedia(\"(prefers-color-scheme: dark)\").matches;\n      temaManual = actual ? (actual === \"dark\" ? \"light\" : \"dark\")\n        : (oscuroSis ? \"light\" : \"dark\");\n      document.documentElement.setAttribute(\"data-theme\", temaManual);\n    });\n    var cop = document.getElementById(\"bCopiar\");\n    if (cop) cop.addEventListener(\"click\", copiar);\n\n    var secs = SECCIONES.map(function (s) { return document.getElementById(s.id); })\n      .filter(Boolean);\n    if (window.IntersectionObserver && secs.length) {\n      var obs = new IntersectionObserver(function (es) {\n        es.forEach(function (e) {\n          if (!e.isIntersecting) return;\n          raiz().querySelectorAll(\".nav a\").forEach(function (a) {\n            a.classList.toggle(\"on\", a.dataset.sec === e.target.id);\n          });\n        });\n      }, { rootMargin: \"-15% 0px -70% 0px\" });\n      secs.forEach(function (s) { obs.observe(s); });\n    }\n  }\n\n  function copiar() {\n    var T = D.tareas_propuestas || [], c = D.corrida || {};\n    var l = [\"Mesa Creativa · \" + (c.rango || \"\"), \"\"];\n    T.forEach(function (t) {\n      l.push((E.aprobadas[t.idempotencia] ? \"[x] \" : \"[ ] \") + t.titulo);\n      l.push(\"    \" + t.descripcion);\n    });\n    var h = D.huecos_declarados || [];\n    if (h.length) {\n      l.push(\"\", \"No incluye:\");\n      h.forEach(function (x) { l.push(\"  - \" + x.fuente + \": \" + x.descripcion); });\n    }\n    var txt = l.join(\"\\n\");\n    var ok = function () { avisar(\"Resumen copiado\"); };\n    if (navigator.clipboard && navigator.clipboard.writeText) {\n      navigator.clipboard.writeText(txt).then(ok, function () { avisar(\"No se pudo copiar\"); });\n    } else { avisar(\"No se pudo copiar\"); }\n  }\n\n  function alternar(claves, forzar) {\n    if (!claves || !claves.length || soloLectura) return;\n    claves.forEach(function (k) {\n      var hay = !!E.aprobadas[k];\n      var quiero = forzar === \"aprobar\" ? true : forzar === \"quitar\" ? false : !hay;\n      if (quiero) E.aprobadas[k] = { en: new Date().toISOString() };\n      else delete E.aprobadas[k];\n    });\n    E.version = (E.version || 1) + 1;\n    pintar();\n    if (!api) { avisar(\"Guardado solo en esta vista\"); return; }\n    api.publish(documento()).catch(function (err) {\n      var c = err && err.code;\n      if (c === \"conflict\") return;\n      if (c === \"not_writer\" || c === \"not_granted\" || c === \"not_declared\" ||\n          c === \"consent_required\" || c === \"capability_disabled\" ||\n          c === \"capability_removed\") {\n        soloLectura = true; api = null; pintar();\n        avisar(\"Esta vista es de solo lectura\"); return;\n      }\n      if (c === \"rate_limited\") { avisar(\"Demasiados cambios seguidos, espera un momento\"); return; }\n      avisar(\"No se pudo guardar la aprobación\");\n    });\n  }\n\n  /* documento() DEBE devolver un documento completo: es lo que exige la\n     capability de auto-publicación. El archivo original en cambio es un\n     fragmento, porque el visor lo envuelve. */\n  function documento() {\n    var j = function (o) {\n      return JSON.stringify(o).replace(/<\\/script/gi, \"<\\\\/script\");\n    };\n    return \"<!doctype html>\\n<html lang=\\\"es\\\">\\n<head>\\n\" + P.head +\n      \"\\n</head>\\n<body>\\n\" +\n      '<script id=\"datos\" type=\"application/json\">' + j(D) + \"<\\/script>\\n\" +\n      '<script id=\"estado\" type=\"application/json\">' + j(E) + \"<\\/script>\\n\" +\n      '<script id=\"plantilla\" type=\"application/json\">' + j(P) + \"<\\/script>\\n\" +\n      \"<script>\" + P.app + \"<\\/script>\\n</body>\\n</html>\";\n  }\n\n  pintar();\n\n  try {\n    Object.defineProperty(window, \"__tablero\", {\n      value: Object.freeze({ documento: documento }),\n      writable: false, configurable: false, enumerable: false\n    });\n  } catch (e) { /* entorno que no lo permite: la página funciona igual */ }\n\n  if (window.claude && typeof window.claude.use === \"function\") {\n    window.claude.use(\"artifact\").then(function (a) {\n      if (!a) { soloLectura = true; pintar(); return; }\n      api = a;\n    }).catch(function () { soloLectura = true; pintar(); });\n  } else { soloLectura = true; pintar(); }\n})();\n"}</script>
<script>/* Tablero semanal · lógica de cliente.
   Renderiza desde los datos embebidos y publica las aprobaciones como una versión
   nueva del propio artefacto, para que el estado se comparta entre quienes abren
   la página.

   Nota de arquitectura: el ARCHIVO que se publica es un fragmento (sin doctype,
   html, head ni body) porque el visor lo envuelve en su propio esqueleto. Pero
   documento(), que usa la auto-publicación, sí devuelve un documento COMPLETO,
   que es lo que exige la capability. Son dos contratos distintos y hay que
   respetar cada uno. */
(function () {
  "use strict";

  var leer = function (id) {
    var n = document.getElementById(id);
    try { return n ? JSON.parse(n.textContent) : null; } catch (e) { return null; }
  };
  var D = leer("datos") || {};
  var E = leer("estado") || { aprobadas: {}, version: 1 };
  var P = leer("plantilla") || { head: "", app: "", estilos: "" };
  if (!E.aprobadas) E.aprobadas = {};

  var soloLectura = false, api = null, temaManual = null;

  var esc = function (s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  };
  var dinero = function (n) {
    return "$" + Number(n).toLocaleString("en-US",
      { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  };
  var ent = function (n) {
    return Number(n).toLocaleString("en-US", { maximumFractionDigits: 0 });
  };
  var CAT = ["var(--c1)", "var(--c2)", "var(--c3)", "var(--c4)"];

  /* Capa de lenguaje llano: nadie debería necesitar saber qué es actions:lead. */
  function enClaro(ind) {
    if (!ind) return "sin indicador";
    if (/QualifiedLead/i.test(ind)) return "Leads calificados";
    if (/complete_registration/i.test(ind)) return "Registros completados";
    if (/link_click/i.test(ind)) return "Clics en el enlace";
    if (/:lead$/i.test(ind)) return "Leads";
    if (ind === "mixed") return "Mezclado";
    return ind.replace(/^actions:/, "");
  }
  var TIPO = {
    accion: { et: "Se puede hacer ya", ex: "El dato alcanza para actuar." },
    obtener_dato: { et: "Falta un dato", ex: "Antes de actuar hay que conseguirlo." },
    integridad: { et: "Hay que corregir", ex: "Algo está mal configurado." }
  };
  var SECCIONES = [
    { id: "resumen", n: "Resumen" },
    { id: "decision", n: "Decisión" },
    { id: "rendimiento", n: "Rendimiento" },
    { id: "evidencia", n: "Evidencia" }
  ];
  var ico = {
    tic: '<svg viewBox="0 0 24 24"><path d="M4 12.5 9 17.5 20 6.5"/></svg>',
    x: '<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>',
    ojo: '<svg viewBox="0 0 24 24"><path d="M12 3v13M12 20h.01"/></svg>',
    tema: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19M19 5l-1.5 1.5M6.5 17.5 5 19"/></svg>',
    copiar: '<svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/></svg>'
  };

  /* ═════════════ piezas ═════════════ */

  function lateral() {
    var c = D.corrida || {};
    return '<aside class="lateral">' +
      '<div class="logo"><div class="g">MC</div><div class="marca-txt">' +
        "<b>Mesa Creativa</b><span>QPayPro · Mercadeo</span></div></div>" +
      '<nav class="nav">' + SECCIONES.map(function (s, i) {
        var T = D.tareas_propuestas || [];
        var falta = s.id === "decision"
          ? T.filter(function (x) { return !E.aprobadas[x.idempotencia]; }).length : 0;
        return '<a href="#' + s.id + '"' + (i === 0 ? ' class="on"' : "") +
          ' data-sec="' + s.id + '"><i></i>' + s.n +
          (falta ? '<b class="badge">' + falta + "</b>" : "") + "</a>";
      }).join("") + "</nav>" +
      '<div class="pie">Corrida del<br><b>' + esc(c.rango || "") + "</b></div>" +
      "</aside>";
  }

  function barra() {
    var n = (D.tareas_propuestas || []).length;
    return '<div class="barra"><div class="izq"><h1>Reunión creativa</h1>' +
      "<p>Lo que la semana dice, y las " + n + " decisiones que quedan para la mesa.</p></div>" +
      '<div class="der">' +
      '<button class="btn chico" type="button" id="bCopiar">' + ico.copiar +
        "Copiar resumen</button>" +
      '<button class="btn chico" type="button" id="bTema" aria-label="Cambiar tema">' +
        ico.tema + "Tema</button>" +
      "</div></div>";
  }

  function hero() {
    var recs = (D.plan || {}).recomendaciones || [];
    var q = recs.filter(function (r) { return r.cantidad; })[0];
    if (!q) {
      return '<div class="hero"><div class="et">Esta semana</div>' +
        '<div class="cifra">0</div><div class="un">recomendaciones cuantificadas</div>' +
        '<p class="exp">El análisis no encontró una diferencia que se pueda cuantificar ' +
        "con los datos de esta corrida. Lo que falta está listado más abajo.</p></div>";
    }
    var v = Math.abs(q.cantidad.valor - Math.round(q.cantidad.valor)) < 1e-9
      ? ent(q.cantidad.valor) : q.cantidad.valor.toFixed(0);
    return '<div class="hero"><div class="et">El número de la semana</div>' +
      '<div class="cifra">' + v + "</div>" +
      '<div class="un">' + esc(q.cantidad.unidad) + "</div>" +
      '<p class="exp">' + esc(q.accion) + "</p>" +
      '<div class="calc">' + esc(q.cantidad.calculo) + "</div>" +
      (q.advertencia ? '<p class="adv">' + esc(q.advertencia) + "</p>" : "") +
      "</div>";
  }

  function cifras() {
    var i = D.integridad || {}, det = D.consolidados_detalle || {};
    var exc = i.mercados_excluidos_con_gasto || {};
    var lead = det["actions:lead"];
    var t = [];
    if (lead && lead.costo_por_resultado != null) {
      t.push(cif(dinero(lead.costo_por_resultado), "cuesta cada lead, en promedio", ""));
    }
    var mal = (i.campanas_incoherentes || []).length;
    t.push(cif(mal === 0 ? "Todo cuadra" : String(mal),
      mal === 0 ? "los números de la API coinciden con la interfaz de Meta"
                : "campañas cuyo costo no cuadra", mal === 0 ? "ok" : "ojo"));
    Object.keys(exc).forEach(function (k) {
      t.push(cif(dinero(exc[k].gasto), "gastado en " + k + ", que ya no es mercado nuestro", "ojo"));
    });
    t.push(cif(String((D.tareas_propuestas || []).length), "decisiones esperando a la mesa", ""));
    return '<div class="cifras">' + t.join("") + "</div>";
  }
  function cif(v, e, cl) {
    return '<div class="cif' + (cl ? " " + cl : "") + '"><div class="v">' + esc(v) +
      '</div><div class="e">' + esc(e) + "</div></div>";
  }

  function avisos() {
    var h = D.huecos_declarados || [];
    var exc = (D.integridad || {}).mercados_excluidos_con_gasto || {};
    var li = h.map(function (x) {
      return "<li><b>" + esc(x.fuente) + ".</b> " + esc(x.descripcion) + " " +
        esc(x.impacto) + "</li>";
    });
    Object.keys(exc).forEach(function (k) {
      li.push("<li><b>Hubo gasto en " + esc(k) + ", que ya no es mercado nuestro.</b> " +
        esc(exc[k].accion_pendiente) + "</li>");
    });
    if (!li.length) return "";
    return '<div class="aviso"><h4>' + ico.ojo + "Lo que esta corrida NO incluye</h4>" +
      "<ul>" + li.join("") + "</ul>" +
      '<p class="cierre">Se declara, no se rellena. Si un dato falta, el sistema lo ' +
      "dice en lugar de estimarlo.</p></div>";
  }

  function decision() {
    var T = D.tareas_propuestas || [];
    if (!T.length) return "";
    var si = T.filter(function (t) { return E.aprobadas[t.idempotencia]; }).length;
    var pct = T.length ? (si / T.length) * 100 : 0;

    var filas = T.map(function (t) {
      var ap = !!E.aprobadas[t.idempotencia];
      var meta = TIPO[t.tipo] || { et: t.tipo, ex: "" };
      return '<article class="tarea' + (ap ? " si" : "") + '">' +
        '<div class="cu"><span class="pill ' + esc(t.tipo) + '">' + esc(meta.et) + "</span>" +
          "<h3>" + esc(t.titulo) + "</h3>" +
          '<p class="de">' + esc(t.descripcion) + "</p>" +
          '<div class="por"><b>Por qué:</b> ' + esc(t.justificacion) + "</div></div>" +
        '<button class="btn ' + (ap ? "" : "pri") + '" type="button"' +
          ' aria-pressed="' + ap + '" data-clave="' + esc(t.idempotencia) + '"' +
          (soloLectura ? " disabled" : "") + ">" +
          (ap ? ico.tic + "Aprobada" : "Aprobar") + "</button></article>";
    });

    return '<section id="decision"><div class="cab"><h2>Decisión de la mesa</h2></div>' +
      '<p class="sub">Marca lo que se acordó en la reunión. <b>Nada se crea en Zoho ' +
      "Sprint desde aquí</b>: esta página guarda la decisión, y el sistema crea " +
      "después solo lo aprobado.</p>" +
      '<div class="prog"><div class="txt"><b>' + si + " de " + T.length + "</b>" +
        "<span>tareas aprobadas</span></div>" +
        '<div class="pista"><div class="rell" style="width:' + pct.toFixed(0) +
        '%"></div></div>' +
        '<div class="acc">' +
          '<button class="btn chico" type="button" id="bTodas"' +
            (soloLectura ? " disabled" : "") + ">" + ico.tic + "Aprobar todas</button>" +
          '<button class="btn chico" type="button" id="bNada"' +
            (soloLectura || si === 0 ? " disabled" : "") + ">" + ico.x + "Limpiar</button>" +
        "</div></div>" +
      '<div class="tareas">' + filas.join("") + "</div>" +
      '<div class="aviso" style="margin-top:16px"><h4>' + ico.ojo +
      "Un hueco no se convierte en una acción</h4>" +
      "<ul><li>Cuando el análisis no alcanza para justificar una cantidad, la tarea " +
      "que propone el sistema es <b>conseguir el dato que falta</b>, no actuar sin él. " +
      "Por eso varias de arriba dicen «Falta un dato».</li></ul></div></section>";
  }

  function panelCosto() {
    var c = ((D.campanas_por_indicador_principal) || []).slice()
      .sort(function (a, b) { return b.costo_por_resultado - a.costo_por_resultado; });
    if (!c.length) return "";
    var max = Math.max.apply(null, c.map(function (x) { return x.costo_por_resultado; }));
    var min = Math.min.apply(null, c.map(function (x) { return x.costo_por_resultado; }));
    var limpio = function (s) {
      var n = String(s).replace(/^Campaña\s+/, "");
      var m = n.match(/^(.*?)\s*\[([A-Z]{2})\]$/);
      if (!m) return n;
      var base = m[1].trim();
      return new RegExp("\\b" + m[2] + "$").test(base) ? base : base + " · " + m[2];
    };
    var barras = c.map(function (x) {
      var mejor = x.costo_por_resultado === min;
      return '<div class="fila' + (mejor ? " mejor" : "") + '">' +
        '<div class="et"><span>' + esc(limpio(x.etiqueta)) +
        (mejor ? " · el más barato" : "") + "</span><b>" +
        dinero(x.costo_por_resultado) + "</b></div>" +
        '<div class="pista"><div class="rell" style="width:' +
        ((x.costo_por_resultado / max) * 100).toFixed(1) + '%"></div></div></div>';
    });
    var tabla = '<div class="tablaEnv"><table><thead><tr><th>Campaña</th>' +
      '<th class="n">Costo por lead</th><th class="n">Leads</th>' +
      '<th class="n">Invertido</th></tr></thead><tbody>' +
      c.map(function (x) {
        return "<tr><td>" + esc(limpio(x.etiqueta)) + '</td><td class="n">' +
          dinero(x.costo_por_resultado) + '</td><td class="n">' + ent(x.resultados) +
          '</td><td class="n">' + dinero(x.gasto) + "</td></tr>";
      }).join("") + "</tbody></table></div>";
    return '<div class="panel"><h3>Cuánto cuesta cada lead</h3>' +
      '<p class="aclara">Barra más corta es mejor. Solo se comparan campañas que miden ' +
      "lo mismo — no se mezclan leads con clics.</p>" +
      '<div class="barras">' + barras.join("") + "</div>" +
      "<details><summary>Ver los números en tabla</summary>" + tabla + "</details>" +
      '<p class="fuente">Periodo ' + esc((D.corrida || {}).rango || "") + "</p></div>";
  }

  function panelPresion() {
    var comp = D.competencia || {}, m = Object.keys(comp);
    if (!m.length) return "";
    var pr = m.reduce(function (a, b) {
      return comp[b].presion_total > comp[a].presion_total ? b : a;
    }, m[0]);
    var det = comp[pr].detalle || {};
    var act = Object.keys(det).filter(function (n) { return det[n].presion_real > 0; })
      .sort(function (a, b) { return det[b].presion_real - det[a].presion_real; });
    if (!act.length) return "";
    var total = act.reduce(function (s, n) { return s + det[n].presion_real; }, 0);
    var decl = Object.keys(det).reduce(function (s, n) {
      return s + det[n].activos_declarados; }, 0);
    var segs = act.map(function (n, k) {
      var v = det[n].presion_real, pct = (v / total) * 100;
      return '<div class="seg" style="flex:' + v + ";background:" + CAT[k % 4] + '">' +
        (pct >= 9 ? "<b>" + v + "</b>" : "") + "</div>";
    });
    var ley = act.map(function (n, k) {
      return "<span><i style=\"background:" + CAT[k % 4] + '"></i>' + esc(n) +
        " <b>" + det[n].presion_real + "</b></span>";
    });
    var libres = m.filter(function (x) { return comp[x].presion_total === 0; });
    var tabla = '<div class="tablaEnv"><table><thead><tr><th>Competidor</th>' +
      '<th class="n">Anuncios totales</th><th class="n">De pagos</th></tr></thead><tbody>' +
      Object.keys(det).sort(function (a, b) {
        return det[b].presion_real - det[a].presion_real; }).map(function (n) {
        return "<tr><td>" + esc(n) + '</td><td class="n">' +
          ent(det[n].activos_declarados) + '</td><td class="n">' +
          ent(det[n].presion_real) + "</td></tr>";
      }).join("") + "</tbody></table></div>";
    return '<div class="panel"><h3>Quién nos disputa el terreno en ' + esc(pr) + "</h3>" +
      '<p class="aclara">Contar anuncios engaña: entre todos suman ' + ent(decl) +
      " activos, pero solo <b>" + ent(total) + "</b> hablan de pagos. Esos son los " +
      "que compiten con nosotros.</p>" +
      '<div class="apil">' + segs.join("") + "</div>" +
      '<div class="ley">' + ley.join("") + "</div>" +
      (libres.length ? '<div class="libre"><b>' + esc(libres.join(", ")) +
        " está libre.</b> Ninguno de los competidores que seguimos pauta ahí.</div>" : "") +
      "<details><summary>Ver los números en tabla</summary>" + tabla + "</details>" +
      '<p class="fuente">La biblioteca de anuncios de Meta no acepta fechas: es una foto ' +
      "del día de la corrida, no una serie histórica.</p></div>";
  }

  function rendimiento() {
    var det = D.consolidados_detalle || {};
    var usables = Object.keys(det).filter(function (k) { return det[k].resultados > 0; });
    var chips = usables.sort(function (a, b) { return det[b].gasto - det[a].gasto; })
      .map(function (k) {
        var v = det[k];
        return '<div class="cif"><div class="v">' + ent(v.resultados) + "</div>" +
          '<div class="e"><b>' + esc(enClaro(k)) + "</b><br>" + dinero(v.gasto) + " · " +
          (v.costo_por_resultado != null ? dinero(v.costo_por_resultado) + " cada uno" : "—") +
          "</div></div>";
      });
    return '<section id="rendimiento"><div class="cab"><h2>Rendimiento</h2></div>' +
      '<p class="sub">Cada campaña mide un resultado distinto, así que se cuentan por ' +
      "separado. Sumarlos daría un número que parece correcto y no lo es.</p>" +
      (chips.length ? '<div class="cifras">' + chips.join("") + "</div>" : "") +
      '<div class="dos">' + panelCosto() + panelPresion() + "</div></section>";
  }

  function evidencia() {
    var h = D.hallazgos || [];
    if (!h.length) return "";
    var ord = { oportunidad: 0, riesgo: 1, observacion: 2 };
    var t = h.slice().sort(function (a, b) {
      return (ord[a.tipo] || 9) - (ord[b.tipo] || 9);
    }).map(function (x) {
      var ev = (x.evidencia || []).map(function (e) {
        return "<b>" + esc(e.dato) + ":</b> " + esc(e.valor); }).join("<br>");
      return '<article class="hal ' + esc(x.tipo) + '"><div class="tp">' +
        (x.tipo === "riesgo" ? "Ojo con esto" : x.tipo === "oportunidad"
          ? "Oportunidad" : "Observación") + "</div>" +
        "<h3>" + esc(x.titulo) + "</h3><p>" + esc(x.afirmacion) + "</p>" +
        (x.calculo ? '<div class="cal">' + esc(x.calculo) + "</div>" : "") +
        (ev ? '<div class="ev">' + ev + "</div>" : "") +
        (x.advertencia ? '<p class="adv">' + esc(x.advertencia) + "</p>" : "") +
        "</article>";
    });
    return '<section id="evidencia"><div class="cab"><h2>Evidencia</h2></div>' +
      '<p class="sub">Lo que sostiene las decisiones de arriba. Cada punto cita el dato ' +
      'del que salió.</p><div class="grid3">' + t.join("") + "</div></section>";
  }

  function cuerpo() {
    var v = D.verificacion_semana_anterior || "";
    return '<div class="app">' + lateral() + '<main class="principal">' +
      (soloLectura ? '<div class="lectura">Estás viendo esta página en <b>modo ' +
        "lectura</b>. Puedes revisar todo; las aprobaciones las registra quien tiene " +
        "permiso de escritura.</div>" : "") +
      barra() +
      '<section id="resumen">' + hero() + cifras() + avisos() +
      '<div class="panel"><h3>Comparación con la semana anterior</h3>' +
      '<p class="aclara" style="margin:6px 0 0">' + esc(v) + "</p></div></section>" +
      decision() + rendimiento() + evidencia() +
      '<footer class="pieP">Cada cifra de esta página es trazable hasta la consulta ' +
      "que la produjo. Las respuestas crudas de las APIs quedan guardadas sin editar " +
      "en <code>data/historico/</code> junto a la corrida, para que cualquiera pueda " +
      "verificar de dónde salió un número.</footer>" +
      '</main></div><div class="toast" id="toast" role="status"></div>';
  }

  /* ═════════════ interacción ═════════════ */

  function avisar(txt) {
    var t = document.getElementById("toast");
    if (!t) return;
    t.textContent = txt; t.classList.add("ver");
    clearTimeout(avisar._t);
    avisar._t = setTimeout(function () { t.classList.remove("ver"); }, 2400);
  }

  /* Se renderiza en un contenedor propio, NUNCA reemplazando todo el body.
     Cuando la página se publica como fragmento, el <style> y el <link> de
     fuentes viven dentro del body: hacer body.innerHTML = ... los destruía y
     la página quedaba sin una sola línea de CSS. Pasó, y así no puede volver
     a pasar. */
  function raiz() {
    var r = document.getElementById("raiz");
    if (!r) {
      r = document.createElement("div");
      r.id = "raiz";
      document.body.appendChild(r);
    }
    return r;
  }

  function pintar() {
    raiz().innerHTML = cuerpo();
    if (temaManual) document.documentElement.setAttribute("data-theme", temaManual);

    raiz().querySelectorAll("[data-clave]").forEach(function (b) {
      b.addEventListener("click", function () { alternar([b.dataset.clave]); });
    });
    var todas = document.getElementById("bTodas");
    if (todas) todas.addEventListener("click", function () {
      alternar((D.tareas_propuestas || []).filter(function (t) {
        return !E.aprobadas[t.idempotencia];
      }).map(function (t) { return t.idempotencia; }), "aprobar");
    });
    var nada = document.getElementById("bNada");
    if (nada) nada.addEventListener("click", function () {
      alternar(Object.keys(E.aprobadas), "quitar");
    });
    var tema = document.getElementById("bTema");
    if (tema) tema.addEventListener("click", function () {
      var actual = document.documentElement.getAttribute("data-theme");
      var oscuroSis = window.matchMedia &&
        window.matchMedia("(prefers-color-scheme: dark)").matches;
      temaManual = actual ? (actual === "dark" ? "light" : "dark")
        : (oscuroSis ? "light" : "dark");
      document.documentElement.setAttribute("data-theme", temaManual);
    });
    var cop = document.getElementById("bCopiar");
    if (cop) cop.addEventListener("click", copiar);

    var secs = SECCIONES.map(function (s) { return document.getElementById(s.id); })
      .filter(Boolean);
    if (window.IntersectionObserver && secs.length) {
      var obs = new IntersectionObserver(function (es) {
        es.forEach(function (e) {
          if (!e.isIntersecting) return;
          raiz().querySelectorAll(".nav a").forEach(function (a) {
            a.classList.toggle("on", a.dataset.sec === e.target.id);
          });
        });
      }, { rootMargin: "-15% 0px -70% 0px" });
      secs.forEach(function (s) { obs.observe(s); });
    }
  }

  function copiar() {
    var T = D.tareas_propuestas || [], c = D.corrida || {};
    var l = ["Mesa Creativa · " + (c.rango || ""), ""];
    T.forEach(function (t) {
      l.push((E.aprobadas[t.idempotencia] ? "[x] " : "[ ] ") + t.titulo);
      l.push("    " + t.descripcion);
    });
    var h = D.huecos_declarados || [];
    if (h.length) {
      l.push("", "No incluye:");
      h.forEach(function (x) { l.push("  - " + x.fuente + ": " + x.descripcion); });
    }
    var txt = l.join("\n");
    var ok = function () { avisar("Resumen copiado"); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).then(ok, function () { avisar("No se pudo copiar"); });
    } else { avisar("No se pudo copiar"); }
  }

  function alternar(claves, forzar) {
    if (!claves || !claves.length || soloLectura) return;
    claves.forEach(function (k) {
      var hay = !!E.aprobadas[k];
      var quiero = forzar === "aprobar" ? true : forzar === "quitar" ? false : !hay;
      if (quiero) E.aprobadas[k] = { en: new Date().toISOString() };
      else delete E.aprobadas[k];
    });
    E.version = (E.version || 1) + 1;
    pintar();
    if (!api) { avisar("Guardado solo en esta vista"); return; }
    api.publish(documento()).catch(function (err) {
      var c = err && err.code;
      if (c === "conflict") return;
      if (c === "not_writer" || c === "not_granted" || c === "not_declared" ||
          c === "consent_required" || c === "capability_disabled" ||
          c === "capability_removed") {
        soloLectura = true; api = null; pintar();
        avisar("Esta vista es de solo lectura"); return;
      }
      if (c === "rate_limited") { avisar("Demasiados cambios seguidos, espera un momento"); return; }
      avisar("No se pudo guardar la aprobación");
    });
  }

  /* documento() DEBE devolver un documento completo: es lo que exige la
     capability de auto-publicación. El archivo original en cambio es un
     fragmento, porque el visor lo envuelve. */
  function documento() {
    var j = function (o) {
      return JSON.stringify(o).replace(/<\/script/gi, "<\\/script");
    };
    return "<!doctype html>\n<html lang=\"es\">\n<head>\n" + P.head +
      "\n</head>\n<body>\n" +
      '<script id="datos" type="application/json">' + j(D) + "<\/script>\n" +
      '<script id="estado" type="application/json">' + j(E) + "<\/script>\n" +
      '<script id="plantilla" type="application/json">' + j(P) + "<\/script>\n" +
      "<script>" + P.app + "<\/script>\n</body>\n</html>";
  }

  pintar();

  try {
    Object.defineProperty(window, "__tablero", {
      value: Object.freeze({ documento: documento }),
      writable: false, configurable: false, enumerable: false
    });
  } catch (e) { /* entorno que no lo permite: la página funciona igual */ }

  if (window.claude && typeof window.claude.use === "function") {
    window.claude.use("artifact").then(function (a) {
      if (!a) { soloLectura = true; pintar(); return; }
      api = a;
    }).catch(function () { soloLectura = true; pintar(); });
  } else { soloLectura = true; pintar(); }
})();
</script>
