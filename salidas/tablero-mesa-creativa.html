      /* 2 · en base a qué. Cada línea trae su número, y el número sale de esta
         corrida: si viniera escrito a mano caducaría sin avisar. */
      (c.porque && c.porque.length
        ? tramo("Lo que dice el análisis") +
          '<div class="mt-2.5">' +
          puntos(c.porque, "text-[12.5px] text-slate-600 leading-relaxed") +
          "</div>"
        : "") +
      (c.de_que_hablar
        ? '<p class="text-[13px] text-slate-800 leading-relaxed mt-4">' +
          '<b class="font-semibold">Enfocarse en:</b> ' + esc(c.de_que_hablar) +
          "</p>"
        : "") +
      (c.como_hablarlo
        ? '<p class="text-[12.5px] text-slate-500 leading-relaxed mt-2">' +
          '<b class="font-semibold text-slate-700">Cómo hablarlo:</b> ' +
          esc(c.como_hablarlo) + "</p>"
        : "") +

      /* 3 · el copy, con el peso que tiene: es lo que se va a producir. */
      tramo("Copy") +
      '<div class="sec-lavado rounded-2xl p-5 mt-2.5">' +
      '<div class="text-[17px] font-bold text-slate-900 leading-snug">' +
      esc(cp.titular || "") + "</div>" +
      '<p class="text-[13.5px] text-slate-700 leading-relaxed mt-2">' +
      esc(cp.cuerpo || "") + "</p>" +
      (cp.cta
        ? '<div class="mt-4 inline-flex items-center gap-1.5 text-[12px] ' +
          'font-semibold text-slate-900 bg-white rounded-full px-4 py-2">' +
          esc(cp.cta) + "</div>"
        : "") + "</div>" +
      (c.lo_que_no_se_dice
        ? '<p class="text-[12px] text-slate-400 leading-relaxed mt-2.5">' +
          '<b class="font-semibold text-slate-500">No dice:</b> ' +
          esc(c.lo_que_no_se_dice) + "</p>"
        : "") +

      /* 4 · qué imagen. El tipo de medio de un anuncio ajeno no lo publica la
         fuente, así que la estructura sale de dato propio y se rotula. */
      ((est || (vis.mostrar || []).length || (vis.no_mostrar || []).length)
        ? tramo("Qué mostrar") +
          (est
            ? '<p class="text-[13px] font-semibold text-slate-800 mt-2.5">' +
              esc(est.que) + "</p>" +
              '<p class="text-[11.5px] text-slate-400 leading-relaxed mt-1">' +
              esc(est.porque || "") + "</p>"
            : "") +
          ((vis.mostrar || []).length
            ? '<div class="mt-3">' +
              puntos(vis.mostrar, "text-[12.5px] text-slate-600 leading-relaxed") +
              "</div>"
            : "") +
          ((vis.no_mostrar || []).length
            ? '<p class="text-[11.5px] font-semibold text-slate-500 mt-3 mb-1.5">' +
              "Que NO vaya</p>" +
              puntos(vis.no_mostrar, "text-[12px] text-slate-400 leading-relaxed")
            : "")
        : "") +

      /* 5 · la referencia medida. La búsqueda de Pinterest no es esto: esto es
         una marca real con un número detrás. */
      (ref
        ? tramo("Referencia") +
          '<div class="mt-2.5 rounded-2xl bg-slate-50 p-5">' +
          '<div class="flex items-center gap-2 flex-wrap mb-2">' +
          '<span class="text-[13.5px] font-bold text-slate-900">' +
          esc(ref.marca) + "</span>" +
          (ref.rol ? '<span class="etiqueta-gris">' + esc(ref.rol) + "</span>" : "") +
          (ref.mercado ? '<span class="etiqueta-gris">' + esc(ref.mercado) +
            "</span>" : "") + "</div>" +
          (ref.que_hace
            ? '<p class="text-[12.5px] text-slate-700 leading-relaxed">' +
              esc(ref.que_hace) + "</p>" : "") +
          (ref.medido
            ? '<p class="text-[12px] text-slate-500 leading-relaxed mt-2">' +
              esc(ref.medido) + "</p>" : "") +
          (ref.url
            ? '<a class="enlace mt-3" target="_blank" rel="noopener" href="' +
              esc(ref.url) + '">' + svg(ico.link, "w-3.5 h-3.5") +
              "Verlo en la Ad Library</a>" : "") +
          "</div>"
        : "") +

      /* Lo que falta y de dónde sale cada número. Va plegado porque no se lee
         primero, pero va: la definición de terminado lo exige. */
      ((c.faltantes || []).length
        ? '<div class="mt-4 rounded-2xl bg-amber-50 ring-1 ring-amber-100 p-4">' +
          '<p class="text-[11.5px] font-semibold text-amber-900 mb-1.5">' +
          "Lo que esta corrida no pudo confirmar</p>" +
          puntos(c.faltantes, "text-[11.5px] text-amber-700 leading-relaxed") +
          "</div>"
        : "") +
      ((c.evidencia || []).length || c.voz_de_marca
        ? '<details class="mt-4">' +
          '<summary class="text-[12px] font-semibold text-slate-400 ' +
          'cursor-pointer hover:text-slate-600">De dónde sale cada número</summary>' +
          (c.voz_de_marca
            ? '<p class="text-[11.5px] text-slate-500 leading-relaxed mt-3">' +
              esc(c.voz_de_marca) + "</p>" : "") +
          '<div class="mt-2.5">' +
          puntos(c.evidencia || [], "text-[11px] text-slate-400 leading-relaxed") +
          "</div>" +
          (vis._limite
            ? '<p class="text-[11px] text-slate-400 leading-relaxed mt-2.5">' +
              esc(vis._limite) + "</p>" : "") +
          "</details>"
        : "") +

      '<div class="mt-auto pt-5 flex flex-wrap items-center gap-2">' +
      '<button type="button" data-decidir="' + esc(c.id) + '" ' +
      'data-estado="aceptada" class="btn-verde"' +
      (soloLectura || bloq ? " disabled" : "") + ">" +
      svg(ico.tic, "w-4 h-4") + "Aprobar</button>" +
      '<button type="button" data-decidir="' + esc(c.id) + '" ' +
      'data-estado="rechazada" class="btn-rojo"' +
      (soloLectura ? " disabled" : "") + ">" +
      svg(ico.x, "w-4 h-4") + "Rechazar</button>" +
      (estado ? selectorResponsable(c.id, d && d.responsable, asig) : "") +
      "</div></div>";
  }

  /* Los dos cortes que pidió Mercadeo: qué hay que producir y de qué solución
     habla. Un copy sin taxonomía no se puede filtrar —se vería siempre, que es
     peor que no verse—, así que se cuenta aparte y se avisa. */
  function bloqueCartas() {
    var todos = cartas();
    if (!todos.length) return "";
    var sinEtiqueta = todos.filter(function (c) {
      return !c.pieza || !c.solucion;
    }).length;
    var cs = todos.filter(function (c) {
      if (V.pieza && c.pieza !== V.pieza) return false;
      if (V.solucion && c.solucion !== V.solucion) return false;
      var cp = c.copy || c;
      return coincide(cp.titular, cp.cuerpo, c.de_que_hablar || c.angulo,
                      c.mercado, c.solucion, c.que_hacer, c.como_hablarlo,
                      (c.referencia || {}).marca, (c.porque || []).join(" "));
    });
    var cuenta = function (campo, val) {
      return todos.filter(function (c) {
        if (campo === "pieza" && V.solucion && c.solucion !== V.solucion) return false;
        if (campo === "solucion" && V.pieza && c.pieza !== V.pieza) return false;
        return c[campo] === val;
      }).length;
    };
    /* DOS NIVELES, como los pidió Mercadeo: primero qué hay que producir, y
       solo al elegir uno aparecen las tres soluciones. La segunda fila no
       existe hasta que hay pieza elegida: mostrar seis botones a la vez obliga
       a leerlos todos para entender que son dos preguntas distintas.

       Volver a pulsar la pieza activa limpia las dos, así que no hace falta un
       botón de «quitar filtros» aparte. */
    var SOL = ["Punto de Venta", "Pasarela de Pagos", "Tienda en Línea"];
    var nivel1 = ["arte", "video"].map(function (x) {
      var on = V.pieza === x;
      return '<button type="button" data-pieza="' + x + '" ' +
        'class="px-7 py-3 rounded-full text-[13.5px] font-semibold ' +
        'transition-colors ' + (on ? "text-white" : "text-slate-500 " +
        "hover:text-slate-800") + '"' +
        (on ? ' style="background:var(--marca)"' : "") + ">" +
        (x === "arte" ? "Arte" : "Video") + " · " + cuenta("pieza", x) +
        "</button>";
    }).join("");
    var nivel2 = !V.pieza ? "" :
      '<div class="flex flex-wrap items-center gap-2 mt-3">' +
      '<span class="text-[11.5px] text-slate-400 mr-1">' +
      esc(V.pieza === "arte" ? "Artes de" : "Videos de") + "</span>" +
      SOL.map(function (x) {
        var n = cuenta("solucion", x), on = V.solucion === x;
        return '<button type="button" data-solucion="' + esc(x) + '" ' +
          'class="px-5 py-2.5 rounded-full text-[12.5px] font-semibold ' +
          'transition-colors ' +
          (on ? "text-white" : n ? "text-slate-500 hover:text-slate-800 " +
            "bg-white tarjeta-sombra" : "text-slate-300 bg-white") + '"' +
          (on ? ' style="background:var(--marca)"' : "") +
          (n ? "" : ' disabled title="Sin copys de esta solución en ' +
            esc(V.pieza) + '"') + ">" + esc(x) + " · " + n + "</button>";
      }).join("") +
      (V.solucion
        ? '<button type="button" data-solucion="null" ' +
          'class="etiqueta-marca">las tres</button>'
        : "") + "</div>";
    var filtros = '<div class="mb-6">' +
      '<div class="inline-flex flex-wrap max-w-full bg-white rounded-full ' +
      'p-1 tarjeta-sombra">' + nivel1 + "</div>" + nivel2 + "</div>";
    var m = mercadoActivo();
    var asig = ((D.estrategia || {}).asignacion) || {};
    var sinCarta = ((D.cartas || {}).sin_evidencia) || [];
    var decid = cs.filter(function (c) { return E.decisiones[c.id]; }).length;
    return '<div class="flex items-start justify-between gap-4 mb-5 mt-10">' +
      '<div><h3 class="text-[17px] font-bold text-slate-800">Cartas de ' +
      'producción</h3>' +
      '<p class="text-[12.5px] text-slate-400 mt-1.5">Cada carta es una pieza ' +
      "completa: qué hacer, de qué hablar, con qué texto y con qué imagen. " +
      "Aprobar registra la decisión; no publica nada." +
      (m ? " Se marca lo que no aplica en " + esc(m) + "." : "") +
      "</p></div>" +
      '<span class="text-[12.5px] font-semibold shrink-0 mt-1 ' +
      'text-slate-400">' + decid + " / " + cs.length +
      (cs.length !== todos.length ? " · de " + todos.length : "") +
      "</span></div>" + filtros +
      (sinEtiqueta
        ? '<p class="text-[11.5px] text-slate-400 mt-3">' + sinEtiqueta +
          " carta sin pieza o sin solución declarada: no entra en los filtros." +
          "</p>"
        : "") +
      /* Las que NO se pudieron armar. Un copy que la corrida no puede sostener
         con un solo número vivo no se muestra como si lo tuviera —y tampoco
         desaparece en silencio, que es el error del `continue` sin registro. */
      (sinCarta.length
        ? '<div class="mt-4 rounded-2xl bg-amber-50 ring-1 ring-amber-100 p-5">' +
          '<p class="text-[12px] font-semibold text-amber-900 mb-2">' +
          sinCarta.length + " copy sin carta: esta corrida no resuelve ninguna " +
          "de sus evidencias</p>" +
          '<ul class="list-disc pl-5 space-y-1.5 text-[11.5px] ' +
          'text-amber-700 leading-relaxed">' +
          sinCarta.map(function (x) {
            return "<li><b>" + esc(x.titular || x.id) + "</b> — " +
              esc((x.faltantes || []).join(" · ")) + "</li>";
          }).join("") + "</ul></div>"
        : "") +
      '<div class="grid gap-6 mt-6 ' +
      '[grid-template-columns:repeat(auto-fill,minmax(min(420px,100%),1fr))]">' +
      (cs.length
        ? cs.map(function (c) { return tarjetaCarta(c, asig); }).join("")
        : '<div class="bg-white rounded-3xl p-7 tarjeta-sombra text-[13px] ' +
          'text-slate-400">' +
          ((V.pieza || V.solucion)
            ? "Ninguna carta de " + esc([V.pieza, V.solucion].filter(Boolean).join(" · ")) +
              (buscando() ? " coincide con la búsqueda." : " todavía.")
            : "Ninguna carta coincide con la búsqueda.") + "</div>") +
      "</div>";
  }

  /* ═════════════ alcance del orgánico ═════════════

     Viene de Zoho Analytics, la tercera fuente, y es lo que permite calcular la
     tasa de interacción — que hasta el 2026-09-02 este proyecto se negaba a
     calcular por falta de denominador.

     LA REGLA QUE GOBIERNA ESTE BLOQUE: cada red muestra SU métrica con SU
     nombre. Facebook da IMPRESIONES (veces mostrado), Instagram da ALCANCE
     (personas distintas). No se suman, no se promedian juntas y no se comparan
     de frente. Un total que las mezclara sería un número que no existe. */

  function alcance() {
    return ((D.redes_sociales || {}).alcance) || null;
  }

  /* El rango elegido, o el completo si no se eligió nada. */
  /* El rango disponible es la UNIÓN de lo que se puede recortar, no solo lo del
     orgánico. Antes salía únicamente de `alcance.rango_disponible`, así que una
     corrida sin las exportaciones de Zoho Analytics no renderizaba el control
     de fechas EN ABSOLUTO: sin filtro, aunque la pauta diaria estuviera ahí
     entera. Lo encontró la corrida del 2026-09-04, que no llevaba Analytics.

     Un control que desaparece cuando falta una de sus dos fuentes es peor que
     uno con menos alcance: el equipo no ve que le falta algo, ve que no existe. */
  function rango() {
    var A = alcance(), ra = (A && A.rango_disponible) || null;
    var PD = pautaDia(), rp = (PD && PD.rango_disponible) || null;
    var r = null;
    if (ra && rp) {
      r = { desde: ra.desde < rp.desde ? ra.desde : rp.desde,
            hasta: ra.hasta > rp.hasta ? ra.hasta : rp.hasta };
    } else {
      r = ra || rp;
    }
    if (!r) return null;
    var desde = V.desde || r.desde, hasta = V.hasta || r.hasta;
    /* Dos fechas definen una ventana sin importar en qué casilla quedó cada
       una. Se ordenan aquí, al leer, y no al escribir: así ningún tecleo
       intermedio puede corromper la otra casilla. El repintado devuelve los
       campos ya ordenados. */
    if (desde > hasta) { var t = desde; desde = hasta; hasta = t; }
    /* `propio` es «esta ventana recorta algo», NO «alguien tocó el control».
       Con `!!(V.desde || V.hasta)` una fecha que quedaba igual al tope del dato
       encendía la ventana propia sin filtrar nada, y la página escribía «22
       días en la ventana» al lado del total completo de agosto. Eso fue lo que
       Mercadeo vio y leyó, con razón, como «lee la fecha para el texto pero no
       para calcular». */
    return { desde: desde, hasta: hasta, tope: r,
             propio: desde !== r.desde || hasta !== r.hasta };
  }

  /* RECALCULA los agregados sobre las piezas del rango, no oculta filas de una
     tabla ya sumada. Un filtro que oculta pero no recalcula deja el total de un
     periodo al lado de las piezas de otro, que es peor que no tener filtro.

     El mínimo de piezas para publicar una tasa se respeta igual que en Python:
     si el rango elegido deja tres piezas, no sale una tasa. */
  var MINIMO_TASA = 5;

  function recalcula(red) {
    var R = rango();
    var ps = (red.piezas || []).filter(function (p) {
      return !R || (p.f >= R.desde && p.f <= R.hasta);
    });
    var agrupa = function (lista) {
      if (!lista.length) return null;
      var base = 0, inter = 0, neg = 0;
      lista.forEach(function (p) {
        base += p.b; inter += p.i; neg += (p.n || 0);
      });
      var bs = lista.map(function (p) { return p.b; }).sort(function (a, b) { return a - b; });
      return {
        piezas: lista.length, total: base, interacciones: inter,
        promedio: Math.round(base / lista.length),
        mediana: bs[Math.floor(bs.length / 2)],
        negativas: neg,
        tasa: (base && lista.length >= MINIMO_TASA) ? inter / base : null,
        pocas: lista.length < MINIMO_TASA,
      };
    };
    var porFormato = {};
    ps.forEach(function (p) {
      (porFormato[p.t] = porFormato[p.t] || []).push(p);
    });
    var fmt = Object.keys(porFormato)
      .map(function (k) { return [k, agrupa(porFormato[k])]; })
      .sort(function (a, b) { return b[1].piezas - a[1].piezas; });
    var mejores = ps.filter(function (p) { return p.b >= 50; })
      .sort(function (a, b) { return (b.i / b.b) - (a.i / a.b); }).slice(0, 3);
    return { total: agrupa(ps), formatos: fmt, mejores: mejores,
             piezas: ps.length, deTodas: (red.piezas || []).length };
  }

  /* El control de fechas, en el encabezado y para toda la página.

     LO QUE PUEDE Y LO QUE NO, escrito en el propio control: filtra lo que tiene
     fecha por pieza —el orgánico y sus gráficas— y NO puede partir la pauta de
     Meta (la corrida la agrega por periodo, sin desglose diario) ni la
     competencia (la Ad Library es una foto de un solo día).

     Decirlo es obligatorio. Un filtro global que dejara quieto el número de
     leads sin explicar por qué haría pensar que el dato está mal, y el
     siguiente paso sería dejar de creerle a todo el tablero. */
  function controlFechas() {
    /* La compuerta es `rango()`, no `alcance()`: el control existe si hay ALGO
       que recortar —pauta diaria, orgánico, o los dos—. Preguntar por alcance
       hacía desaparecer el filtro entero en una corrida sin Zoho Analytics. */
    var R = rango();
    if (!R) return "";
    return '<div class="bg-white rounded-3xl p-6 tarjeta-sombra flex ' +
      'flex-wrap items-end gap-4">' +
      '<div><span class="micro-et">Desde</span>' +
      '<input type="date" id="fDesde" class="campo w-[168px]" value="' +
      esc(R.desde) + '" min="' + esc(R.tope.desde) + '" max="' +
      esc(R.tope.hasta) + '"></div>' +
      '<div><span class="micro-et">Hasta</span>' +
      '<input type="date" id="fHasta" class="campo w-[168px]" value="' +
      esc(R.hasta) + '" min="' + esc(R.tope.desde) + '" max="' +
      esc(R.tope.hasta) + '"></div>' +
      '<div class="flex gap-2 flex-wrap">' +
      [["periodo", "El periodo de la corrida"], ["30", "Últimos 30 días"],
       ["90", "Últimos 90 días"], ["todo", "Todo"]].map(function (a) {
        return '<button type="button" data-rango="' + a[0] + '" ' +
          'class="np-tipo">' + esc(a[1]) + "</button>";
      }).join("") + "</div>" +
      '<div class="text-[11.5px] text-slate-400 leading-snug flex-1 ' +
      'min-w-[220px]">' +
      (R.propio ? "<b class=\"text-slate-600 font-semibold\">Ventana " +
                  "elegida.</b> " : "") +
      "Recalcula el orgánico y sus gráficas." +
      '<details class="inline ml-1.5"><summary class="inline ' +
      'cursor-pointer font-semibold hover:text-slate-600">Qué no ' +
      'filtra</summary>' +
      '<span class="block mt-2">La <b>pauta de Meta</b>: la corrida la agrega ' +
      "por periodo y no trae desglose diario, así que sus números son los del " +
      "periodo " + esc((D.corrida || {}).rango || "") + " sin importar esta " +
      "ventana. Y la <b>competencia</b>: la Ad Library solo responde qué está " +
      "activo hoy, no acepta rango de fechas. Los bloques que no cambian lo " +
      "dicen en su cabecera. Dato disponible: " + esc(R.tope.desde) + " a " +
      esc(R.tope.hasta) + ".</span></details></div></div>";
  }

  function tarjetaAlcance(r) {
    var rc = recalcula(r);
    var ac = rc.total || {}, pe = r.periodo || {};
    var dato = function (rot, val, nota) {
      return '<div class="min-w-[104px]">' +
        '<div class="text-[10px] font-bold tracking-wider text-slate-300 ' +
        'uppercase">' + esc(rot) + "</div>" +
        '<div class="text-[19px] font-bold text-slate-800 tabular-nums ' +
        'leading-tight mt-0.5">' + val + "</div>" +
        (nota ? '<div class="text-[10.5px] text-slate-400 leading-tight">' +
          esc(nota) + "</div>" : "") + "</div>";
    };
    /* La tasa es lo único nuevo de verdad, así que va primero y con su
       denominador escrito al lado: una tasa sin denominador visible es
       exactamente lo que este proyecto no publica. */
    var filas = rc.formatos.map(function (par) {
      var f = par[0], b = par[1];
      b.nombre_metrica = r.metrica;
      b._tasa_omitida = b.pocas
        ? "Menos de " + MINIMO_TASA + " piezas en este rango: no se publica tasa."
        : null;
      return '<div class="py-2.5">' +
        '<div class="flex items-baseline justify-between gap-3 mb-1.5">' +
        '<span class="text-[12.5px] font-semibold text-slate-700">' + esc(f) +
        '</span><span class="text-[12px] font-bold text-slate-800 ' +
        'tabular-nums shrink-0">' +
        (b.tasa != null ? (b.tasa * 100).toFixed(2) + "%" : "sin tasa") +
        "</span></div>" +
        '<div class="h-1.5 rounded-full bg-slate-50 overflow-hidden">' +
        '<div class="h-full rounded-full" style="width:' +
        Math.round(Math.min(1, (b.tasa || 0) / 0.06) * 100) +
        '%;background:var(--pastel-verde)"></div></div>' +
        '<div class="text-[10.5px] text-slate-400 mt-1.5">' + b.piezas +
        " piezas · " + ent(b.promedio) + " " + esc(b.nombre_metrica) +
        " en promedio" +
        (b._tasa_omitida ? " · " + esc(b._tasa_omitida) : "") + "</div></div>";
    }).join("");

    return '<div class="bg-white rounded-3xl p-7 tarjeta-sombra">' +
      cardCab(r.red, r.metrica === "impresiones"
        ? "Impresiones · veces mostrado"
        : "Alcance · personas distintas") +
      '<div class="flex flex-wrap gap-x-7 gap-y-4 mb-6">' +
      dato("tasa del rango",
           ac.tasa != null ? (ac.tasa * 100).toFixed(2) + "%"
                           : (ac.piezas ? "sin tasa" : "—"),
           ac.interacciones != null
             ? ent(ac.interacciones) + " sobre " + ent(ac.total) : null) +
      dato(esc(r.metrica), ent(ac.total),
           (ac.piezas || 0) + " de " + rc.deTodas + " piezas") +
      dato("promedio por pieza", ent(ac.promedio),
           ac.mediana != null ? "mediana " + ent(ac.mediana) : null) +
      (ac.negativas != null && r.recepcion_negativa != null
        ? dato("reacciones negativas", ent(ac.negativas),
               "«me entristece» y «me enoja» · en este rango") : "") +
      "</div>" +
      '<div class="text-[10.5px] font-bold tracking-wider text-slate-300 ' +
      'uppercase mb-1">Tasa por formato</div>' + filas +
      '<details class="mt-5 pt-4 border-t border-slate-50">' +
      '<summary class="text-[12px] font-semibold text-slate-400 ' +
      'cursor-pointer hover:text-slate-600">Qué se dejó fuera y por qué' +
      "</summary>" +
      '<ul class="mt-3 space-y-2 text-[11.5px] text-slate-500 leading-relaxed ' +
      'list-disc pl-5">' +
      ["_el_corte", "_las_sin_alcance", "_saved_no_se_usa", "_dos_tablas",
       "_recepcion_negativa"].filter(function (k) { return r[k]; })
        .map(function (k) { return "<li>" + esc(r[k]) + "</li>"; }).join("") +
      (r.descartadas_por_el_corte
        ? "<li>" + ent(r.descartadas_por_el_corte) +
          " publicaciones anteriores al corte, descartadas.</li>" : "") +
      (r.piezas_sin_alcance
        ? "<li>" + ent(r.piezas_sin_alcance) + " sin dato de " +
          esc(r.metrica) + ", fuera del cálculo.</li>" : "") +
      "</ul></details>" +
      '<div class="text-[10.5px] font-bold tracking-wider text-slate-300 ' +
      'uppercase mt-6 mb-2">Las 3 de mejor tasa</div>' +
      '<div class="divide-y divide-slate-50">' +
      (rc.mejores.length
        ? rc.mejores.map(function (m) {
            return '<div class="flex items-start gap-3 py-2.5">' +
              '<div class="min-w-0 flex-1">' +
              '<div class="text-[12px] text-slate-700 leading-snug">' +
              esc(m.m || "(sin texto)") + "</div>" +
              '<div class="text-[10.5px] text-slate-400 mt-0.5">' + esc(m.t) +
              " · " + esc(m.f) + " · " + ent(m.b) + " " + esc(r.metrica) +
              "</div></div>" +
              '<div class="text-[12.5px] font-bold text-slate-800 tabular-nums ' +
              'shrink-0">' + (m.i / m.b * 100).toFixed(2) + "%</div>" +
              (m.u ? '<a href="' + esc(m.u) + '" target="_blank" ' +
                'rel="noopener noreferrer" class="shrink-0 text-slate-300 ' +
                'hover:text-slate-600">' + svg(ico.link, "w-4 h-4") + "</a>" : "") +
              "</div>";
          }).join("")
        : '<p class="text-[12px] text-slate-400 py-2">Ninguna pieza con al ' +
          "menos 50 " + esc(r.metrica) + " en este rango.</p>") +
      "</div></div>";
  }

  function bloqueAlcance() {
    var A = alcance();
    if (!A) return "";
    return '<h3 class="text-[17px] font-bold text-slate-800 mb-2 mt-10">' +
      "Alcance y tasa de interacción</h3>" +
      '<div class="text-[12.5px] text-slate-400 mb-5">Facebook mide ' +
      "impresiones e Instagram alcance: no se suman." +
      '<details class="inline"><summary class="inline cursor-pointer ' +
      'font-semibold hover:text-slate-600"> Por qué</summary>' +
      '<span class="block mt-2 max-w-[70ch] leading-relaxed">' +
      esc(A._la_regla) + " " + esc(A._lo_que_desbloquea) + " " +
      esc(A._sigue_abierto) + "</span></details></div>" +
      '<div class="grid gap-6 ' +
      '[grid-template-columns:repeat(auto-fill,minmax(min(400px,100%),1fr))]">' +
      A.redes.map(tarjetaAlcance).join("") + "</div>";
  }

  /* ═════════════ piezas del análisis profundo ═════════════ */

  /* El perfil corto de una marca: cómo apuesta, no cuánto tiene.

     Se muestra dentro de su tarjeta en Competencia. El reporte largo sigue
     existiendo aparte; esto es lo que se lee en la reunión sin abrir otra
     pestaña. Cada número trae su rótulo, y el que no vino no se dibuja. */
  function perfilProfundo(p) {
    var celdas = [];
    var mete = function (rot, val, nota) {
      if (val == null || val === "") return;
      celdas.push('<div class="min-w-[92px]">' +
        '<div class="text-[10px] font-bold tracking-wider text-slate-300 ' +
        'uppercase">' + esc(rot) + "</div>" +
        '<div class="text-[15px] font-bold text-slate-800 tabular-nums ' +
        'leading-tight mt-0.5">' + val + "</div>" +
        (nota ? '<div class="text-[10.5px] text-slate-400 leading-tight">' +
          esc(nota) + "</div>" : "") + "</div>");
    };
    mete("concentración", pct(p.concentracion),
         p.mensajes_distintos + " mensajes");
    mete("carrusel", pct(p.carrusel_cuota),
         p.tarjetas_max ? "hasta " + p.tarjetas_max + " tarjetas" : null);
    mete("cadencia", esc(p.modo),
         p.creativos_por_semana ? p.creativos_por_semana + "/semana" : null);
    mete("sin lanzar", p.dias_sin_lanzar != null ? p.dias_sin_lanzar + " d" : null,
         p.span_dias != null ? "carga en " + (p.span_dias + 1) + " d" : null);
    var verts = (p.verticales || []).map(function (v) {
      return '<span class="etiqueta-sec">' + esc(v.vertical) + " · " +
        v.anuncios + "</span>";
    }).join("");
    return '<div class="mt-1">' +
      /* El UNIVERSO va escrito. Sin él, el 84% de la consulta global choca
         contra el 74% de la lectura por país unos centímetros arriba, en la
         misma tarjeta, y se lee como un error de cálculo. Son dos universos
         distintos: uno es lo que pauta en GT, el otro todo lo que tiene activo. */
      '<div class="text-[11px] text-slate-400 mb-3">' + esc(p.marca) + " · " +
      (p.mercado === "GLOBAL" ? "consulta global" : "consulta " + esc(p.mercado)) +
      " · " + p.leidos + " anuncios leídos" +
      (p.muestra_completa
        ? " (inventario completo)"
        : " de " + ent(p.activos_declarados) + " activos") + "</div>" +
      '<div class="flex flex-wrap gap-x-6 gap-y-4">' + celdas.join("") + "</div>" +
      (verts ? '<div class="flex flex-wrap gap-1.5 mt-4">' + verts + "</div>" : "") +
      (p.advertencia_muestra
        ? '<p class="text-[11px] text-slate-400 leading-relaxed mt-4">' +
          esc(p.advertencia_muestra) + "</p>" : "") + "</div>";
  }

  /* ── El dossier de una marca ──────────────────────────────────────────
     Cuatro preguntas, en el orden en que se leen: a quién le habla, qué
     repite, qué no retira y qué se lee de todo eso. Cada bloque muestra los
     primeros y despliega el resto, así que la tarjeta cabe en la reunión sin
     perder el detalle. */

  /* Una barra de cuota. Se usa para las verticales y para los mensajes: en los
     dos casos lo que importa es el peso relativo, no el absoluto. */
  function barraCuota(rot, sub, cuota, tinte) {
    return '<div class="py-2.5">' +
      '<div class="flex items-baseline justify-between gap-3 mb-1.5">' +
      '<span class="text-[12.5px] font-semibold text-slate-700 truncate">' +
      esc(rot) + "</span>" +
      '<span class="text-[12px] font-bold text-slate-800 tabular-nums ' +
      'shrink-0">' + pct(cuota) + "</span></div>" +
      '<div class="h-1.5 rounded-full bg-slate-50 overflow-hidden">' +
      '<div class="h-full rounded-full" style="width:' +
      Math.round((cuota || 0) * 100) + "%;background:var(" + (tinte ||
      "--pastel-azul") + ')"></div></div>' +
      (sub ? '<div class="text-[11px] text-slate-400 mt-1.5">' + esc(sub) +
        "</div>" : "") + "</div>";
  }

  function rotuloBloque(txt, extra) {
    return '<div class="flex items-baseline justify-between gap-3 mt-6 mb-2">' +
      '<div class="text-[10.5px] font-bold tracking-wider text-slate-300 ' +
      'uppercase">' + esc(txt) + "</div>" + (extra || "") + "</div>";
  }

  function verMas(clave, total, tope) {
    if (total <= tope) return "";
    return '<button type="button" data-vertodo="' + esc(clave) + '" ' +
      'class="text-[11.5px] font-semibold shrink-0 hover:underline" ' +
      'style="color:var(--marca)">' +
      (V.verTodo[clave] ? "menos" : "ver " + total) + "</button>";
  }

  function dossierMarca(d) {
    var k = d.clave, out = "";

    /* 1 · A quién le habla. Las verticales salen de clasificar el TITULAR, así
       que un anuncio cuyo titular no dice a quién le habla queda fuera del
       conteo en vez de repartirse. */
    if (d.audiencia && d.audiencia.length) {
      out += rotuloBloque("A quién le habla",
        verMas("aud-" + k, d.audiencia.length, 3)) +
        recorta(d.audiencia, "aud-" + k).map(function (a) {
          return barraCuota(a.vertical, a.anuncios + " anuncios", a.cuota,
            "--pastel-rosa");
        }).join("") +
        '<div class="text-[10.5px] text-slate-400 mt-1" title="Un titular que ' +
        'toca dos verticales cuenta en las dos, así que el total puede pasar ' +
        'del número de anuncios.">' + d.audiencia_clasificaciones +
        " clasificaciones en " + d.leidos + " anuncios</div>";
    } else {
      out += rotuloBloque("A quién le habla") +
        '<p class="text-[12px] text-slate-400 leading-relaxed">Ninguno de sus ' +
        "titulares clasifica en una vertical, así que esto no se puede " +
        "responder para esta marca.</p>";
    }

    /* 2 · Qué repite. */
    if (d.mensajes_lista && d.mensajes_lista.length) {
      out += rotuloBloque("Qué repite",
        verMas("msg-" + k, d.mensajes_lista.length, 3)) +
        recorta(d.mensajes_lista, "msg-" + k).map(function (m) {
          return barraCuota("«" + m.mensaje + "»",
            m.creativos + " creativos · " + m.dias_vivo + " d vivo · desde " +
            m.desde, m.cuota, "--pastel-azul");
        }).join("");
    }

    /* 3 · Sus anuncios más longevos. Si la muestra viene topada, esta pregunta
       NO se responde: el más viejo de los 50 más recientes no es el más viejo,
       y darlo como tal engañaría. Se dice por qué en lugar de dejar el hueco. */
    out += rotuloBloque("Sus anuncios que llevan más tiempo");
    if (d.top_respondible && (d.top_anuncios || []).length) {
      out += '<div class="divide-y divide-slate-50">' +
        recorta(d.top_anuncios, "top-" + k).map(function (a) {
          return '<div class="flex items-center gap-3 py-2.5">' +
            '<div class="min-w-0 flex-1">' +
            '<div class="text-[12.5px] font-semibold text-slate-800 truncate">' +
            "«" + esc(a.mensaje) + "»</div>" +
            '<div class="text-[11px] text-slate-400">desde ' + esc(a.desde) +
            "</div></div>" +
            '<div class="text-[12.5px] font-bold text-slate-800 tabular-nums ' +
            'shrink-0">' + a.dias_vivo + " d</div>" +
            (a.url ? '<a href="' + esc(a.url) + '" target="_blank" ' +
              'rel="noopener noreferrer" class="shrink-0 text-slate-300 ' +
              'hover:text-slate-600" title="Ver el anuncio">' +
              svg(ico.link, "w-4 h-4") + "</a>" : "") + "</div>";
        }).join("") + "</div>" +
        verMas("top-" + k, d.top_anuncios.length, 3) +
        (d.dias_vivo_mediana != null
          ? '<div class="text-[10.5px] text-slate-400 mt-2">Mediana de la ' +
            "marca: " + d.dias_vivo_mediana + " días vivo.</div>" : "");
    } else {
      out += '<p class="text-[12px] text-slate-400 leading-relaxed">' +
        esc(d.top_por_que_no ||
            "No se guardó muestra suficiente para responderlo.") + "</p>";
    }

    /* 4 · La lectura. Cada frase es la traducción de un umbral cruzado, y trae
       su número al lado. Ninguna es una interpretación libre. */
    if ((d.lectura || []).length) {
      /* Las frases a la vista; su evidencia en el título del elemento y en un
         pliegue. La lectura es lo accionable; el aparato que la sostiene se
         consulta, no se lee de corrido. */
      out += rotuloBloque("Lectura estratégica") +
        '<ul class="space-y-2">' + d.lectura.map(function (l) {
          return '<li class="text-[12.5px] text-slate-700 leading-relaxed"' +
            (l.evidencia ? ' title="' + esc(l.evidencia) + '"' : "") + ">" +
            esc(l.frase) + "</li>";
        }).join("") + "</ul>" +
        (d.lectura.some(function (l) { return l.evidencia; })
          ? '<details class="mt-2"><summary class="text-[11.5px] ' +
            'font-semibold text-slate-400 cursor-pointer ' +
            'hover:text-slate-600">De dónde sale cada frase</summary>' +
            '<ul class="mt-2 space-y-1 text-[10.5px] text-slate-400 font-mono ' +
            'leading-relaxed list-disc pl-5">' +
            d.lectura.filter(function (l) { return l.evidencia; })
              .map(function (l) { return "<li>" + esc(l.evidencia) + "</li>"; })
              .join("") + "</ul></details>"
          : "");
    }
    return out;
  }

  /* Una recomendación.

     El color del tipo NO es un semáforo: es el color de la SECCIÓN de donde
     salió la evidencia. «Evitar» viene de un competidor (rosa), «copiar» de un
     referente (verde), «probar» de una señal que la muestra no sostiene del
     todo (azul). El verde y el rojo saturados siguen reservados para aceptar y
     rechazar, que es una decisión y esto es una lectura. */
  var TIPO = {
    evitar:  { et: "Evitar", v: "--pastel-rosa" },
    copiar:  { et: "Copiar", v: "--pastel-verde" },
    probar:  { et: "Probar", v: "--pastel-azul" }
  };

  function recomendacion(r) {
    var t = TIPO[r.tipo] || { et: r.tipo, v: "--pastel-azul" };
    return '<div class="bg-white rounded-3xl p-7 tarjeta-sombra flex flex-col">' +
      '<div class="flex items-center gap-2 flex-wrap mb-4">' +
      '<span class="etiqueta" style="background:var(' + t.v + ');color:#0b0b0b">' +
      esc(t.et) + "</span>" +
      (r.confianza === "media"
        ? '<span class="micro-et !mb-0 !inline">confianza media</span>' : "") +
      "</div>" +
      '<h3 class="text-[16px] font-bold text-slate-800 leading-snug mb-3">' +
      esc(r.titulo) + "</h3>" +
      '<p class="text-[13.5px] text-slate-600 leading-relaxed">' +
      esc(r.que_hacer) + "</p>" +
      /* El porqué, el aviso y la evidencia van PLEGADOS. Antes eran tres
         párrafos visibles por tarjeta y con nueve tarjetas la sección se leía
         como un informe, no como una lista de cosas que hacer. La evidencia no
         se borra —sin ella la recomendación no vale— pero se abre cuando
         alguien la pide. */
      '<details class="mt-auto pt-5">' +
      '<summary class="text-[12px] font-semibold text-slate-400 ' +
      'cursor-pointer hover:text-slate-600">Por qué</summary>' +
      '<p class="text-[12px] text-slate-500 leading-relaxed mt-3">' +
      esc(r.porque) + "</p>" +
      (r.advertencia
        ? '<p class="text-[11.5px] leading-relaxed mt-3 sec-lavado rounded-2xl ' +
          'px-4 py-3 text-slate-600">' + esc(r.advertencia) + "</p>" : "") +
      ((r.evidencia || []).length
        ? '<ul class="mt-3 space-y-1.5 text-[11.5px] text-slate-500 ' +
          'leading-relaxed list-disc pl-5 font-mono">' +
          r.evidencia.map(function (e) { return "<li>" + esc(e) + "</li>"; })
            .join("") + "</ul>"
        : "") + "</details></div>";
  }

  /* Referentes contra competidores, en las dos cuotas que sí se pueden
     comparar entre grupos de tamaño distinto. Se comparan CUOTAS y no totales:
     un referente con 50 anuncios leídos y un competidor con 3 no se comparan
     por volumen sin mentir. */
  function comparativoProfundo() {
    var R = reco();
    if (!R || !R.comparativo) return "";
    var c = R.comparativo;
    var barra = function (rot, ref, com, nota) {
      if (ref == null || com == null) return "";
      var tope = Math.max(ref, com, 0.01);
      var fila_ = function (et, v, color) {
        return '<div class="flex items-center gap-3 mb-2">' +
          '<span class="text-[11px] text-slate-400 w-[92px] shrink-0">' +
          esc(et) + "</span>" +
          '<div class="flex-1 h-2.5 rounded-full bg-slate-50 overflow-hidden">' +
          '<div class="h-full rounded-full" style="width:' +
          Math.round(v / tope * 100) + "%;background:var(" + color + ')"></div>' +
          "</div>" +
          '<span class="text-[12.5px] font-bold text-slate-800 tabular-nums ' +
          'w-[42px] text-right">' + Math.round(v * 100) + "%</span></div>";
      };
      return '<div class="mb-6 last:mb-0">' +
        '<div class="text-[12.5px] font-semibold text-slate-700 mb-3">' +
        esc(rot) + "</div>" +
        fila_("Referentes", ref, "--pastel-verde") +
        fila_("Competidores", com, "--pastel-rosa") +
        (nota ? '<div class="text-[11px] text-slate-400 mt-1.5 leading-snug">' +
          esc(nota) + "</div>" : "") + "</div>";
    };
    var k = c.carrusel || {}, n = c.concentracion || {};
    return '<div class="bg-white rounded-3xl p-7 tarjeta-sombra">' +
      cardCab("Cómo apuestan unos y otros",
        "Cuotas, no totales: los grupos no tienen el mismo tamaño") +
      barra("Anuncios en carrusel", (k.referentes || {}).cuota,
            (k.competidores || {}).cuota,
            (k.referentes || {}).carruseles + " de " +
            (k.referentes || {}).anuncios + " contra " +
            (k.competidores || {}).carruseles + " de " +
            (k.competidores || {}).anuncios) +
      barra("Cuota del mensaje más repetido", (n.referentes || {}).mediana,
            (n.competidores || {}).mediana,
            "Mediana. Alto = una sola apuesta; bajo = cartera repartida.") +
      "</div>";
  }

  /* Los creativos que ninguna marca medida ha retirado.

     Es el sustituto DECLARADO del «top por impresiones», que no existe para un
     anunciante comercial (ADR-032). Lo que dice: nadie deja pagando meses un
     creativo que no le devuelve nada. Lo que NO dice: cuánto le devolvió. El
     rótulo lo repite para que no se lea como un ranking de efectividad. */
  function sobrevivientesCard() {
    var R = reco();
    var lista = R ? (R.sobrevivientes || []) : [];
    if (!lista.length) return "";
    return '<div class="bg-white rounded-3xl p-7 tarjeta-sombra">' +
      cardCab("Lo que nadie ha retirado",
        "No es un ranking de efectividad: es qué dejan pagando") +
      '<div class="divide-y divide-slate-50">' +
      lista.slice(0, 5).map(function (a) {
        return fila(a.rol === "referente" ? "REF" : "COM", "«" + a.mensaje + "»",
          a.marca + " · desde " + a.desde, a.dias_vivo + " d", "vivo",
          a.rol === "referente" ? null : "ambar");
      }).join("") + "</div>" +
      '<p class="text-[11px] text-slate-400 mt-5 leading-relaxed">' +
      "Los de la competencia salen en ámbar a propósito: son los que hay que " +
      "leer y NO repetir — ese territorio ya tiene dueño.</p></div>";
  }

  /* ═════════════ secciones ═════════════ */

  /* Cada seccion declara su color una sola vez, en una variable local de CSS.
     Todo lo que lleva color dentro de la seccion lo hereda de ahi, asi que
     cambiar la paleta de una seccion es cambiar una linea de tema.json. */
  function seccion(id, rotulo, titulo, sub, ctl, cuerpo) {
    var vars = "--sec:var(--sec-" + id + ");--sec-tinta:var(--sec-" + id +
      "-tinta);--sec-lavado:var(--sec-" + id + "-lavado)";
    var icono = (SECCIONES.filter(function (s) { return s.id === id; })[0] || {}).i;
    return '<section id="' + id + '" class="mb-16" style="' + vars + '">' +
      '<div class="flex flex-wrap items-end justify-between gap-5 mb-7">' +
      '<div><div class="sec-pastilla mb-3">' +
      (icono ? svg(ico[icono], "w-[13px] h-[13px]") : "") +
      esc(rotulo) + "</div>" +
      '<h2 class="text-[26px] font-bold text-slate-800 tracking-[-0.025em] ' +
      'leading-tight">' + esc(titulo) + "</h2>" +
      (sub ? '<p class="text-[13.5px] text-slate-400 mt-2 max-w-[62ch] ' +
        'leading-relaxed">' + sub + "</p>" : "") + "</div>" +
      (ctl ? "<div>" + ctl + "</div>" : "") + "</div>" + cuerpo + "</section>";
  }

  /* El grupo de pastillas. `flex-wrap` y `max-w-full` no son opcionales: con
     cuatro opciones de nombre largo —«Pasarela de Pagos · 4»— el grupo mide
     421 px y la pantalla de 390 desbordaba en horizontal. Lo encontró la prueba
     en navegador, no la vista. Al envolverse, el control segmentado pasa a dos
     filas dentro de la misma pastilla blanca y sigue leyéndose igual. */
  function pastillas(campo, opciones, activo) {
    return '<div class="inline-flex flex-wrap max-w-full bg-white rounded-full ' +
      'p-1 tarjeta-sombra">' +
      opciones.map(function (o) {
        var on = o.v === activo;
        return '<button type="button" data-' + campo + '="' + esc(o.v) + '" ' +
          'class="px-4 sm:px-5 py-2.5 rounded-full text-[13px] font-semibold ' +
          'transition-colors whitespace-nowrap ' +
          (on ? "text-white" : "text-slate-400 hover:text-slate-600") + '"' +
          (on ? ' style="background:var(--marca)"' : "") + ">" + esc(o.n) + "</button>";
      }).join("") + "</div>";
  }

  /* Los bloques secundarios llevan el lavado de su seccion. Son los que
     explican y advierten, no los que muestran numeros: ahi el color ayuda a
     separarlos de la lectura principal sin quitarle el blanco a los datos. */
  function nota(texto) {
    return '<div class="sec-lavado rounded-3xl p-6 text-[12.5px] ' +
      'text-slate-600 leading-relaxed">' + texto + "</div>";
  }

  function plegado(titulo, items) {
    if (!items || !items.length) return "";
    return '<details class="sec-lavado rounded-3xl px-7 py-5 mt-5">' +
      '<summary class="text-[12.5px] font-semibold text-slate-600 cursor-pointer ' +
      'hover:text-slate-900">' + esc(titulo) + " · " + items.length + "</summary>" +
      '<ul class="mt-5 space-y-3 text-[12.5px] text-slate-500 leading-relaxed ' +
      'list-disc pl-5">' + items.map(function (l) {
        if (typeof l === "string") return "<li>" + l + "</li>";
        return '<li><b class="text-slate-700 font-semibold">' +
          esc(l.que || l.fuente || "") + (l.estado ? " · " + esc(l.estado) : "") +
          ".</b> " + esc(l.detalle || l.descripcion || "") +
          (l.impacto ? " " + esc(l.impacto) : "") +
          (l.remedio ? ' <i class="text-slate-400">' + esc(l.remedio) + "</i>" : "") +
          "</li>";
      }).join("") + "</ul></details>";
  }

  /* ── 1 · Resumen ─────────────────────────────────────────────────────────── */

  /* La portada, con la estructura de la imagen de referencia que mando Mercadeo
     el 2026-08-31: una tarjeta oscura grande a la izquierda con la frase de la
     semana y el boton de accion, tres tarjetas numeradas de color al lado, la
     fila de estadisticas en blanco debajo, y la lista de pendientes al final.

     TODO numero de aqui se deriva del dato. La imagen de referencia trae un
     «28%» de adorno en cada tarjeta; aqui cada barra tiene un denominador real
     y el pie de la tarjeta dice cual es. Una barra sin denominador es un dibujo.

     Los tres colores van en las tarjetas de PREVIO, no en las de dato: las
     cuatro tarjetas de estadistica siguen blancas, que es lo que pidio
     Mercadeo. */

  /* Una tarjeta numerada, del color de la seccion que previsualiza. Es un
     enlace entero: la tarjeta lleva a su seccion. */
  function cardNum(num, secId, icono, titulo, valor, sub, frac, pie) {
    var barra = "";
    if (frac && frac.total > 0) {
      var pc = Math.round(frac.parte / frac.total * 100);
      barra = '<div class="mt-4"><div class="h-1.5 rounded-full ' +
        'bg-black/[0.12] overflow-hidden"><div class="h-full rounded-full ' +
        'bg-black/75 transition-all duration-700" style="width:' + pc +
        '%"></div></div></div>';
    }
    return '<a href="#' + secId + '" class="rounded-3xl p-6 flex flex-col ' +
      'min-h-[212px] transition-transform hover:-translate-y-0.5" ' +
      'style="background:var(--sec-' + secId + ');color:var(--sec-' + secId +
      '-tinta)">' +
      '<div class="flex items-start justify-between">' +
      '<span class="text-[12px] font-bold tabular-nums opacity-45">' + num +
      "</span>" +
      '<span class="opacity-70">' + svg(icono, "w-[18px] h-[18px]") + "</span>" +
      "</div>" +
      '<div class="mt-auto pt-6">' +
      '<div class="text-[13.5px] font-bold leading-snug">' + esc(titulo) +
      "</div>" +
      '<div class="text-[27px] font-bold tracking-[-0.03em] tabular-nums ' +
      'leading-none mt-2.5">' + valor + "</div>" +
      '<div class="text-[11.5px] opacity-70 mt-1.5 leading-snug">' + esc(sub) +
      "</div>" + barra +
      (pie ? '<div class="text-[10.5px] opacity-60 mt-2 leading-snug">' +
        esc(pie) + "</div>" : "") +
      "</div></a>";
  }

  function resumen() {
    /* `P` es la pauta recalculada sobre la ventana; `L` es el agregado del
       periodo completo que emite la corrida. Se prefiere P cuando existe, y L
       queda como respaldo para una corrida sin desglose diario. Los dos suman
       lo mismo cuando no hay ventana propia: lo garantiza la compuerta de
       reconciliación, que corre en cada corrida. */
    var P = pauta(null);
    /* `P ? P.principal : leadTotal()` y NO `(P && P.principal) || leadTotal()`.
       Con `||`, una ventana vacía —principal en null— caía al agregado del
       periodo completo y el KPI de costo mostraba $2.61 mientras el titular
       decía «ningún día de pauta cae en el rango». Es exactamente el error del
       +105.6% otra vez: un respaldo que se dispara cuando NO debe. El respaldo
       es para una corrida SIN desglose diario, no para una ventana sin días.
       Lo encontró la prueba con la ventana de junio. */
    var L = P ? P.principal : leadTotal();
    var rs = D.redes_sociales, t = (rs && rs.totales) || {};
    var vari = variacionOrganico();
    var act = estrategiaActiva();
    var vis = tareasVisibles();
    var decid = vis.filter(function (x) { return E.decisiones[x.id]; }).length;

    /* ── la tarjeta oscura ───────────────────────────────────────────────── */

    /* La frase de la semana sale del dato o no sale. Sin pauta leida no se
       escribe una frase generica: se dice que falta. */
    var titular, apoyo;
    var costoL = L ? (L.costo != null ? L.costo : L.costo_por_resultado) : null;
    if (P && P.vacia) {
      /* Una ventana sin pauta NO es una semana sin resultados. Es que no hay
         dato ahí, y la frase de la semana no se escribe sobre un hueco. */
      titular = "Ningún día de pauta cae en el rango elegido.";
      apoyo = P.tope
        ? "La pauta de esta corrida va del " + P.tope.desde + " al " + P.tope.hasta
        : "Sin días de pauta en la ventana.";
    } else if (L && L.resultados) {
      titular = 'La pauta trajo <b class="font-bold">' + ent(L.resultados) +
        " leads</b> a " + dinero(costoL) + " cada uno.";
      apoyo = ent(L.campanas) + " campañas con entrega · " + dinero(L.gasto) +
        " invertidos" +
        (P && P.recortada ? " · " + P.dias + (P.dias === 1 ? " día" : " días") +
                            " en la ventana" : "");
    } else if (L && L.gasto) {
      /* Gasto sin un solo resultado en la ventana. Pasa de verdad si la ventana
         cae en días flacos, y decirlo es mejor que un costo por lead infinito. */
      titular = "Hubo inversión y ningún lead atribuido en el rango elegido.";
      apoyo = dinero(L.gasto) + " invertidos · sin resultados, así que no hay " +
        "costo por lead que calcular";
    } else {
      titular = "Esta corrida no trae rendimiento de pauta.";
      apoyo = "Sin el dato no se escribe la frase de la semana.";
    }

    var pcDec = vis.length ? Math.round(decid / vis.length * 100) : 0;
    var heroe = '<div class="rounded-3xl p-8 sm:p-9 flex flex-col" ' +
      'style="background:var(--sec-resumen);color:var(--sec-resumen-tinta)">' +
      '<div class="text-[10.5px] font-bold tracking-[0.14em] uppercase ' +
      'opacity-50">Semana del ' + esc((D.corrida || {}).rango || "") + "</div>" +
      '<h3 class="text-[25px] sm:text-[29px] font-bold leading-[1.18] ' +
      'tracking-[-0.02em] mt-4 max-w-[24ch]">' + titular + "</h3>" +
      '<p class="text-[12.5px] opacity-60 mt-3">' + esc(apoyo) + "</p>" +
      (act
        ? '<p class="text-[13px] opacity-85 mt-6 leading-relaxed max-w-[46ch] ' +
          'line-clamp-3"><b class="font-semibold">' + esc(act.nombre) + ".</b> " +
          esc(act.en_pocas_palabras) + "</p>"
        : '<p class="text-[13px] opacity-85 mt-6 leading-relaxed">Ninguna ' +
          "estrategia sostenida por los datos de esta corrida.</p>") +
      '<div class="mt-auto pt-7">' +
      '<div class="flex items-baseline justify-between text-[11.5px] ' +
      'opacity-60 mb-2"><span>Decisiones tomadas</span>' +
      '<span class="tabular-nums font-semibold">' + decid + " / " + vis.length +
      "</span></div>" +
      '<div class="h-1.5 rounded-full bg-white/20 overflow-hidden mb-7">' +
      '<div class="h-full rounded-full bg-white transition-all duration-700" ' +
      'style="width:' + pcDec + '%"></div></div>' +
      '<a href="#estrategia" class="inline-flex items-center gap-2 bg-white ' +
      'text-slate-900 rounded-full px-6 py-3.5 text-[13px] font-semibold ' +
      'hover:opacity-90 transition-opacity">Ir a decidir' +
      svg(ico.flecha, "w-4 h-4") + "</a></div></div>";

    /* ── 01 · Rendimiento ────────────────────────────────────────────────── */

    /* El reparto por mercado también se recalcula: es el requisito de que GT y
       SV se muevan con la ventana igual que el total. Sin desglose diario cae
       al agregado del periodo. */
    var porM = mercados().map(function (m) {
      var pm = pauta(m);
      var q = pm ? pm.principal : (D.por_mercado[m] || {}).principal;
      return { m: m, r: (q && q.resultados) || 0 };
    });
    var sumaM = porM.reduce(function (a, x) { return a + x.r; }, 0);
    var lider = porM.slice().sort(function (a, b) { return b.r - a.r; })[0];
    var c01 = cardNum("01", "rendimiento", ico.grafico, "Rendimiento",
      ent(L && L.resultados), "leads del indicador actions:lead",
      lider && sumaM ? { parte: lider.r, total: sumaM } : null,
      lider && sumaM
        ? lider.m + " concentra " + Math.round(lider.r / sumaM * 100) +
          "% de los leads medidos"
        : "");

    /* ── 02 · Competencia ────────────────────────────────────────────────── */

    /* Se cuentan MARCAS, no anuncios. Sumar los anuncios de los dos mercados
       duplicaria las campañas regionales: Shopify devuelve los mismos 16 en GT
       y en SV. Contar marcas no tiene ese problema. */
    var todasM = marcas();
    /* Solo COMPETIDORES. Shopify tiene 16 anuncios activos y es un referente:
       contarlo aqui diria que nos disputa el mercado cuando lo que hace es
       ensenarnos como se ve un buen anuncio. Un referente no suma a la presion
       competitiva (ADR-017). */
    var comps = todasM.filter(function (b) { return b.rol === "competidor"; });
    var disputan = comps.filter(function (b) {
      return Object.keys(b.mercados || {}).some(function (m) {
        return b.mercados[m].presion_real > 0;
      });
    });
    var faltanM = sinMedir().filter(function (x) {
      return x.rol === "competidor";
    }).length;
    var registro = comps.length + faltanM;
    var terr = ((D.referencias || {}).territorios) || {};
    var top = (terr.saturados || [])[0];
    var c02 = cardNum("02", "competencia", ico.objetivo, "Competencia",
      ent(disputan.length), "competidores con anuncios que nos disputan",
      registro ? { parte: disputan.length, total: registro } : null,
      "de " + registro + " del registro" +
      (faltanM ? " · " + faltanM + " sin medir" : "") +
      (top ? " · repite «" + top.mensaje + "»" : ""));

    /* ── 03 · Referencias ────────────────────────────────────────────────── */

    var ocup = (terr.saturados || []).length, libres = (terr.libres || []).length;
    /* La tarjeta previsualiza lo ACCIONABLE de la sección. Antes contaba
       territorios de mensaje; desde que la corrida trae el análisis profundo, lo
       que se va a usar en la mesa son las recomendaciones. Si no hay análisis
       profundo, vuelve a los territorios: la tarjeta no puede quedar vacía ni
       mostrar un cero que parecería medido. */
    var RC = reco(), c03;
    if (RC && (RC.recomendaciones || []).length) {
      var rs = RC.recomendaciones;
      var altas = rs.filter(function (x) { return x.confianza === "alta"; }).length;
      var evitar = rs.filter(function (x) { return x.tipo === "evitar"; }).length;
      c03 = cardNum("03", "referencias", ico.brujula, "Qué hacer",
        ent(rs.length), "recomendaciones con evidencia",
        { parte: altas, total: rs.length },
        altas + " de confianza alta" +
        (evitar ? " · " + evitar + " territorio" + (evitar === 1 ? "" : "s") +
          " que no tocar" : ""));
    } else {
      c03 = cardNum("03", "referencias", ico.brujula, "Referencias",
        ent(ocup + libres), "territorios de mensaje leídos",
        ocup + libres ? { parte: ocup, total: ocup + libres } : null,
        ocup + " ocupado" + (ocup === 1 ? "" : "s") + " · " + libres +
        " sin disputa");
    }

    /* ── la fila de estadisticas, en blanco ──────────────────────────────── */

    /* Los tres KPI de pauta ya obedecen la ventana. El único que no puede es
       Interacciones orgánicas, cuyo VALOR viene de la lectura de Zoho Social
       —que no trae fecha por publicación en el resultado— aunque su variación
       sí se recorta. */
    var kpis = [
      kpi("Leads del periodo", ent(L && L.resultados),
        (P && P.vacia)
          ? "ningún día de pauta en el rango"
          : "indicador " + (P ? P.indicador_principal : "actions:lead")),
      kpi("Inversión", dinero(L && L.gasto),
        (P && P.vacia) ? "ningún día de pauta en el rango" :
        L ? (ent(L.campanas) + " campañas con entrega" +
             (L.gasto_sin_resultado
                ? " · " + dinero(L.gasto_sin_resultado) + " sin resultado"
                : "")) : ""),
      /* Sin resultados no sale $0.00 ni infinito: sale por qué no se calcula. */
      kpi("Costo por lead",
        (L && (L.costo != null || L.costo_por_resultado != null))
          ? dinero(L.costo != null ? L.costo : L.costo_por_resultado)
          : "—",
        (P && P.vacia) ? "ningún día de pauta en el rango" :
        (L && !L.resultados && L.gasto)
          ? "sin leads en el rango: no hay costo que calcular"
          : mercados().map(function (m) {
              var pm = pauta(m);
              var q = pm ? pm.principal : (D.por_mercado[m] || {}).principal;
              var c = q ? (q.costo != null ? q.costo : q.costo_por_resultado) : null;
              return m + " " + (c != null ? dinero(c) : "—");
            }).join(" · ")),
      /* Este KPI viene de la lectura de Zoho Social, que no trae fecha por
         publicación: es del periodo de la corrida y no se puede recalcular por
         rango. El alcance sí se recalcula, y está en Rendimiento. */
      kpi("Interacciones orgánicas", ent(t.interacciones),
        vari ? (vari.etDe && vari.etA
                  ? "de " + vari.de + " (" + vari.etDe + ") a " + vari.a +
                    " (" + vari.etA + ")"
                  : "de " + vari.de + " a " + vari.a + " contra la semana anterior")
             : (t.publicaciones || 0) + " publicaciones", vari),
    ].join("");

    /* ── la lista de pendientes ──────────────────────────────────────────── */

    /* Aqui el color NO es de la paleta: es el semaforo. Aceptada verde,
       rechazada roja, sin decidir ambar — un estado intermedio de verdad, no
       un hueco. Instruccion de Mercadeo (2026-08-31) y ademas es lo correcto:
       si el estado fuera pastel se confundiria con la identidad de la
       seccion. */
    /* La misma lista que usa el selector de la seccion Estrategia, para que el
       nombre que se ve aqui sea el que se guardo alla. */
    var personas = (((D.estrategia || {}).asignacion) || {}).personas || [];
    var quien = function (id) {
      for (var i = 0; i < personas.length; i++) {
        if (String(personas[i].id_sprint) === String(id)) return personas[i].nombre;
      }
      return null;
    };
    var pend = vis.map(function (x) {
      var d = E.decisiones[x.id], e = d ? d.estado : null;
      var nom = d && d.responsable ? quien(d.responsable) : null;
      return fila(
        (x.tipo || "?").slice(0, 2).toUpperCase(),
        x.titulo,
        (x.tipo === "pauta" ? "cambio en pauta" : x.tipo) +
          (nom ? " · " + nom : e === "aceptada" ? " · sin responsable" : ""),
        /* El estado va escrito Y en color. Solo con color quedaria fuera quien
           no lo percibe; solo con la palabra habria que leer tres filas para
           ver como va la mesa. */
        '<span class="' + (e === "aceptada" ? "text-emerald-600"
          : e === "rechazada" ? "text-rose-600" : "text-amber-600") + '">' +
        (e === "aceptada" ? "Aceptada" : e === "rechazada" ? "Rechazada"
          : "Sin decidir") + "</span>",
        e ? "" : "esperando la mesa",
        e === "aceptada" ? "verde" : e === "rechazada" ? "rojo" : "ambar");
    });

    var lista = '<div class="bg-white rounded-3xl p-7 tarjeta-sombra">' +
      cardCab("Para decidir en la mesa",
        decid + " de " + vis.length + " ya tienen decisión",
        "pend", pend.length, 3) +
      (pend.length
        ? '<div class="divide-y divide-slate-50">' +
          recorta(pend, "pend").join("") + "</div>"
        : '<p class="text-[13px] text-slate-400 py-2">Ninguna tarea coincide ' +
          "con la búsqueda.</p>") + "</div>";

    var rotulo = function (txt) {
      return '<h3 class="text-[15px] font-bold text-slate-800 ' +
        'tracking-[-0.01em] mb-5 mt-10">' + esc(txt) + "</h3>";
    };

    return seccion("resumen", "La semana", "Resumen",
      "Los datos, y qué decidir con eso.", "",
      /* Una sola columna hasta xl: por debajo de eso el heroe a media pantalla
         deja las tres tarjetas en 170 px y el titulo se parte en cinco lineas.
         Medido en la prueba, no supuesto: con 1.05fr_1fr desde tableta las
         tres no caben en fila y se rompe el 2+1. */
      '<div class="grid gap-6 xl:[grid-template-columns:1fr_1.18fr]">' +
      heroe +
      '<div class="grid gap-5 ' +
      '[grid-template-columns:repeat(auto-fill,minmax(min(160px,100%),1fr))] ' +
      'xl:[grid-template-columns:repeat(3,minmax(0,1fr))]">' +
      c01 + c02 + c03 + "</div></div>" +
      rotulo("Estadísticas") +
      '<div class="grid gap-6 ' +
      '[grid-template-columns:repeat(auto-fill,minmax(min(230px,100%),1fr))]">' +
      kpis + "</div>" +
      rotulo("Pendientes") +
      leyendaPeriodo("La lista de pendientes sale") + lista);
  }

  /* La advertencia de que los indicadores no se suman, con los numeros del
     mercado que se esta viendo. Antes eran dos literales y contradecian el
     total de la pantalla al cambiar de mercado. */
  function noSeSuman(d) {
    var base = "El total de arriba es solo del indicador principal: las " +
      "campañas no se suman entre indicadores distintos.";
    var ind = d.indicadores || {}, pr = d.indicador_principal;
    var otro = null;
    Object.keys(ind).forEach(function (k) {
      if (k === pr || !ind[k].utilizable) return;
      if (!otro || ind[k].resultados > ind[otro].resultados) otro = k;
    });
    if (!otro || !pr || !ind[pr]) return base;
    return "Las campañas no se suman entre indicadores distintos: " +
      ent(ind[pr].resultados) + " " + enClaro(pr).toLowerCase() + " y " +
      ent(ind[otro].resultados) + " " + enClaro(otro).toLowerCase() +
      " no son la misma cosa. El total de arriba es solo del indicador " +
      "principal.";
  }

  /* ── 2 · Rendimiento ─────────────────────────────────────────────────────── */
  function rendimiento() {
    var m = mercadoActivo(), ms = mercados();
    if (!m) return seccion("rendimiento", "Pauta y orgánico", "Rendimiento", "", "",
      nota("Sin datos por mercado en esta corrida."));
    var d = D.por_mercado[m] || {};
    /* La pauta del mercado activo, recalculada sobre la ventana. `d.principal`
       queda de respaldo para una corrida sin desglose diario. */
    var PM = pauta(m);
    // Mismo cuidado que en resumen(): el respaldo es por falta de desglose, no
    // por ventana vacía.
    var p = PM ? PM.principal : d.principal;
    var s = serieTotal(), se = s && s.crudo;
    var costoP = p ? (p.costo != null ? p.costo : p.costo_por_resultado) : null;

    var kpis = (PM && PM.vacia) ? "" : (p ? [
      kpi(enClaro(d.indicador_principal), ent(p.resultados),
        "indicador " + (d.indicador_principal || "—")),
      kpi("Inversión", dinero(p.gasto),
        p.gasto_sin_resultado
          ? dinero(p.gasto_sin_resultado) + " sin resultado atribuido" : ""),
      kpi("Costo por lead", costoP != null ? dinero(costoP) : "—",
        costoP == null && p.gasto ? "sin leads en el rango" : ""),
      /* Ahora sí es «con entrega EN LA VENTANA», que es un número distinto y
         mejor que el del periodo completo. Por eso ya no lleva sello. */
      kpi("Campañas con entrega", ent(p.campanas),
        (PM && PM.recortada ? "con entrega en la ventana" : "") ||
        "no es lo mismo que activas hoy"),
    ].join("") : "");

    /* Las filas de campañas salen del desglose diario para que se muevan con la
       ventana. Se AGRUPA POR INDICADOR antes de sumar (ADR-013) y la división
       va una sola vez, al final, por campaña. */
    var cs;
    if (PM && !PM.vacia) {
      var porC = {};
      (pautaDia().piezas || []).forEach(function (q) {
        var R = rango();
        if (q.p !== m) return;
        if (R && R.propio && !(q.f >= R.desde && q.f <= R.hasta)) return;
        var e = porC[q.c + "|" + q.k] || (porC[q.c + "|" + q.k] = {
          etiqueta: q.n, indicador: q.k, resultados: 0, gasto: 0,
          impresiones: 0, sin_resultado: 0
        });
        e.gasto += q.g; e.impresiones += q.i;
        if (q.r == null) e.sin_resultado += q.g; else e.resultados += q.r;
      });
      cs = Object.keys(porC).map(function (k) {
        var e = porC[k];
        e.gasto = Math.round(e.gasto * 100) / 100;
        e.costo_por_resultado = e.resultados ? e.gasto / e.resultados : null;
        return e;
      }).sort(function (a, b) { return b.gasto - a.gasto; });
    } else {
      cs = (d.campanas || []);
    }
    cs = cs.filter(function (c) {
      return coincide(c.etiqueta, enClaro(c.indicador));
    });
    var filas = recorta(cs, "camp", 4).map(function (c) {
      var cc = c.costo_por_resultado;
      return fila((c.etiqueta.match(/[A-Z]/g) || ["C"]).slice(0, 2).join(""),
        c.etiqueta.replace(/\s*\[[A-Z]{2}\]\s*$/, ""),
        enClaro(c.indicador) + " · " + ent(c.resultados) + " resultados" +
          (c.sin_resultado ? " · " + dinero(c.sin_resultado) + " sin resultado" : ""),
        cc != null ? dinero(cc) : "—",
        dinero(c.gasto) + " invertidos",
        cc != null && cc <= 2.6 ? "verde" : null);
    }).join("");

    /* Cada serie va con DOS colores del mismo tono: el trazo (oscuro, para la
       linea) y el pastel (para el area). Los dos salen de config/tema.json. */
    var COL = ["var(--trazo-azul)", "var(--trazo-rosa)", "var(--trazo-verde)"];
    var REL = ["var(--pastel-azul)", "var(--pastel-rosa)", "var(--pastel-verde)"];
    var orden = ["facebook", "instagram", "youtube"];
    var gInt = "", gVis = "";
    if (se) {
      gInt = grafico("gInt", {
        titulo: "Interacciones por semana", semanas: se.semanas, area: true,
        series: orden.filter(function (r) { return se.interacciones[r]; })
          .map(function (r, i) {
            return { nombre: RED[r] || r, valores: se.interacciones[r],
                     color: COL[i], relleno: REL[i] };
          }),
      });
      var conVistas = orden.filter(function (r) { return se.vistas[r]; });
      gVis = conVistas.length ? grafico("gVis", {
        titulo: "Vistas de video por semana", semanas: se.semanas, area: true,
        series: conVistas.map(function (r) {
          return { nombre: RED[r] || r, valores: se.vistas[r],
                   color: COL[orden.indexOf(r)],
                   relleno: REL[orden.indexOf(r)],
                   patron: orden.indexOf(r) + 1 };
        }),
      }) : "";
    }

    var det = (D.redes_sociales || {}).detalle || {};
    var redes = Object.keys(det).sort().map(function (n) {
      var r = det[n];
      if (r.silenciosa) {
        return fila(n.slice(0, 2).toUpperCase(), RED[n] || n,
          r.dias_de_silencio + " días sin publicar", "0", "publicaciones", "rojo");
      }
      return fila(n.slice(0, 2).toUpperCase(), RED[n] || n,
        r.publicaciones + " publicaciones" +
        (r.vistas != null ? " · " + ent(r.vistas) + " vistas" : ""),
        ent(r.interacciones), "interacciones");
    }).join("");

    /* El subtítulo dice de qué ventana son los números. Con ventana propia deja
       de ser «del periodo de la corrida», y decir el periodo viejo ahí sería
       justo el error que el filtro vino a arreglar. */
    var deQue = (PM && PM.recortada && !PM.vacia && PM.primer)
      ? "</b>, del " + esc(PM.primer) + " al " + esc(PM.ultimo) +
        " · " + PM.dias + (PM.dias === 1 ? " día con entrega" : " días con entrega")
      : "</b>, del periodo " + esc((D.corrida || {}).rango || "");

    return seccion("rendimiento", "Pauta y orgánico", "Rendimiento",
      "Meta Ads en <b class=\"text-slate-600 font-semibold\">" + esc(m) +
      deQue + ".",
      pastillas("mercado", ms.map(function (x) {
        return { v: x, n: x === "GT" ? "Guatemala" : x === "SV" ? "El Salvador" : x };
      }), m),
      (PM && PM.vacia
        ? '<div class="bg-white rounded-3xl p-7 tarjeta-sombra mb-6">' +
          pautaVacia(PM) + "</div>"
        : '<div class="grid gap-6 [grid-template-columns:repeat(auto-fill,minmax(min(230px,100%),1fr))] mb-6">' +
          kpis + "</div>") +
      '<div class="bg-white rounded-3xl p-7 tarjeta-sombra mb-6">' +
      /* Ya NO lleva sello: con el desglose diario estas filas obedecen la
         ventana. El sello decía que la corrida agregaba por periodo; eso dejó
         de ser cierto. Dejarlo puesto sería mentir en la otra dirección. */
      cardCab("Campañas con entrega", buscando()
        ? "Solo las que coinciden con la búsqueda"
        : (PM && PM.recortada
             ? "Con entrega en la ventana · ordenadas por inversión"
             : "Ordenadas por inversión"), "camp", cs.length, 4) +
      (cs.length
        ? '<div class="divide-y divide-slate-50">' + filas + "</div>"
        : '<p class="text-[13px] text-slate-400 py-2">Ninguna campaña del ' +
          "periodo coincide con la búsqueda.</p>") +
      '<p class="text-[11.5px] text-slate-400 mt-5" title="' + esc(noSeSuman(d)) +
      '">Los indicadores no se suman entre campañas distintas.</p></div>' +
      (gInt ? '<div class="grid gap-6 [grid-template-columns:repeat(auto-fill,minmax(min(420px,100%),1fr))] mb-6">' +
        '<div class="bg-white rounded-3xl p-7 tarjeta-sombra">' +
        cardCab("Interacciones por semana",
          "Reacciones más comentarios de las piezas de cada semana") + gInt + "</div>" +
        (gVis ? '<div class="bg-white rounded-3xl p-7 tarjeta-sombra">' +
          cardCab("Vistas de video por semana",
            "Solo YouTube las reporta entre las redes del informe") + gVis + "</div>"
          : "") + "</div>" : "") +
      bloqueAlcance() +
      '<div class="bg-white rounded-3xl p-7 tarjeta-sombra mt-10">' +
      cardCab("Redes sociales", "Sin corte por país: una sola marca para GT y SV") +
      '<div class="divide-y divide-slate-50">' + redes + "</div></div>" +
      plegado("Lo que este bloque no puede decir",
        ((D.redes_sociales || {}).limites || []).concat(
          se ? [{ que: "qué mide cada punto", detalle: se._que_mide },
                { que: "por qué las líneas arrancan distinto",
                  detalle: se._por_que_arrancan_distinto }] : [])));
  }

  /* ── 3 · Competencia ─────────────────────────────────────────────────────── */
  function competencia() {
    var todas = marcas();

    if (V.grupo === "referentes") {

      }).join("");

      var msgs = (b.mensajes || []).length

        : '<p class="text-[12.5px] text-slate-400 leading-relaxed py-2">' +

      if (b.advertencia) extra.push(esc(b.advertencia));
      if (b.metodo) extra.push("Método: " + esc(b.metodo));

      var lg = logoDe(b.nombre), prof = dossierDe(b), dos = prof[0] || null;
      return '<div class="bg-white rounded-3xl p-7 tarjeta-sombra">' +
        '<div class="flex items-start justify-between gap-3 mb-6">' +
        '<div class="flex items-center gap-3 min-w-0">' +
        (lg ? '<span class="w-11 h-11 rounded-2xl shrink-0 fila-logo grid ' +
              'place-items-center"><img src="' + esc(lg) + '" alt="' +
              esc(b.nombre) + '"></span>' : "") +

        'truncate">' + esc(b.nombre) + "</h3></div>" +
        '<div class="flex gap-1.5 flex-wrap justify-end">' +

        '<div class="flex items-center gap-3 mb-4">' +
        (lgx ? '<span class="w-11 h-11 rounded-2xl shrink-0 fila-logo grid ' +
               'place-items-center"><img src="' + esc(lgx) + '" alt="' +
               esc(x.nombre) + '"></span>' : "") +
        '<h3 class="text-[17px] font-bold text-slate-800">' + esc(x.nombre) +
        "</h3>" +
        '<span class="etiqueta-ambar">' + esc(x.estado) + "</span></div>" +
        '<p class="text-[13px] text-slate-500 leading-relaxed mb-4">' +

  /* ── 4 · Referencias ─────────────────────────────────────────────────────── */
  function referencias() {
    var R = D.referencias;
    if (!R) return seccion("referencias", "Contraste", "Referencias", "", "",
      nota("Sin datos de referencias en esta corrida."));

    /* La tabla de contraste se quitó con la tarjeta «Nosotros contra
       ellos» (2026-09-04). `R.contraste` sigue en resultado.json por si
       vuelve a hacer falta; aquí ya no se pinta. */

    var t = R.territorios || {};
    var terr = (t.saturados || []).map(function (s) {
      return '<div class="bg-white rounded-3xl p-7 tarjeta-sombra">' +
        '<div class="etiqueta-rojo mb-4">Territorio ocupado</div>' +
        '<h3 class="text-[17px] font-bold text-slate-800 leading-snug mb-3">«' +
        esc(s.mensaje) + "»</h3>" +
        '<p class="text-[13px] text-slate-500 leading-relaxed mb-4">' +
        esc(s.lectura) + "</p>" +
        '<div class="text-[11.5px] text-slate-400">' + esc(s.de) + " · " +
        esc(s.mercado) + " · " + s.repeticiones + " anuncios · " + s.dias_vivo +

        "</h3>" +
        '<p class="text-[13px] text-slate-500 leading-relaxed">' + esc(l.lectura) +
        "</p></div>";
    })).join("");

    /* ── Qué hacer con todo esto ──────────────────────────────────────────
       Es el puente entre «qué hacen ellos» y «qué producimos nosotros». Va en
       Referencias porque cruza las dos fuentes: lo que el competidor ocupa y lo
       que el referente hace y aquí nadie hace. */
    var RC = reco();
    var recs = RC ? (RC.recomendaciones || []).filter(function (x) {
      return coincide(x.titulo, x.que_hacer, x.porque);

    var bloqueRecs = "";

            'font-semibold shrink-0 hover:underline mt-1" ' +

            (V.verTodo.recs ? "Ver menos" : "Ver todo (" + recs.length + ")") +
            "</button>"

        leyendaPeriodo("Las recomendaciones salen") +
        nota("<b class=\"text-slate-700 font-semibold\">No dice qué le " +
          "funcionó a la competencia</b>, dice dónde apuesta." +
          '<details class="inline"><summary class="inline cursor-pointer ' +

        (recs.length

        '<div class="grid gap-6 mt-6 ' +

      return '<div class="bg-white rounded-3xl p-7 tarjeta-sombra">' +

        '<h3 class="text-[15px] font-bold text-slate-800 leading-snug mb-3">' +

    return seccion("referencias", "Qué hacer", "Referencias",
      "Las recomendaciones, y de dónde salen.", "",
      /* Lo ACCIONABLE va primero. Estaba debajo de la tabla de contraste y
         Mercadeo no lo encontró: en una sección larga, el orden es la
         navegación. Lo que se va a usar en la mesa no puede estar a dos
         scrolls de distancia. */
      (bloqueRecs ? bloqueRecs + '<div class="mt-12"></div>' : "") +
      /* Quitada la tarjeta «Nosotros contra ellos» (2026-09-04, a pedido de
         Mercadeo). Era una tabla de contraste que ponía nuestras interacciones
         al lado del conteo de anuncios del competidor: dos cosas que la propia
         tarjeta tenía que aclarar que no se comparan. Lo accionable de esta
         sección son las recomendaciones y los territorios, que quedan. */
      (terr ? '<h3 class="text-[17px] font-bold text-slate-800 mb-5 mt-10">' +
        'Territorios de mensaje</h3>' +
        '<div class="grid gap-6 [grid-template-columns:repeat(auto-fill,minmax(min(340px,100%),1fr))] mb-6">' +
        terr + "</div>" : "") +

      '<div class="grid gap-6 [grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr))]">' +
      busq + "</div>" +
      plegado("Lo que esta sección no puede dar", R.limites || []));

  /* ── 5 · Estrategia ──────────────────────────────────────────────────────── */

          '<div><div class="micro-et">Cuándo NO conviene</div>' +
          '<p class="text-[12.5px] text-amber-700 leading-relaxed">' +

          'text-slate-500 leading-relaxed list-disc pl-5 space-y-1.5">' +
          (e.evidencia || []).map(function (x) {
            return "<li>" + esc(x) + "</li>"; }).join("") + "</ul></div>" +
          "</div></details>" +
          '<div class="mt-auto pt-5 border-t border-slate-50 flex items-center ' +
          'justify-between gap-3">' +
          '<span class="text-[12px] text-slate-400">Activa ' + e.tareas.length +

            'class="btn-claro"' + (soloLectura ? " disabled" : "") +
            ">Usar esta</button>") + "</div></div>";
      }).join("") + "</div>";

  function selectorResponsable(id, actual, asig) {
    if (!asig.habilitada) {
      return '<select disabled class="campo w-full max-w-[220px] opacity-50">' +
        "<option>Sin lista de personas</option></select>";

          "</option>";

  function tarjetaTarea(t, asig) {
    var d = E.decisiones[t.id], estado = d ? d.estado : null;
    var det = [];
    if (t.angulo) det.push(["Ángulo", esc(t.angulo)]);
    if (t.instruccion_exacta) det.push(["Instrucción exacta", esc(t.instruccion_exacta)]);
    if (t.tipo !== "pauta") {
      det.push(["Cuántas piezas", t.piezas != null
        ? "<b class=\"text-slate-700\">" + t.piezas + "</b> · " + esc(t.piezas_motivo)
        : "<b class=\"text-slate-700\">Lo decide la mesa.</b> " + esc(t.piezas_motivo)]);
    }
    if (t.copy) {
      det.push(["Copy", "<b class=\"text-slate-700\">" + esc(t.copy.estado) +
        ".</b> " + esc(t.copy.motivo) + '<ul class="list-disc pl-5 mt-2 space-y-1">' +
        (t.copy.falta || []).map(function (f) {
          return "<li>" + esc(f) + "</li>"; }).join("") + "</ul>"]);
    }
    if ((t.referencias || []).length) {
      det.push(["Referencia visual", (t.referencias).map(function (r) {
        return '<a href="' + esc(r.url) + '" target="_blank" ' +
          'rel="noopener noreferrer" class="etiqueta-marca mr-1.5 mb-1.5 ' +
          'inline-block hover:underline">' + esc(r.tema) + "</a>";
      }).join("")]);
    }
    if ((t.evidencia || []).length) {
      det.push(["Evidencia", '<ul class="list-disc pl-5 space-y-1.5">' +
        t.evidencia.map(function (e) {
          return "<li>" + esc(evidencia(e)) + "</li>"; }).join("") +
        "</ul>"]);
    }

    return '<div class="bg-white rounded-3xl p-7 flex flex-col ' +
      (estado === "aceptada" ? "tarjeta-aceptada"
        : estado === "rechazada" ? "tarjeta-sombra opacity-60" : "tarjeta-sombra") +
      '">' +
      '<div class="flex items-center gap-2 flex-wrap mb-4">' +
      '<span class="etiqueta-marca">' +
      esc(t.tipo === "pauta" ? "cambio en pauta" : t.tipo) + "</span>" +
      (t.requiere_humano ? '<span class="etiqueta-ambar">la aplica una persona' +
        "</span>" : "") +
      (estado ? '<span class="ml-auto ' +
        (estado === "aceptada" ? "etiqueta-verde" : "etiqueta-rojo") + '">' +
        (estado === "aceptada" ? "Aceptada" : "Rechazada") + "</span>" : "") +
      "</div>" +
      '<h3 class="text-[17px] font-bold text-slate-800 leading-snug mb-3">' +
      esc(t.titulo) + "</h3>" +
      '<p class="text-[13px] text-slate-500 leading-relaxed mb-4 max-w-[56ch]">' +
      esc(t.porque) + "</p>" +
      (t.no_decir ? '<div class="bg-rose-50 rounded-2xl px-4 py-3 text-[12.5px] ' +
        'text-rose-700 leading-relaxed mb-4"><b>No decir:</b> «' + esc(t.no_decir) +
        "» — ese terreno ya lo paga la competencia.</div>" : "") +
      (det.length
        ? '<details class="mb-5"><summary class="text-[12px] font-semibold ' +
          'text-slate-400 cursor-pointer hover:text-slate-600">Ver el detalle' +
          '</summary><div class="mt-4 space-y-4">' + det.map(function (p) {
            return '<div><div class="micro-et">' + esc(p[0]) + "</div>" +
              '<div class="text-[12.5px] text-slate-500 leading-relaxed">' + p[1] +
              "</div></div>";
          }).join("") + "</div></details>"
        : "") +
      '<div class="mt-auto pt-5 border-t border-slate-50 flex flex-wrap ' +
      'items-center gap-3 justify-between">' +
      '<div class="flex gap-2">' +
      '<button type="button" data-decidir="' + esc(t.id) + '" data-estado="aceptada" ' +
      'class="' + (estado === "aceptada" ? "btn-verde" : "btn-claro") + '"' +
      (soloLectura ? " disabled" : "") + ">" + svg(ico.tic, "w-4 h-4") +
      "Aceptar</button>" +
      '<button type="button" data-decidir="' + esc(t.id) + '" data-estado="rechazada" ' +
      'class="' + (estado === "rechazada" ? "btn-rojo" : "btn-claro") + '"' +
      (soloLectura ? " disabled" : "") + ">" + svg(ico.x, "w-4 h-4") +
      "Rechazar</button></div>" +
      (estado === "aceptada"
        ? selectorResponsable(t.id, d && d.responsable, asig) : "") +
      "</div></div>";
  }

              (t.responsable === p.id_sprint ? " selected" : "") + ">" +
              esc(p.nombre) + "</option>";
          }).join("") + "</select>"
        : "") + "</div></div>";
