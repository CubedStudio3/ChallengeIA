}

/* Componentes del tablero. Los COLORES, FUENTES y RADIOS no están aquí:
   se generan desde config/tema.json (ver src/modulo1/tema.js). Si buscas
   cambiar el diseño, ese es el archivo.

   Principio de este CSS: **la separación la hace el aire, no la línea.** Casi
   ningún bloque lleva borde; se distinguen porque son blancos sobre un fondo
   gris muy claro y porque hay espacio entre ellos. Cada borde que se agregue
   aquí resta a esa sensación de limpio, así que hay que poder justificarlo:
   quedan solo los hairlines que separan filas de una tabla y los que marcan un
   bloque de advertencia. */

*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--tinta);
  font-family:var(--fam-cuerpo);
  font-size:14.5px; line-height:1.6; -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{margin:0; text-wrap:balance; letter-spacing:-.021em}
h1{font-size:24px; font-weight:700}
h2{font-size:17.5px; font-weight:700}
h3{font-size:15px; font-weight:700}
p{margin:0}
code{font-family:var(--fam-datos); font-size:.86em; background:var(--sup-3);
  padding:2px 6px; border-radius:6px; color:var(--tinta-2)}
.mini-et{font-size:10px; font-weight:700; letter-spacing:.1em;
  text-transform:uppercase; color:var(--tinta-3); display:block; margin-bottom:8px}
.aclara{font-size:12.5px; color:var(--tinta-2); line-height:1.55}
.aclara + .aclara{margin-top:9px}
.aclara b{color:var(--tinta); font-weight:600}
.sub{color:var(--tinta-2); font-size:13.5px; max-width:84ch; margin-bottom:22px}
.mini{margin:0; padding-left:16px; display:flex; flex-direction:column; gap:7px;
  font-size:13px; line-height:1.55}
.mini li b{font-weight:600; color:var(--tinta)}
.mini li.ojo{color:var(--falta-tex)}
.mini li::marker{color:var(--tinta-3)}
.hueco{background:var(--sup-2); border-radius:var(--r-s); padding:20px 22px;
  font-size:13px; color:var(--tinta-2)}
.hueco.chico{padding:13px 15px; font-size:12.5px; line-height:1.55}
.hueco b{color:var(--tinta); font-weight:600}
.metodo{font-family:var(--fam-datos); font-size:10.5px; color:var(--tinta-3);
  margin-top:10px; padding-top:10px; border-top:1px solid var(--borde);
  line-height:1.6; word-break:break-word}

/* ═══ armazón ═══ */
.app{display:grid; grid-template-columns:var(--lateral-w) 1fr; min-height:100vh}
@media (max-width:860px){ .app{grid-template-columns:1fr} }

.lateral{background:var(--lateral); padding:26px 14px; display:flex;
  flex-direction:column; gap:30px; position:sticky; top:0; height:100vh;
  overflow-y:auto; border-right:1px solid var(--borde)}
@media (max-width:860px){
  .lateral{position:static; height:auto; border-right:0;
    border-bottom:1px solid var(--borde)}
}
.logo{display:flex; align-items:center; gap:11px; padding:0 8px}
.logo .g{width:32px; height:32px; border-radius:10px; flex:0 0 auto;
  background:linear-gradient(140deg,var(--marca-fondo),var(--marca-fondo-2));
  display:grid; place-items:center; font-weight:700; font-size:12px; color:#fff}
.logo b{font-size:14px; font-weight:700; display:block; line-height:1.25;
  color:var(--lateral-tex); letter-spacing:-.015em}
.logo span{font-size:11px; color:var(--lateral-tenue); display:block}
.nav{display:flex; flex-direction:column; gap:2px; flex:1 1 auto}
.nav a{display:flex; align-items:center; gap:11px; padding:10px 13px;
  border-radius:var(--r-xs); color:var(--lateral-tenue); text-decoration:none;
  font-size:13.5px; font-weight:600; transition:background .15s, color .15s}
.nav a:hover{background:var(--sup-3); color:var(--lateral-tex)}
.nav a.on{background:var(--lateral-act); color:var(--lateral-tex); font-weight:700}
.nav a:focus-visible{outline:2px solid var(--marca); outline-offset:1px}
.nav a i{width:6px; height:6px; border-radius:50%; background:currentColor;
  opacity:.3; flex:0 0 auto}
.nav a.on i{opacity:1; background:var(--marca)}
.nav a .badge{margin-left:auto; background:var(--marca-fondo); color:#fff;
  font-size:10px; font-weight:700; padding:2px 7px; border-radius:999px}
.lateral .pie{font-size:11px; color:var(--tinta-3); line-height:1.55; padding:0 9px}
.lateral .pie b{color:var(--tinta-2); font-weight:600}

.principal{padding:30px 34px 68px; min-width:0}
@media (max-width:600px){ .principal{padding:22px 16px 48px} }
.barra{display:flex; flex-wrap:wrap; gap:16px; align-items:center;
  justify-content:space-between; margin-bottom:30px}
.barra .izq h1{line-height:1.2}
.barra .izq p{color:var(--tinta-2); font-size:13.5px; margin-top:4px}
.barra .der{display:flex; gap:9px; flex-wrap:wrap}
.lectura{background:var(--sup); border-radius:var(--r-s); padding:14px 18px;
  font-size:13px; margin-bottom:18px; box-shadow:var(--sombra)}

.btn{display:inline-flex; align-items:center; gap:8px; border-radius:999px;
  border:1px solid var(--borde); background:var(--sup); color:var(--tinta);
  font:inherit; font-size:13px; font-weight:600; padding:9px 17px; cursor:pointer;
  transition:box-shadow .16s, transform .16s, background .16s, border-color .16s}
.btn:hover{box-shadow:var(--sombra); border-color:var(--borde-fuerte)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:2px solid var(--marca); outline-offset:2px}
.btn[disabled]{opacity:.4; cursor:not-allowed; transform:none; box-shadow:none}
.btn.chico{font-size:12px; padding:8px 14px}
.btn svg{width:14px; height:14px; fill:none; stroke:currentColor; stroke-width:2;
  stroke-linecap:round; stroke-linejoin:round; flex:0 0 auto}
.btn.pri{background:var(--oscuro); border-color:var(--oscuro);
  color:var(--oscuro-tex)}
.btn.pri:hover{box-shadow:var(--sombra-alta)}
.btn.ok.on{background:var(--bien-suave); border-color:var(--bien-suave);
  color:var(--bien-tex)}
.btn.no.on{background:var(--alerta-suave); border-color:var(--alerta-suave);
  color:var(--alerta-tex)}

section{margin-bottom:44px; scroll-margin-top:20px}
.cab{display:flex; flex-wrap:wrap; gap:14px; align-items:center;
  justify-content:space-between; margin-bottom:14px}
.sub-cab{margin-top:40px}
.acciones-masa{display:flex; gap:9px; flex-wrap:wrap}

/* ═══ control segmentado ═══ */
.seg{display:inline-flex; gap:2px; background:var(--sup-3);
  border-radius:999px; padding:3px}
.seg-b{border:0; background:transparent; color:var(--tinta-2); font:inherit;
  font-size:12.5px; font-weight:600; padding:8px 18px; border-radius:999px;
  cursor:pointer; transition:background .15s, color .15s}
.seg-b:hover{color:var(--tinta)}
.seg-b.on{background:var(--sup); color:var(--tinta); font-weight:700;
  box-shadow:0 1px 3px rgba(20,19,31,.07)}
.seg-b:focus-visible{outline:2px solid var(--marca); outline-offset:2px}
.sub-seg{margin-bottom:20px}

/* ═══ tiras de KPI ═══ */
.tiras{display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:16px}
@media (max-width:980px){ .tiras{grid-template-columns:1fr} }
.tira{background:var(--sup); border-radius:var(--r); padding:22px 24px;
  box-shadow:var(--sombra)}
.tira-cab{font-size:10px; font-weight:700; letter-spacing:.11em;
  text-transform:uppercase; color:var(--tinta-3); margin-bottom:18px}
.kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(124px,1fr));
  gap:18px 20px}
.tira .kpis{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.kpis-panel{margin-bottom:4px}
.kpis.chicos{gap:14px; margin-bottom:16px}
.kpi{min-width:0}
.kpi-et{font-size:11.5px; color:var(--tinta-2); display:block; line-height:1.35}
.kpi-v{font-size:26px; font-weight:700; letter-spacing:-.03em; line-height:1.2;
  display:block; margin-top:4px; font-variant-numeric:tabular-nums;
  word-break:break-word}
.kpi-n{font-size:10.5px; color:var(--tinta-3); display:block; margin-top:5px;
  line-height:1.45}
.kpi.tono-falta .kpi-v{font-size:17px; color:var(--falta-tex)}
.kpis.chicos .kpi-v{font-size:20px}

/* ═══ rejillas y tarjetas de resumen ═══ */
.grid2{display:grid; grid-template-columns:repeat(auto-fit,minmax(348px,1fr));
  gap:16px; align-items:start}
.grid3{display:grid; grid-template-columns:repeat(auto-fit,minmax(278px,1fr));
  gap:16px; align-items:start}
.grid3.rcards{align-items:stretch}
/* Las tres del resumen llevan un tinte decorativo cada una: son tres temas
   distintos en paralelo, y el color ayuda a distinguirlos de un vistazo. Los
   tintes vienen de acentos_suaves en tema.json y NO son semánticos. */
.rcard{border-radius:var(--r); padding:22px 24px; box-shadow:var(--sombra);
  display:flex; flex-direction:column; gap:11px; background:var(--sup)}
.rcards .rcard:nth-child(1){background:var(--ac-uno)}
.rcards .rcard:nth-child(2){background:var(--ac-dos)}
.rcards .rcard:nth-child(3){background:var(--ac-tres)}
.rcard-et{font-size:10px; font-weight:700; letter-spacing:.11em;
  text-transform:uppercase; color:var(--tinta-2)}
.rcard h3{font-size:16px}
.rcard p{font-size:13.5px}
.rcard p b{font-weight:700}
.rcard .mini{gap:6px; font-size:12.5px}
.rcard-ir{margin-top:auto; padding-top:8px; font-size:12.5px; font-weight:600;
  color:var(--tinta); text-decoration:none; opacity:.75}
.rcard-ir:hover{opacity:1}
.prog{height:6px; border-radius:4px; overflow:hidden;
  background:rgba(128,128,140,.26);
  background:color-mix(in srgb, var(--tinta) 15%, transparent)}
.prog-b{height:100%; background:var(--tinta); opacity:.62;
  transition:width .45s cubic-bezier(.2,.7,.3,1)}
@media (prefers-reduced-motion:reduce){ .prog-b{transition:none} }

/* ═══ paneles ═══ */
.panel{background:var(--sup); border-radius:var(--r); padding:22px 24px;
  box-shadow:var(--sombra)}
.panel h3{margin-bottom:12px}
.panel.aviso{background:var(--falta-suave); box-shadow:none; margin-top:22px}
.panel.aviso h3{color:var(--falta-tex)}
.panel.aviso .mini li b{color:var(--falta-tex)}
.panel.atenuado{opacity:.78}

/* ═══ tablas ═══ */
.tabla-wrap{overflow-x:auto; margin:16px 0 10px; border-radius:var(--r);
  background:var(--sup); box-shadow:var(--sombra); padding:6px 4px}
.tabla{width:100%; border-collapse:collapse; font-size:13px; min-width:580px}
.tabla th,.tabla td{text-align:left; padding:13px 20px}
.tabla tbody tr{border-top:1px solid var(--borde)}
.tabla thead tr{border:0}
.tabla th{font-size:10px; text-transform:uppercase; letter-spacing:.1em;
  color:var(--tinta-3); font-weight:700; padding-bottom:10px}
.tabla td.n,.tabla th.n{text-align:right; font-variant-numeric:tabular-nums}
.tabla td b{font-weight:700}
.tabla.contraste td{vertical-align:top; font-size:12.5px}
.tabla .lectura-f{border-top:0}
.tabla .lectura-f td{font-size:12px; color:var(--tinta-2); padding-top:0;
  padding-bottom:15px; line-height:1.55}
.chip{display:inline-flex; align-items:center; font-size:10.5px; font-weight:600;
  letter-spacing:.02em; padding:4px 10px; border-radius:999px;
  background:var(--sup-3); color:var(--tinta-2); white-space:nowrap}
.chip.gris{background:transparent; color:var(--tinta-3);
  box-shadow:inset 0 0 0 1px var(--borde)}
.chip.alerta{background:var(--alerta-suave); color:var(--alerta-tex)}
.chip.pauta{background:var(--falta-suave); color:var(--falta-tex)}
.chip.video,.chip.arte{background:var(--marca-suave); color:var(--marca-2)}

/* ═══ redes ═══ */
.red .mejor{margin-top:4px}
.mejor-f{display:flex; justify-content:space-between; gap:14px; align-items:baseline;
  font-size:12.5px; padding:8px 0; border-top:1px solid var(--borde)}
.mejor-f span{color:var(--tinta-2); min-width:0; overflow:hidden;
  text-overflow:ellipsis; white-space:nowrap}
.mejor-f b{font-variant-numeric:tabular-nums; white-space:nowrap; font-weight:700}
.no-fiable{background:var(--falta-suave); border-radius:var(--r-xs);
  padding:14px 16px; font-size:12.5px; color:var(--falta-tex); line-height:1.55}
.silencio{background:var(--alerta-suave); border-radius:var(--r-xs);
  padding:14px 16px; font-size:13px; color:var(--alerta-tex); line-height:1.55}

/* ═══ marcas de competencia ═══ */
.marca-cab{display:flex; flex-wrap:wrap; gap:10px; align-items:center;
  justify-content:space-between; margin-bottom:16px}
.marca-cab h3{margin-bottom:0; font-size:16px}
.tags{display:flex; gap:6px; flex-wrap:wrap}
/* Los mercados van uno al lado del otro y reparten el ancho a partes iguales.
   Dejarlos crecer con su contenido los hacia caer uno debajo del otro, y el
   punto de la fila es poder comparar GT contra SV de un vistazo. */
.presiones{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px}
.pres{background:var(--sup-2); border-radius:var(--r-xs); padding:12px 14px;
  flex:1 1 110px; min-width:110px}
.pres span{font-size:10px; font-weight:700; letter-spacing:.11em;
  color:var(--tinta-3); display:block; text-transform:uppercase}
.pres b{font-size:23px; font-weight:700; letter-spacing:-.03em; display:block;
  line-height:1.25; font-variant-numeric:tabular-nums; margin:1px 0}
.pres i{font-size:10px; color:var(--tinta-3); font-style:normal; display:block;
  line-height:1.4}
.pres u{font-size:10.5px; color:var(--tinta-3); text-decoration:none; display:block;
  margin-top:3px}
.marca .nota{font-size:12.5px; color:var(--tinta-2); background:var(--sup-2);
  border-radius:var(--r-xs); padding:13px 15px; margin-bottom:16px; line-height:1.6}
.mensajes{margin-bottom:14px}
.msg{border-radius:var(--r-xs); padding:12px 14px; margin-bottom:8px;
  background:var(--sup-2)}
.msg-t{font-size:13px; font-weight:600; margin-bottom:6px; word-break:break-word}
.msg-d{display:flex; flex-wrap:wrap; gap:3px 18px; font-size:11.5px;
  color:var(--tinta-3)}
.msg-d b{color:var(--tinta-2); font-variant-numeric:tabular-nums; font-weight:700}
.adv{font-size:12px; color:var(--falta-tex); margin-top:12px; line-height:1.5}
.ext{display:inline-flex; align-items:center; gap:7px; margin-top:14px;
  font-size:12.5px; font-weight:600; color:var(--marca); text-decoration:none}
.ext:hover{text-decoration:underline}
.ext svg{width:14px; height:14px; fill:none; stroke:currentColor; stroke-width:2;
  stroke-linecap:round; flex:0 0 auto}
.falta-marca{background:var(--sup-2); box-shadow:inset 0 0 0 1px var(--borde)}
.falta-marca p{font-size:13px; margin-bottom:10px}
.badge-falta{display:inline-block; font-size:10px; font-weight:700;
  letter-spacing:.08em; padding:4px 10px; border-radius:999px;
  background:var(--falta-suave); color:var(--falta-tex); margin-bottom:13px}
.remedio{font-size:12.5px; background:var(--bien-suave); border-radius:var(--r-xs);
  padding:12px 15px; color:var(--bien-tex); line-height:1.55}

/* ═══ territorios y búsquedas ═══ */
.terr-et{font-size:10px; font-weight:700; letter-spacing:.11em;
  text-transform:uppercase; margin-bottom:9px}
.terr.ocupado{background:var(--alerta-suave); box-shadow:none}
.terr.libre{background:var(--bien-suave); box-shadow:none}
.terr.ocupado .terr-et{color:var(--alerta-tex)}
.terr.libre .terr-et{color:var(--bien-tex)}
.terr h3{margin-bottom:10px}
.terr p{font-size:13px; margin-bottom:10px}
.busq-cab{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px}
.busq h3{margin-bottom:9px; font-size:15px}
.consulta{font-family:var(--fam-datos); font-size:11.5px; background:var(--sup-2);
  border-radius:var(--r-xs); padding:11px 13px; margin-top:13px;
  word-break:break-word; color:var(--tinta-2); line-height:1.55}

/* ═══ tareas ═══ */
.tarea{background:var(--sup); border-radius:var(--r); padding:22px 24px;
  box-shadow:var(--sombra); display:flex; flex-direction:column; gap:13px}
.tarea.aceptada{box-shadow:var(--sombra), inset 0 0 0 1px var(--bien)}
.tarea.rechazada{opacity:.55}
.tarea-cab{display:flex; gap:6px; flex-wrap:wrap; align-items:center}
.sello{margin-left:auto; font-size:10px; font-weight:700; letter-spacing:.06em;
  padding:4px 11px; border-radius:999px}
.sello.aceptada{background:var(--bien-suave); color:var(--bien-tex)}
.sello.rechazada{background:var(--alerta-suave); color:var(--alerta-tex)}
.tarea h3{font-size:15.5px; line-height:1.4}
.tarea .porque{font-size:13.5px; color:var(--tinta-2); line-height:1.6}
/* Los campos van sin borde: un recuadro por dato convertía la tarjeta en una
   reja. El fondo apenas más claro alcanza para agrupar. */
.campo{background:var(--sup-2); border-radius:var(--r-xs); padding:13px 15px}
.campo p{font-size:12.5px; line-height:1.6; color:var(--tinta-2)}
.campo p b{color:var(--tinta); font-weight:600}
.campo.no-decir{background:var(--alerta-suave)}
.campo.no-decir p{color:var(--alerta-tex)}
.campo.no-decir .mini-et{color:var(--alerta-tex); opacity:.85}
.campo.instruccion{background:var(--falta-suave)}
.campo.instruccion p{color:var(--falta-tex)}
.campo.instruccion .mini-et{color:var(--falta-tex); opacity:.85}
.refs{display:flex; gap:7px; flex-wrap:wrap}
.ref-mini{font-size:11.5px; font-weight:600; color:var(--marca-2);
  background:var(--marca-suave); border-radius:999px; padding:5px 12px;
  text-decoration:none}
.ref-mini:hover{text-decoration:underline}
.tarea-pie{margin-top:auto; padding-top:16px; border-top:1px solid var(--borde);
  display:flex; flex-wrap:wrap; gap:14px; align-items:flex-end;
  justify-content:space-between}
.acciones{display:flex; gap:9px; flex-wrap:wrap}
.asig{min-width:196px; flex:1 1 196px}
.asig select{width:100%; font:inherit; font-size:12.5px; padding:9px 12px;
  border-radius:var(--r-xs); border:1px solid var(--borde);
  background:var(--sup-2); color:var(--tinta)}
.asig select:focus-visible{outline:2px solid var(--marca); outline-offset:1px}
.asig.bloq select{opacity:.5; cursor:not-allowed}
.asig .aclara{margin-top:7px; font-size:11.5px}
.flujo{margin-bottom:22px}
.flujo p{font-size:13px; color:var(--tinta-2)}
.bloqueo{margin-top:16px; background:var(--falta-suave); border-radius:var(--r-xs);
  padding:15px 17px; color:var(--falta-tex)}
.bloqueo p{font-size:12.5px; margin:7px 0 10px; line-height:1.6}
.bloqueo ol{margin:0; padding-left:17px; font-size:12.5px; display:flex;
  flex-direction:column; gap:6px}
.bloqueo ol li::marker{font-weight:700}

/* ═══ desplegables ═══ */
details{border-top:1px solid var(--borde); padding-top:13px}
.campo details{margin-top:11px}
summary{font-size:12px; color:var(--tinta-2); cursor:pointer; font-weight:600;
  list-style:none; display:flex; align-items:center; gap:8px}
summary::-webkit-details-marker{display:none}
summary::before{content:"+"; font-weight:700; color:var(--tinta-3);
  font-size:13px; line-height:1}
details[open] summary::before{content:"−"}
summary:hover{color:var(--tinta)}
summary:focus-visible{outline:2px solid var(--marca); outline-offset:2px}
details .mini{margin-top:12px}

/* ═══ pie ═══ */
.pieP{padding-top:22px; margin-top:40px; border-top:1px solid var(--borde);
  font-size:12px; color:var(--tinta-3); line-height:1.7; max-width:96ch}

/* ═══ aviso flotante ═══ */
.toast{position:fixed; left:50%; bottom:28px; transform:translateX(-50%);
  background:var(--oscuro); color:var(--oscuro-tex); padding:13px 22px;
  border-radius:999px; font-size:13px; font-weight:600;
  box-shadow:var(--sombra-alta); z-index:50; opacity:0; pointer-events:none;
  transition:opacity .2s ease; max-width:90vw; text-align:center}
.toast.ver{opacity:1}
@media (prefers-reduced-motion:reduce){ .toast{transition:none} }

px rgba(0,0,0,.45);\n  --sombra-alta:0 2px 4px rgba(0,0,0,.4), 0 18px 40px -12px rgba(0,0,0,.6);\n}\n\n/* Componentes del tablero. Los COLORES, FUENTES y RADIOS no están aquí:\n   se generan desde config/tema.json (ver src/modulo1/tema.js). Si buscas\n   cambiar el diseño, ese es el archivo.\n\n   Principio de este CSS: **la separación la hace el aire, no la línea.** Casi\n   ningún bloque lleva borde; se distinguen porque son blancos sobre un fondo\n   gris muy claro y porque hay espacio entre ellos. Cada borde que se agregue\n   aquí resta a esa sensación de limpio, así que hay que poder justificarlo:\n   quedan solo los hairlines que separan filas de una tabla y los que marcan un\n   bloque de advertencia. */\n\n*{box-sizing:border-box}\nbody{\n  margin:0; background:var(--ground); color:var(--tinta);\n  font-family:var(--fam-cuerpo);\n  font-size:14.5px; line-height:1.6; -webkit-font-smoothing:antialiased;\n}\nh1,h2,h3,h4{margin:0; text-wrap:balance; letter-spacing:-.021em}\nh1{font-size:24px; font-weight:700}\nh2{font-size:17.5px; font-weight:700}\nh3{font-size:15px; font-weight:700}\np{margin:0}\ncode{font-family:var(--fam-datos); font-size:.86em; background:var(--sup-3);\n  padding:2px 6px; border-radius:6px; color:var(--tinta-2)}\n.mini-et{font-size:10px; font-weight:700; letter-spacing:.1em;\n  text-transform:uppercase; color:var(--tinta-3); display:block; margin-bottom:8px}\n.aclara{font-size:12.5px; color:var(--tinta-2); line-height:1.55}\n.aclara + .aclara{margin-top:9px}\n.aclara b{color:var(--tinta); font-weight:600}\n.sub{color:var(--tinta-2); font-size:13.5px; max-width:84ch; margin-bottom:22px}\n.mini{margin:0; padding-left:16px; display:flex; flex-direction:column; gap:7px;\n  font-size:13px; line-height:1.55}\n.mini li b{font-weight:600; color:var(--tinta)}\n.mini li.ojo{color:var(--falta-tex)}\n.mini li::marker{color:var(--tinta-3)}\n.hueco{background:var(--sup-2); border-radius:var(--r-s); padding:20px 22px;\n  font-size:13px; color:var(--tinta-2)}\n.hueco.chico{padding:13px 15px; font-size:12.5px; line-height:1.55}\n.hueco b{color:var(--tinta); font-weight:600}\n.metodo{font-family:var(--fam-datos); font-size:10.5px; color:var(--tinta-3);\n  margin-top:10px; padding-top:10px; border-top:1px solid var(--borde);\n  line-height:1.6; word-break:break-word}\n\n/* ═══ armazón ═══ */\n.app{display:grid; grid-template-columns:var(--lateral-w) 1fr; min-height:100vh}\n@media (max-width:860px){ .app{grid-template-columns:1fr} }\n\n.lateral{background:var(--lateral); padding:26px 14px; display:flex;\n  flex-direction:column; gap:30px; position:sticky; top:0; height:100vh;\n  overflow-y:auto; border-right:1px solid var(--borde)}\n@media (max-width:860px){\n  .lateral{position:static; height:auto; border-right:0;\n    border-bottom:1px solid var(--borde)}\n}\n.logo{display:flex; align-items:center; gap:11px; padding:0 8px}\n.logo .g{width:32px; height:32px; border-radius:10px; flex:0 0 auto;\n  background:linear-gradient(140deg,var(--marca-fondo),var(--marca-fondo-2));\n  display:grid; place-items:center; font-weight:700; font-size:12px; color:#fff}\n.logo b{font-size:14px; font-weight:700; display:block; line-height:1.25;\n  color:var(--lateral-tex); letter-spacing:-.015em}\n.logo span{font-size:11px; color:var(--lateral-tenue); display:block}\n.nav{display:flex; flex-direction:column; gap:2px; flex:1 1 auto}\n.nav a{display:flex; align-items:center; gap:11px; padding:10px 13px;\n  border-radius:var(--r-xs); color:var(--lateral-tenue); text-decoration:none;\n  font-size:13.5px; font-weight:600; transition:background .15s, color .15s}\n.nav a:hover{background:var(--sup-3); color:var(--lateral-tex)}\n.nav a.on{background:var(--lateral-act); color:var(--lateral-tex); font-weight:700}\n.nav a:focus-visible{outline:2px solid var(--marca); outline-offset:1px}\n.nav a i{width:6px; height:6px; border-radius:50%; background:currentColor;\n  opacity:.3; flex:0 0 auto}\n.nav a.on i{opacity:1; background:var(--marca)}\n.nav a .badge{margin-left:auto; background:var(--marca-fondo); color:#fff;\n  font-size:10px; font-weight:700; padding:2px 7px; border-radius:999px}\n.lateral .pie{font-size:11px; color:var(--tinta-3); line-height:1.55; padding:0 9px}\n.lateral .pie b{color:var(--tinta-2); font-weight:600}\n\n.principal{padding:30px 34px 68px; min-width:0}\n@media (max-width:600px){ .principal{padding:22px 16px 48px} }\n.barra{display:flex; flex-wrap:wrap; gap:16px; align-items:center;\n  justify-content:space-between; margin-bottom:30px}\n.barra .izq h1{line-height:1.2}\n.barra .izq p{color:var(--tinta-2); font-size:13.5px; margin-top:4px}\n.barra .der{display:flex; gap:9px; flex-wrap:wrap}\n.lectura{background:var(--sup); border-radius:var(--r-s); padding:14px 18px;\n  font-size:13px; margin-bottom:18px; box-shadow:var(--sombra)}\n\n.btn{display:inline-flex; align-items:center; gap:8px; border-radius:999px;\n  border:1px solid var(--borde); background:var(--sup); color:var(--tinta);\n  font:inherit; font-size:13px; font-weight:600; padding:9px 17px; cursor:pointer;\n  transition:box-shadow .16s, transform .16s, background .16s, border-color .16s}\n.btn:hover{box-shadow:var(--sombra); border-color:var(--borde-fuerte)}\n.btn:active{transform:translateY(1px)}\n.btn:focus-visible{outline:2px solid var(--marca); outline-offset:2px}\n.btn[disabled]{opacity:.4; cursor:not-allowed; transform:none; box-shadow:none}\n.btn.chico{font-size:12px; padding:8px 14px}\n.btn svg{width:14px; height:14px; fill:none; stroke:currentColor; stroke-width:2;\n  stroke-linecap:round; stroke-linejoin:round; flex:0 0 auto}\n.btn.pri{background:var(--oscuro); border-color:var(--oscuro);\n  color:var(--oscuro-tex)}\n.btn.pri:hover{box-shadow:var(--sombra-alta)}\n.btn.ok.on{background:var(--bien-suave); border-color:var(--bien-suave);\n  color:var(--bien-tex)}\n.btn.no.on{background:var(--alerta-suave); border-color:var(--alerta-suave);\n  color:var(--alerta-tex)}\n\nsection{margin-bottom:44px; scroll-margin-top:20px}\n.cab{display:flex; flex-wrap:wrap; gap:14px; align-items:center;\n  justify-content:space-between; margin-bottom:14px}\n.sub-cab{margin-top:40px}\n.acciones-masa{display:flex; gap:9px; flex-wrap:wrap}\n\n/* ═══ control segmentado ═══ */\n.seg{display:inline-flex; gap:2px; background:var(--sup-3);\n  border-radius:999px; padding:3px}\n.seg-b{border:0; background:transparent; color:var(--tinta-2); font:inherit;\n  font-size:12.5px; font-weight:600; padding:8px 18px; border-radius:999px;\n  cursor:pointer; transition:background .15s, color .15s}\n.seg-b:hover{color:var(--tinta)}\n.seg-b.on{background:var(--sup); color:var(--tinta); font-weight:700;\n  box-shadow:0 1px 3px rgba(20,19,31,.07)}\n.seg-b:focus-visible{outline:2px solid var(--marca); outline-offset:2px}\n.sub-seg{margin-bottom:20px}\n\n/* ═══ tiras de KPI ═══ */\n.tiras{display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:16px}\n@media (max-width:980px){ .tiras{grid-template-columns:1fr} }\n.tira{background:var(--sup); border-radius:var(--r); padding:22px 24px;\n  box-shadow:var(--sombra)}\n.tira-cab{font-size:10px; font-weight:700; letter-spacing:.11em;\n  text-transform:uppercase; color:var(--tinta-3); margin-bottom:18px}\n.kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(124px,1fr));\n  gap:18px 20px}\n.tira .kpis{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}\n.kpis-panel{margin-bottom:4px}\n.kpis.chicos{gap:14px; margin-bottom:16px}\n.kpi{min-width:0}\n.kpi-et{font-size:11.5px; color:var(--tinta-2); display:block; line-height:1.35}\n.kpi-v{font-size:26px; font-weight:700; letter-spacing:-.03em; line-height:1.2;\n  display:block; margin-top:4px; font-variant-numeric:tabular-nums;\n  word-break:break-word}\n.kpi-n{font-size:10.5px; color:var(--tinta-3); display:block; margin-top:5px;\n  line-height:1.45}\n.kpi.tono-falta .kpi-v{font-size:17px; color:var(--falta-tex)}\n.kpis.chicos .kpi-v{font-size:20px}\n\n/* ═══ rejillas y tarjetas de resumen ═══ */\n.grid2{display:grid; grid-template-columns:repeat(auto-fit,minmax(348px,1fr));\n  gap:16px; align-items:start}\n.grid3{display:grid; grid-template-columns:repeat(auto-fit,minmax(278px,1fr));\n  gap:16px; align-items:start}\n.grid3.rcards{align-items:stretch}\n/* Las tres del resumen llevan un tinte decorativo cada una: son tres temas\n   distintos en paralelo, y el color ayuda a distinguirlos de un vistazo. Los\n   tintes vienen de acentos_suaves en tema.json y NO son semánticos. */\n.rcard{border-radius:var(--r); padding:22px 24px; box-shadow:var(--sombra);\n  display:flex; flex-direction:column; gap:11px; background:var(--sup)}\n.rcards .rcard:nth-child(1){background:var(--ac-uno)}\n.rcards .rcard:nth-child(2){background:var(--ac-dos)}\n.rcards .rcard:nth-child(3){background:var(--ac-tres)}\n.rcard-et{font-size:10px; font-weight:700; letter-spacing:.11em;\n  text-transform:uppercase; color:var(--tinta-2)}\n.rcard h3{font-size:16px}\n.rcard p{font-size:13.5px}\n.rcard p b{font-weight:700}\n.rcard .mini{gap:6px; font-size:12.5px}\n.rcard-ir{margin-top:auto; padding-top:8px; font-size:12.5px; font-weight:600;\n  color:var(--tinta); text-decoration:none; opacity:.75}\n.rcard-ir:hover{opacity:1}\n.prog{height:6px; border-radius:4px; overflow:hidden;\n  background:rgba(128,128,140,.26);\n  background:color-mix(in srgb, var(--tinta) 15%, transparent)}\n.prog-b{height:100%; background:var(--tinta); opacity:.62;\n  transition:width .45s cubic-bezier(.2,.7,.3,1)}\n@media (prefers-reduced-motion:reduce){ .prog-b{transition:none} }\n\n/* ═══ paneles ═══ */\n.panel{background:var(--sup); border-radius:var(--r); padding:22px 24px;\n  box-shadow:var(--sombra)}\n.panel h3{margin-bottom:12px}\n.panel.aviso{background:var(--falta-suave); box-shadow:none; margin-top:22px}\n.panel.aviso h3{color:var(--falta-tex)}\n.panel.aviso .mini li b{color:var(--falta-tex)}\n.panel.atenuado{opacity:.78}\n\n/* ═══ tablas ═══ */\n.tabla-wrap{overflow-x:auto; margin:16px 0 10px; border-radius:var(--r);\n  background:var(--sup); box-shadow:var(--sombra); padding:6px 4px}\n.tabla{width:100%; border-collapse:collapse; font-size:13px; min-width:580px}\n.tabla th,.tabla td{text-align:left; padding:13px 20px}\n.tabla tbody tr{border-top:1px solid var(--borde)}\n.tabla thead tr{border:0}\n.tabla th{font-size:10px; text-transform:uppercase; letter-spacing:.1em;\n  color:var(--tinta-3); font-weight:700; padding-bottom:10px}\n.tabla td.n,.tabla th.n{text-align:right; font-variant-numeric:tabular-nums}\n.tabla td b{font-weight:700}\n.tabla.contraste td{vertical-align:top; font-size:12.5px}\n.tabla .lectura-f{border-top:0}\n.tabla .lectura-f td{font-size:12px; color:var(--tinta-2); padding-top:0;\n  padding-bottom:15px; line-height:1.55}\n.chip{display:inline-flex; align-items:center; font-size:10.5px; font-weight:600;\n  letter-spacing:.02em; padding:4px 10px; border-radius:999px;\n  background:var(--sup-3); color:var(--tinta-2); white-space:nowrap}\n.chip.gris{background:transparent; color:var(--tinta-3);\n  box-shadow:inset 0 0 0 1px var(--borde)}\n.chip.alerta{background:var(--alerta-suave); color:var(--alerta-tex)}\n.chip.pauta{background:var(--falta-suave); color:var(--falta-tex)}\n.chip.video,.chip.arte{background:var(--marca-suave); color:var(--marca-2)}\n\n/* ═══ redes ═══ */\n.red .mejor{margin-top:4px}\n.mejor-f{display:flex; justify-content:space-between; gap:14px; align-items:baseline;\n  font-size:12.5px; padding:8px 0; border-top:1px solid var(--borde)}\n.mejor-f span{color:var(--tinta-2); min-width:0; overflow:hidden;\n  text-overflow:ellipsis; white-space:nowrap}\n.mejor-f b{font-variant-numeric:tabular-nums; white-space:nowrap; font-weight:700}\n.no-fiable{background:var(--falta-suave); border-radius:var(--r-xs);\n  padding:14px 16px; font-size:12.5px; color:var(--falta-tex); line-height:1.55}\n.silencio{background:var(--alerta-suave); border-radius:var(--r-xs);\n  padding:14px 16px; font-size:13px; color:var(--alerta-tex); line-height:1.55}\n\n/* ═══ marcas de competencia ═══ */\n.marca-cab{display:flex; flex-wrap:wrap; gap:10px; align-items:center;\n  justify-content:space-between; margin-bottom:16px}\n.marca-cab h3{margin-bottom:0; font-size:16px}\n.tags{display:flex; gap:6px; flex-wrap:wrap}\n/* Los mercados van uno al lado del otro y reparten el ancho a partes iguales.\n   Dejarlos crecer con su contenido los hacia caer uno debajo del otro, y el\n   punto de la fila es poder comparar GT contra SV de un vistazo. */\n.presiones{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px}\n.pres{background:var(--sup-2); border-radius:var(--r-xs); padding:12px 14px;\n  flex:1 1 110px; min-width:110px}\n.pres span{font-size:10px; font-weight:700; letter-spacing:.11em;\n  color:var(--tinta-3); display:block; text-transform:uppercase}\n.pres b{font-size:23px; font-weight:700; letter-spacing:-.03em; display:block;\n  line-height:1.25; font-variant-numeric:tabular-nums; margin:1px 0}\n.pres i{font-size:10px; color:var(--tinta-3); font-style:normal; display:block;\n  line-height:1.4}\n.pres u{font-size:10.5px; color:var(--tinta-3); text-decoration:none; display:block;\n  margin-top:3px}\n.marca .nota{font-size:12.5px; color:var(--tinta-2); background:var(--sup-2);\n  border-radius:var(--r-xs); padding:13px 15px; margin-bottom:16px; line-height:1.6}\n.mensajes{margin-bottom:14px}\n.msg{border-radius:var(--r-xs); padding:12px 14px; margin-bottom:8px;\n  background:var(--sup-2)}\n.msg-t{font-size:13px; font-weight:600; margin-bottom:6px; word-break:break-word}\n.msg-d{display:flex; flex-wrap:wrap; gap:3px 18px; font-size:11.5px;\n  color:var(--tinta-3)}\n.msg-d b{color:var(--tinta-2); font-variant-numeric:tabular-nums; font-weight:700}\n.adv{font-size:12px; color:var(--falta-tex); margin-top:12px; line-height:1.5}\n.ext{display:inline-flex; align-items:center; gap:7px; margin-top:14px;\n  font-size:12.5px; font-weight:600; color:var(--marca); text-decoration:none}\n.ext:hover{text-decoration:underline}\n.ext svg{width:14px; height:14px; n      \"</article>\";\n  }\n\n  function competencia() {\n    var todas = marcas();\n    var comp = todas.filter(function (b) { return b.rol === \"competidor\"; });\n    var refs = todas.filter(function (b) { return b.rol === \"referente\"; });\n    var sm = sinMedir();\n\n    var lista, sub = \"\", explica;\n    if (V.grupo === \"referentes\") {\n      lista = refs;\n      explica = \"Marcas que <b>no disputan</b> nuestros mercados. Se miran para \" +\n        \"aprender, no se cuentan como amenaza.\";\n    } else {\n      var cat = V.categoria;\n      lista = comp.filter(function (b) {\n        return (b.categorias || []).indexOf(cat) >= 0;\n      });\n      sub = segmentado(\"categoria\", [\n        { v: \"software\", n: \"Software\" },\n        { v: \"hardware\", n: \"Punto de venta\" }\n      ], cat);\n      explica = \"Marcas que pautan en nuestros mercados y disputan nuestro espacio \" +\n        \"de mensaje o de público.\";\n    }\n\n    var faltantes = sm.filter(function (x) {\n      return V.grupo === \"referentes\" ? x.rol === \"referente\" : x.rol === \"competidor\";\n    });\n\n    var avisosFalt = faltantes.map(function (x) {\n      return '<article class=\"panel falta-marca\"><h3>' + esc(x.nombre) + \"</h3>\" +\n        '<div class=\"badge-falta\">' + esc(x.estado) + \"</div>\" +\n        \"<p><b>No se midió.</b> Que no aparezca aquí no significa que no anuncie: \" +\n        \"significa que no lo pudimos preguntar.</p>\" +\n        (x.por_que_falta ? '<p class=\"aclara\">' + esc(x.por_que_falta) + \"</p>\" : \"\") +\n        (x.como_obtenerlo ? '<p class=\"remedio\"><b>Cómo desbloquearlo:</b> ' +\n          esc(x.como_obtenerlo) + \"</p>\" : \"\") +\n        \"</article>\";\n    }).join(\"\");\n\n    var cuerpoL = lista.length || avisosFalt\n      ? '<div class=\"grid2\">' + lista.map(tarjetaMarca).join(\"\") + avisosFalt + \"</div>\"\n      : '<div class=\"hueco\">Ninguna marca medida en esta categoría.</div>';\n\n    return '<section id=\"compete
