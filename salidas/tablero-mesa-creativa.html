}

/* Componentes del tablero. Los COLORES, FUENTES y RADIOS no están aquí:
   se generan desde config/tema.json (ver src/modulo1/tema.js). Si buscas
   cambiar el diseño, ese es el archivo.

   Principio de este CSS: **la separación la hace el aire, no la línea.** Casi
   ningún bloque lleva borde; se distinguen porque son blancos sobre un fondo
   gris muy claro y porque hay espacio entre ellos. Cada borde que se agregue
   aquí resta a esa sensación de limpio, así que hay que poder justificarlo:
   quedan solo los hairlines que separan filas de una tabla y los que marcan un
   bloque de advertencia. */

*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--tinta);
  font-family:var(--fam-cuerpo);
  font-size:14.5px; line-height:1.6; -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{margin:0; text-wrap:balance; letter-spacing:-.021em}
h1{font-size:24px; font-weight:700}
h2{font-size:17.5px; font-weight:700}
h3{font-size:15px; font-weight:700}
p{margin:0}
code{font-family:var(--fam-datos); font-size:.86em; background:var(--sup-3);
  padding:2px 6px; border-radius:6px; color:var(--tinta-2)}
.mini-et{font-size:10px; font-weight:700; letter-spacing:.1em;
  text-transform:uppercase; color:var(--tinta-3); display:block; margin-bottom:8px}
.aclara{font-size:12.5px; color:var(--tinta-2); line-height:1.55}
.aclara + .aclara{margin-top:9px}
.aclara b{color:var(--tinta); font-weight:600}
.sub{color:var(--tinta-2); font-size:13.5px; max-width:84ch; margin-bottom:22px}
.mini{margin:0; padding-left:16px; display:flex; flex-direction:column; gap:7px;
  font-size:13px; line-height:1.55}
.mini li b{font-weight:600; color:var(--tinta)}
.mini li.ojo{color:var(--falta-tex)}
.mini li::marker{color:var(--tinta-3)}
.hueco{background:var(--sup-2); border-radius:var(--r-s); padding:20px 22px;
  font-size:13px; color:var(--tinta-2)}
.hueco.chico{padding:13px 15px; font-size:12.5px; line-height:1.55}
.hueco b{color:var(--tinta); font-weight:600}
.metodo{font-family:var(--fam-datos); font-size:10.5px; color:var(--tinta-3);
  margin-top:10px; padding-top:10px; border-top:1px solid var(--borde);
  line-height:1.6; word-break:break-word}

/* ═══ armazón ═══ */
.app{display:grid; grid-template-columns:var(--lateral-w) 1fr; min-height:100vh}
@media (max-width:860px){ .app{grid-template-columns:1fr} }

.lateral{background:var(--lateral); padding:26px 14px; display:flex;
  flex-direction:column; gap:30px; position:sticky; top:0; height:100vh;
  overflow-y:auto; border-right:1px solid var(--borde)}
@media (max-width:860px){
  .lateral{position:static; height:auto; border-right:0;
    border-bottom:1px solid var(--borde)}
}
.logo{display:flex; align-items:center; gap:11px; padding:0 8px}
.logo .g{width:32px; height:32px; border-radius:10px; flex:0 0 auto;
  background:linear-gradient(140deg,var(--marca-fondo),var(--marca-fondo-2));
  display:grid; place-items:center; font-weight:700; font-size:12px; color:#fff}
.logo b{font-size:14px; font-weight:700; display:block; line-height:1.25;
  color:var(--lateral-tex); letter-spacing:-.015em}
.logo span{font-size:11px; color:var(--lateral-tenue); display:block}
.nav{display:flex; flex-direction:column; gap:2px; flex:1 1 auto}
.nav a{display:flex; align-items:center; gap:11px; padding:10px 13px;
  border-radius:var(--r-xs); color:var(--lateral-tenue); text-decoration:none;
  font-size:13.5px; font-weight:600; transition:background .15s, color .15s}
.nav a:hover{background:var(--sup-3); color:var(--lateral-tex)}
.nav a.on{background:var(--lateral-act); color:var(--lateral-tex); font-weight:700}
.nav a:focus-visible{outline:2px solid var(--marca); outline-offset:1px}
.nav a i{width:6px; height:6px; border-radius:50%; background:currentColor;
  opacity:.3; flex:0 0 auto}
.nav a.on i{opacity:1; background:var(--marca)}
.nav a .badge{margin-left:auto; background:var(--marca-fondo); color:#fff;
  font-size:10px; font-weight:700; padding:2px 7px; border-radius:999px}
.lateral .pie{font-size:11px; color:var(--tinta-3); line-height:1.55; padding:0 9px}
.lateral .pie b{color:var(--tinta-2); font-weight:600}

.principal{padding:30px 34px 68px; min-width:0}
@media (max-width:600px){ .principal{padding:22px 16px 48px} }
.barra{display:flex; flex-wrap:wrap; gap:16px; align-items:center;
  justify-content:space-between; margin-bottom:30px}
.barra .izq h1{line-height:1.2}
.barra .izq p{color:var(--tinta-2); font-size:13.5px; margin-top:4px}
.barra .der{display:flex; gap:9px; flex-wrap:wrap}
.lectura{background:var(--sup); border-radius:var(--r-s); padding:14px 18px;
  font-size:13px; margin-bottom:18px; box-shadow:var(--sombra)}

.btn{display:inline-flex; align-items:center; gap:8px; border-radius:999px;
  border:1px solid var(--borde); background:var(--sup); color:var(--tinta);
  font:inherit; font-size:13px; font-weight:600; padding:9px 17px; cursor:pointer;
  transition:box-shadow .16s, transform .16s, background .16s, border-color .16s}
.btn:hover{box-shadow:var(--sombra); border-color:var(--borde-fuerte)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:2px solid var(--marca); outline-offset:2px}
.btn[disabled]{opacity:.4; cursor:not-allowed; transform:none; box-shadow:none}
.btn.chico{font-size:12px; padding:8px 14px}
.btn svg{width:14px; height:14px; fill:none; stroke:currentColor; stroke-width:2;
  stroke-linecap:round; stroke-linejoin:round; flex:0 0 auto}
.btn.pri{background:var(--oscuro); border-color:var(--oscuro);
  color:var(--oscuro-tex)}
.btn.pri:hover{box-shadow:var(--sombra-alta)}
.btn.ok.on{background:var(--bien-suave); border-color:var(--bien-suave);
  color:var(--bien-tex)}
.btn.no.on{background:var(--alerta-suave); border-color:var(--alerta-suave);
  color:var(--alerta-tex)}

section{margin-bottom:44px; scroll-margin-top:20px}
.cab{display:flex; flex-wrap:wrap; gap:14px; align-items:center;
  justify-content:space-between; margin-bottom:14px}
.sub-cab{margin-top:40px}
.acciones-masa{display:flex; gap:9px; flex-wrap:wrap}

/* ═══ control segmentado ═══ */
.seg{display:inline-flex; gap:2px; background:var(--sup-3);
  border-radius:999px; padding:3px}
.seg-b{border:0; background:transparent; color:var(--tinta-2); font:inherit;
  font-size:12.5px; font-weight:600; padding:8px 18px; border-radius:999px;
  cursor:pointer; transition:background .15s, color .15s}
.seg-b:hover{color:var(--tinta)}
.seg-b.on{background:var(--sup); color:var(--tinta); font-weight:700;
  box-shadow:0 1px 3px rgba(20,19,31,.07)}
.seg-b:focus-visible{outline:2px solid var(--marca); outline-offset:2px}
.sub-seg{margin-bottom:20px}

/* ═══ tiras de KPI ═══ */
.tiras{display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:16px}
@media (max-width:980px){ .tiras{grid-template-columns:1fr} }
.tira{background:var(--sup); border-radius:var(--r); padding:22px 24px;
  box-shadow:var(--sombra)}
.tira-cab{font-size:10px; font-weight:700; letter-spacing:.11em;
  text-transform:uppercase; color:var(--tinta-3); margin-bottom:18px}
.kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(124px,1fr));
  gap:18px 20px}
.tira .kpis{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.kpis-panel{margin-bottom:4px}
.kpis.chicos{gap:14px; margin-bottom:16px}
.kpi{min-width:0}
.kpi-et{font-size:11.5px; color:var(--tinta-2); display:block; line-height:1.35}
.kpi-v{font-size:26px; font-weight:700; letter-spacing:-.03em; line-height:1.2;
  display:block; margin-top:4px; font-variant-numeric:tabular-nums;
  word-break:break-word}
.kpi-n{font-size:10.5px; color:var(--tinta-3); display:block; margin-top:5px;
  line-height:1.45}
.kpi.tono-falta .kpi-v{font-size:17px; color:var(--falta-tex)}
.kpis.chicos .kpi-v{font-size:20px}

/* ═══ rejillas y tarjetas de resumen ═══ */
.grid2{display:grid; grid-template-columns:repeat(auto-fit,minmax(348px,1fr));
  gap:16px; align-items:start}
.grid3{display:grid; grid-template-columns:repeat(auto-fit,minmax(278px,1fr));
  gap:16px; align-items:start}
.grid3.rcards{align-items:stretch}
/* Las tres del resumen llevan un tinte decorativo cada una: son tres temas
   distintos en paralelo, y el color ayuda a distinguirlos de un vistazo. Los
   tintes vienen de acentos_suaves en tema.json y NO son semánticos. */
.rcard{border-radius:var(--r); padding:22px 24px; box-shadow:var(--sombra);
  display:flex; flex-direction:column; gap:11px; background:var(--sup)}
.rcards .rcard:nth-child(1){background:var(--ac-uno)}
.rcards .rcard:nth-child(2){background:var(--ac-dos)}
.rcards .rcard:nth-child(3){background:var(--ac-tres)}
.rcard-et{font-size:10px; font-weight:700; letter-spacing:.11em;
  text-transform:uppercase; color:var(--tinta-2)}
.rcard h3{font-size:16px}
.rcard p{font-size:13.5px}
.rcard p b{font-weight:700}
.rcard .mini{gap:6px; font-size:12.5px}
.rcard-ir{margin-top:auto; padding-top:8px; font-size:12.5px; font-weight:600;
  color:var(--tinta); text-decoration:none; opacity:.75}
.rcard-ir:hover{opacity:1}
.prog{height:6px; border-radius:4px; overflow:hidden;
  background:rgba(128,128,140,.26);
  background:color-mix(in srgb, var(--tinta) 15%, transparent)}
.prog-b{height:100%; background:var(--tinta); opacity:.62;
  transition:width .45s cubic-bezier(.2,.7,.3,1)}
@media (prefers-reduced-motion:reduce){ .prog-b{transition:none} }

/* ═══ paneles ═══ */
.panel{background:var(--sup); border-radius:var(--r); padding:22px 24px;
  box-shadow:var(--sombra)}
.panel h3{margin-bottom:12px}
.panel.aviso{background:var(--falta-suave); box-shadow:none; margin-top:22px}
.panel.aviso h3{color:var(--falta-tex)}
.panel.aviso .mini li b{color:var(--falta-tex)}
.panel.atenuado{opacity:.78}

/* ═══ tablas ═══ */
.tabla-wrap{overflow-x:auto; margin:16px 0 10px; border-radius:var(--r);
  background:var(--sup); box-shadow:var(--sombra); padding:6px 4px}
.tabla{width:100%; border-collapse:collapse; font-size:13px; min-width:580px}
.tabla th,.tabla td{text-align:left; padding:13px 20px}
.tabla tbody tr{border-top:1px solid var(--borde)}
.tabla thead tr{border:0}
.tabla th{font-size:10px; text-transform:uppercase; letter-spacing:.1em;
  color:var(--tinta-3); font-weight:700; padding-bottom:10px}
.tabla td.n,.tabla th.n{text-align:right; font-variant-numeric:tabular-nums}
.tabla td b{font-weight:700}
.tabla.contraste td{vertical-align:top; font-size:12.5px}
.tabla .lectura-f{border-top:0}
.tabla .lectura-f td{font-size:12px; color:var(--tinta-2); padding-top:0;
  padding-bottom:15px; line-height:1.55}
.chip{display:inline-flex; align-items:center; font-size:10.5px; font-weight:600;
  letter-spacing:.02em; padding:4px 10px; border-radius:999px;
  background:var(--sup-3); color:var(--tinta-2); white-space:nowrap}
.chip.gris{background:transparent; color:var(--tinta-3);
  box-shadow:inset 0 0 0 1px var(--borde)}
.chip.alerta{background:var(--alerta-suave); color:var(--alerta-tex)}
.chip.pauta{background:var(--falta-suave); color:var(--falta-tex)}
.chip.video,.chip.arte{background:var(--marca-suave); color:var(--marca-2)}

/* ═══ redes ═══ */
.red .mejor{margin-top:4px}
.mejor-f{display:flex; justify-content:space-between; gap:14px; align-items:baseline;
  font-size:12.5px; padding:8px 0; border-top:1px solid var(--borde)}
.mejor-f span{color:var(--tinta-2); min-width:0; overflow:hidden;
  text-overflow:ellipsis; white-space:nowrap}
.mejor-f b{font-variant-numeric:tabular-nums; white-space:nowrap; font-weight:700}
.no-fiable{background:var(--falta-suave); border-radius:var(--r-xs);
  padding:14px 16px; font-size:12.5px; color:var(--falta-tex); line-height:1.55}
.silencio{background:var(--alerta-suave); border-radius:var(--r-xs);
  padding:14px 16px; font-size:13px; color:var(--alerta-tex); line-height:1.55}

/* ═══ marcas de competencia ═══ */
.marca-cab{display:flex; flex-wrap:wrap; gap:10px; align-items:center;
  justify-content:space-between; margin-bottom:16px}
.marca-cab h3{margin-bottom:0; font-size:16px}
.tags{display:flex; gap:6px; flex-wrap:wrap}
/* Los mercados van uno al lado del otro y reparten el ancho a partes iguales.
   Dejarlos crecer con su contenido los hacia caer uno debajo del otro, y el
   punto de la fila es poder comparar GT contra SV de un vistazo. */
.presiones{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px}
.pres{background:var(--sup-2); border-radius:var(--r-xs); padding:12px 14px;
  flex:1 1 110px; min-width:110px}
.pres span{font-size:10px; font-weight:700; letter-spacing:.11em;
  color:var(--tinta-3); display:block; text-transform:uppercase}
.pres b{font-size:23px; font-weight:700; letter-spacing:-.03em; display:block;
  line-height:1.25; font-variant-numeric:tabular-nums; margin:1px 0}
.pres i{font-size:10px; color:var(--tinta-3); font-style:normal; display:block;
  line-height:1.4}
.pres u{font-size:10.5px; color:var(--tinta-3); text-decoration:none; display:block;
  margin-top:3px}
.marca .nota{font-size:12.5px; color:var(--tinta-2); background:var(--sup-2);
  border-radius:var(--r-xs); padding:13px 15px; margin-bottom:16px; line-height:1.6}
.mensajes{margin-bottom:14px}
.msg{border-radius:var(--r-xs); padding:12px 14px; margin-bottom:8px;
  background:var(--sup-2)}
.msg-t{font-size:13px; font-weight:600; margin-bottom:6px; word-break:break-word}
.msg-d{display:flex; flex-wrap:wrap; gap:3px 18px; font-size:11.5px;
  color:var(--tinta-3)}
.msg-d b{color:var(--tinta-2); font-variant-numeric:tabular-nums; font-weight:700}
.adv{font-size:12px; color:var(--falta-tex); margin-top:12px; line-height:1.5}
.ext{display:inline-flex; align-items:center; gap:7px; margin-top:14px;
  font-size:12.5px; font-weight:600; color:var(--marca); text-decoration:none}
.ext:hover{text-decoration:underline}
.ext svg{width:14px; height:14px; fill:none; stroke:currentColor; stroke-width:2;
  stroke-linecap:round; flex:0 0 auto}
.falta-marca{background:var(--sup-2); box-shadow:inset 0 0 0 1px var(--borde)}
.falta-marca p{font-size:13px; margin-bottom:10px}
.badge-falta{display:inline-block; font-size:10px; font-weight:700;
  letter-spacing:.08em; padding:4px 10px; border-radius:999px;
  background:var(--falta-suave); color:var(--falta-tex); margin-bottom:13px}
.remedio{font-size:12.5px; background:var(--bien-suave); border-radius:var(--r-xs);
  padding:12px 15px; color:var(--bien-tex); line-height:1.55}

:grid; grid-template-columns:repeat(auto-fit,minmax(348px,1fr));\n  gap:16px; align-items:start}\n.grid3{display:grid; grid-template-columns:repeat(auto-fit,minmax(278px,1fr));\n  gap:16px; align-items:start}\n.grid3.rcards{align-items:stretch}\n/* Las tres del resumen llevan un tinte decorativo cada una: son tres temas\n   distintos en paralelo, y el color ayuda a distinguirlos de un vistazo. Los\n   tintes vienen de acentos_suaves en tema.json y NO son semánticos. */\n.rcard{border-radius:var(--r); padding:22px 24px; box-shadow:var(--sombra);\n  display:flex; flex-direction:column; gap:11px; background:var(--sup)}\n.rcards .rcard:nth-child(1){background:var(--ac-uno)}\n.rcards .rcard:nth-child(2){background:var(--ac-dos)}\n.rcards .rcard:nth-child(3){background:var(--ac-tres)}\n.rcard-et{font-size:10px; font-weight:700; letter-spacing:.11em;\n  text-transform:uppercase; color:var(--tinta-2)}\n.rcard h3{font-size:16px}\n.rcard p{font-size:13.5px}\n.rcard p b{font-weight:700}\n.rcard .mini{gap:6px; font-size:12.5px}\n.rcard-ir{margin-top:auto; padding-top:8px; font-size:12.5px; font-weight:600;\n  color:var(--tinta); text-decoration:none; opacity:.75}\n.rcard-ir:hover{opacity:1}\n.prog{height:6px; border-radius:4px; overflow:hidden;\n  background:rgba(128,128,140,.26);\n  background:color-mix(in srgb, var(--tinta) 15%, transparent)}\n.prog-b{height:100%; background:var(--tinta); opacity:.62;\n  transition:width .45s cubic-bezier(.2,.7,.3,1)}\n@media (prefers-reduced-motion:reduce){ .prog-b{transition:none} }\n\n/* ═══ paneles ═══ */\n.panel{background:var(--sup); border-radius:var(--r); padding:22px 24px;\n  box-shadow:var(--sombra)}\n.panel h3{margin-bottom:12px}\n.panel.aviso{background:var(--falta-suave); box-shadow:none; margin-top:22px}\n.panel.aviso h3{color:var(--falta-tex)}\n.panel.aviso .mini li b{color:var(--falta-tex)}\n.panel.atenuado{opacity:.78}\n\n/* ═══ tablas ═══ */\n.tabla-wrap{overflow-x:auto; margin:16px 0 10px; border-radius:var(--r);\n  background:var(--sup); box-shadow:var(--sombra); padding:6px 4px}\n.tabla{width:100%; border-collapse:collapse; font-size:13px; min-width:580px}\n.tabla th,.tabla td{text-align:left; padding:13px 20px}\n.tabla tbody tr{border-top:1px solid var(--borde)}\n.tabla thead tr{border:0}\n.tabla th{font-size:10px; text-transform:uppercase; letter-spacing:.1em;\n  color:var(--tinta-3); font-weight:700; padding-bottom:10px}\n.tabla td.n,.tabla th.n{text-align:right; font-variant-numeric:tabular-nums}\n.tabla td b{font-weight:700}\n.tabla.contraste td{vertical-align:top; font-size:12.5px}\n.tabla .lectura-f{border-top:0}\n.tabla .lectura-f td{font-size:12px; color:var(--tinta-2); padding-top:0;\n  padding-bottom:15px; line-height:1.55}\n.chip{display:inline-flex; align-items:center; font-size:10.5px; font-weight:600;\n  letter-spacing:.02em; padding:4px 10px; border-radius:999px;\n  background:var(--sup-3); color:var(--tinta-2); white-space:nowrap}\n.chip.gris{background:transparent; color:var(--tinta-3);\n  box-shadow:inset 0 0 0 1px var(--borde)}\n.chip.alerta{background:var(--alerta-suave); color:var(--alerta-tex)}\n.chip.pauta{background:var(--falta-suave); color:var(--falta-tex)}\n.chip.video,.chip.arte{background:var(--marca-suave); color:var(--marca-2)}\n\n/* ═══ redes ═══ */\n.red .mejor{margin-top:4px}\n.mejor-f{display:flex; justify-content:space-between; gap:14px; align-items:baseline;\n  font-size:12.5px; padding:8px 0; border-top:1px solid var(--borde)}\n.mejor-f span{color:var(--tinta-2); min-width:0; overflow:hidden;\n  text-overflow:ellipsis; white-space:nowrap}\n.mejor-f b{font-variant-numeric:tabular-nums; white-space:nowrap; font-weight:700}\n.no-fiable{background:var(--falta-suave); border-radius:var(--r-xs);\n  padding:14px 16px; font-size:12.5px; color:var(--falta-tex); line-height:1.55}\n.silencio{background:var(--alerta-suave); border-radius:var(--r-xs);\n  padding:14px 16px; font-size:13px; color:var(--alerta-tex); line-height:1.55}\n\n/* ═══ marcas de competencia ═══ */\n.marca-cab{display:flex; flex-wrap:wrap; gap:10px; align-items:center;\n  justify-content:space-between; margin-bottom:16px}\n.marca-cab h3{margin-bottom:0; font-size:16px}\n.tags{display:flex; gap:6px; flex-wrap:wrap}\n/* Los mercados van uno al lado del otro y reparten el ancho a partes iguales.\n   Dejarlos crecer con su contenido los hacia caer uno debajo del otro, y el\n   punto de la fila es poder comparar GT contra SV de un vistazo. */\n.presiones{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px}\n.pres{background:var(--sup-2); border-radius:var(--r-xs); padding:12px 14px;\n  flex:1 1 110px; min-width:110px}\n.pres span{font-size:10px; font-weight:700; letter-spacing:.11em;\n  color:var(--tinta-3); display:block; text-transform:uppercase}\n.pres b{font-size:23px; font-weight:700; letter-spacing:-.03em; display:block;\n  line-height:1.25; font-variant-numeric:tabular-nums; margin:1px 0}\n.pres i{font-size:10px; color:var(--tinta-3); font-style:normal; display:block;\n  line-height:1.4}\n.pres u{font-size:10.5px; color:var(--tinta-3); text-decoration:none; display:block;\n  margin-top:3px}\n.marca .nota{font-size:12.5px; color:var(--tinta-2); background:var(--sup-2);\n  border-radius:var(--r-xs); padding:13px 15px; margin-bottom:16px; line-height:1.6}\n.mensajes{margin-bottom:14px}\n.msg{border-radius:var(--r-xs); padding:12px 14px; margin-bottom:8px;\n  background:var(--sup-2)}\n.msg-t{font-size:13px; font-weight:600; margin-bottom:6px; word-break:break-word}\n.msg-d{display:flex; flex-wrap:wrap; gap:3px 18px; font-size:11.5px;\n  color:var(--tinta-3)}\n.msg-d b{color:var(--tinta-2); font-variant-numeric:tabular-nums; font-weight:700}\n.adv{font-size:12px; color:var(--falta-tex); margin-top:12px; line-height:1.5}\n.ext{display:inline-flex; align-items:center; gap:7px; margin-top:14px;\n  font-size:12.5px; font-weight:600; color:var(--marca); text-decoration:none}\n.ext:hover{text-decoration:underline}\n.ext svg{width:14px; height:14px; fill:none; stroke:currentColor; stroke-width:2;\n  stroke-linecap:round; flex:0 0 auto}\n.falta-marca{background:var(--sup-2); box-shadow:inset 0 0 0 1px var(--borde)}\n.falta-marca p{font-size:13px; margin-bottom:10px}\n.badge-falta{display:inline-block; font-size:10px; font-weight:700;\n  letter-spacing:.08em; padding:4px 10px; border-radius:999px;\n  background:var(--falta-suave); color:var(--falta-tex); margin-bottom:13px}\n.remedio{font-size:12.5px; background:var(--bien-suave); border-radius:var(--r-xs);\n  padding:12px 15px; color:var(--bien-tex); line-height:1.55}\n\n/* ═══ territorios y búsquedas ═══ */\n.terr-et{font-size:10px; font-weight:700; letter-spacing:.11em;\n  text-transform:uppercase; margin-bottom:9px}\n.terr.ocupado{background:var(--alerta-suave); box-shadow:none}\n.terr.libre{background:var(--bien-suave); box-shadow:none}\n.terr.ocupado .terr-et{color:var(--alerta-tex)}\n.terr.libre .terr-et{color:var(--bien-tex)}\n.terr h3{margin-bottom:10px}\n.terr p{font-size:13px; margin-bottom:10px}\n.busq-cab{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px}\n.busq h3{margin-bottom:9px; font-size:15px}\n.consulta{font-family:var(--fam-datos); font-size:11.5px; background:var(--sup-2);\n  border-radius:var(--r-xs); padding:11px 13px; margin-top:13px;\n  word-break:break-word; color:var(--tinta-2); line-height:1.55}\n\n/* ═══ tareas ═══ */\n.tarea{background:var(--sup); border-radius:var(--r); padding:22px 24px;\n  box-shadow:var(--sombra); display:flex; flex-direction:column; gap:13px}\n.tarea.aceptada{box-shadow:var(--sombra), inset 0 0 0 1px var(--bien)}\n.tarea.rechazada{opacity:.55}\n.tarea-cab{display:flex; gap:6px; flex-wrap:wrap; align-items:center}\n.sello{margin-left:auto; font-size:10px; font-weight:700; letter-spacing:.06em;\n  padding:4px 11px; border-radius:999px}\n.sello.aceptada{background:var(--bien-suave); color:var(--bien-tex)}\n.sello.rechazada{background:var(--alerta-suave); color:var(--alerta-tex)}\n.tarea h3{font-size:15.5px e) + \"</b> ocupa «\" + esc(s.mensaje) +\n        \"» en \" + pct(s.cuota) + \" de sus anuncios en \" + esc(s.mercado) + \".</li>\");\n    });\n    (terr.libres || []).forEach(function (l) {\n      comp.push(\"<li><b>\" + esc(l.mercado) +\n        \"</b> no tiene competencia medida en pauta.</li>\");\n    });\n    var sm = sinMedir();\n    if (sm.length) {\n      comp.push('<li class=\"ojo\">' + sm.map(function (x) { return esc(x.nombre); })\n        .join(\", \") + (sm.length === 1 ? \" no se midió\" : \" no se midieron\") +\n        \": falta su page_id.</li>\");\n    }\n    var c2 = '<ul class=\"mini\">' + (comp.join(\"\") ||\n      \"<li>Sin patrones de competencia en esta corrida.</li>\") + \"</ul>\";\n\n    var est = D.estrategia || {}, ts = est.tareas || [];\n    var act = estrategiaActiva();\n    var vis = ts.filter(function (t) {\n      return t.siempre || !act || (t.estrategias || []).indexOf(act.id) >= 0;\n    });\n    var cre = vis.filter(function (t) { return t.tipo !== \"pauta\"; }).length;\n    var pau = vis.length - cre;\n    var dec = vis.filter(function (t) { return E.decisiones[t.id]; }).length;\n    var propias = Object.keys(E.propias).length;\n    var c3 = (act\n        ? \"<p><b>\" + esc(act.nombre) + \".</b> \" + esc(act.en_pocas_palabras) + \"</p>\"\n        : \"<p>El análisis no encontró una estrategia sostenida por los datos de \" +\n          \"esta corrida.</p>\") +\n      \"<p>Activa <b>\" + vis.length + (vis.length === 1 ? \" tarea\" : \" tareas\") +\n      \"</b>: \" + cre + \" de producción y \" + pau + \" de pauta\" +\n      (propias ? \", más \" + propias + \" idea\" + (propias === 1 ? \"\" : \"s\") +\n        \" del equipo\" : \"\") + \".</p>\" +\n      '<div class=\"prog\"><div class=\"prog-b\" style=\"width:' +\n      (vis.length ? Math.round(dec / vis.length * 100) : 0) + '%\"></div></div>' +\n      '<p class=\"aclara\">' + dec + \" de \" + vis.length +\n      \" ya tienen decisión de la mesa.</p>\";\n\n    return '<section id=\"resumen\">' + tiras() +\n      '<div class=\"grid3 rcards\">' +\n      tarjetaResumen(\"Rendimiento propio\", \"Meta Ads y leads\", c1, \"rendimiento\") +\n      tarjetaResumen(\"Qué hace la competencia\", \"Ad Library\", c2, \"competencia\") +\n      tarjetaResumen(\"La estrategia que se propone\", \"Para decidir\", c3, \"estrategia\") +\n      \"</div></section>\";\n  }\n\n  /* ═════════════ 2 · Rendimiento ═════════════ */\n\n  function segmentado(id, opciones, activo) {\n    return '<div class=\"seg\" role=\"tablist\">' + opciones.map(function (o) {\n      return '<button type=\"button\" role=\"tab\" class=\"seg-b' +\n        (o.v === activo ? \" on\" : \"\") + '\" data-' + id + '=\"' + esc(o.v) +\n        '\" aria-selected=\"' + (o.v === activo) + '\">' + esc(o.n) + \"</button>\";\n    }).join(\"\") + \"</div>\";\n  }\n\n  function tablaCampanas(m) {\n    var d = (D.por_mercado || {})[m] || {};\n    var cs = d.campanas || [];\n    if (!cs.length) return '<div class=\"hueco\">Sin campañas con entrega en ' +\n      esc(m) + \" en este periodo.</div>\";\n    return '<div class=\"tabla-wrap\"><table class=\"tabla\"><thead><tr>' +\n      \"<th>Campaña</th><th>Se mide por</th><th class=\\\"n\\\">Resultados</th>\" +\n      \"<th class=\\\"n\\\">Inversión</th><th class=\\\"n\\\">Costo por resultado</th>\" +\n      \"<th class=\\\"n\\\">Impresiones</th></tr></thead><tbody>\" +\n      cs.map(function (c) {\n        return \"<tr><td>\" + esc(c.etiqueta) + \"</td>\" +\n          '<td><span class=\"chip\">' + esc(enClaro(c.indicador)) + \"</span></td>\" +\n          '<td class=\"n\">' + ent(c.resultados) + \"</td>\" +\n          '<td class=\"n\">' + dinero(c.gasto) + \"</td>\" +\n          '<td class=\"n\"><b>' + dinero(c.costo_por_resultado) + \"</b></td>\" +\n          '<td class=\"n\">' + ent(c.impresiones) + \"</td></tr>\";\n      }).join(\"\") + \"</tbody></table></div>\" +\n      '<p class=\"aclara\">Las campañas se muestran juntas pero <b>no se suman entre ' +\n      \"indicadores distintos</b>: 105 leads y 10,771 clics no son la misma cosa. \" +\n      \"El total de arriba es solo del indicador principal.</p>\";\n  }\n\n  function bloqueRedes() {\n    var rs = D.redes_sociales;\n    if (!rs) return '<div class=\"hueco\">No hay captura de redes para este periodo.</div>';\n    var det = rs.detalle || {};\n    var tarjetas = Object.keys(det).sort().map(function (n) {\n      var r = det[n];\n      var cuerpo;\n      if (!r.confiable) {\n        cuerpo = '<div class=\"no-fiable\"><b>Dato no verificable.</b> ' +\n          esc(r.motivo_no_confiable) + \"</div>\";\n      } else if (r.silenciosa) {\n        cuerpo = '<div class=\"silencio\"><b>' + r.dias_de_silencio +\n          \" días sin publicar.</b><br>Última publicación: \" +\n          esc(r.ultima_publicacion) + \"</div>\";\n      } else {\n        cuerpo = '<div class=\"kpis chicos\">' +\n          kpi(\"Publicaciones\", ent(r.publicaciones), \"\") +\n          kpi(\"Interacciones\", ent(r.interacciones), \"\") +\n          (r.vistas != null ? kpi(\"Vistas\", ent(r.vistas), \"\") : \"\") + \"</div>\" +\n          (r.mejores && r.mejores.length\n            ? '<div class=\"mejor\"><span class=\"mini-et\">Lo que más rindió</span>' +\n              r.mejores.map(function (m) {\n                var marca = m.vistas != null ? ent(m.vistas) + \" vistas\"\n                  : ent(m.interacciones) + \" interacciones\";\n                return '<div class=\"mejor-f\"><span>' +\n                  esc(m.titulo || \"(sin texto)\") + '</span><b>' + marca + \"</b></div>\";\n              }).join(\"\") + \"</div>\"\n            : \"\");\n      }\n      return '<article class=\"panel red' + (r.confiable ? \"\" : \" atenuado\") + '\">' +\n        \"<h3>\" + esc(RED[n] || n) + \"</h3>\" + cuerpo + \"</article>\";\n    }).join(\"\");\n\n    var lims = (rs.limites || []).map(function (l) {\n      return \"<li><b>\" + esc(l.que) + \" · \" + esc(l.estado) + \".</b> \" +\n        esc(l.detalle) + \"</li>\";\n    }).join(\"\");\n\n    return '<div class=\"grid3\">' + tarjetas + \"</div>\" +\n      '<div class=\"panel aviso\"><h3>Lo que este bloque no puede decir</h3>' +\n      '<ul class=\"mini\">' + lims + \"</ul></div>\";\n  }\n\n  function rendimiento() {\n    var m = mercadoActivo();\n    var ms = mercados();\n    if (!m) return '<section id=\"rendimiento\"><div class=\"cab\"><h2>Rendimiento</h2>' +\n      '</div><div class=\"hueco\">Sin datos por mercado en esta corrida.</div></section>';\n    var d = (D.por_mercado || {})[m] || {};\n    var p = d.principal;\n    var kpis = p\n      ? '<div class=\"panel kpis-panel\"><div class=\"kpis\">' +\n        kpi(\"Leads\", ent(p.resultados), enClaro(d.indicador_principal)) +\n        kpi(\"Inversión\", dinero(p.gasto), \"\") +\n        kpi(\"Costo por lead\", dinero(p.costo_por_resultado), \"\") +\n        kpi(\"Campañas con entrega\", ent(p.campanas), \"no es lo mismo que activas hoy\") +\n        kpi(\"Impresiones\", ent(p.impresiones), \"\") + \"</div></div>\"\n      : '<div class=\"hueco\">Sin datos utilizables de ' +\n        esc(enClaro(d.indicador_principal)) + \" en \" + esc(m) + \".</div>\";\n\n    return '<section id=\"rendimiento\"><div class=\"cab\"><h2>Rendimiento</h2>' +\n      segmentado(\"mercado\", ms.map(function (x) {\n        return { v: x, n: x === \"GT\" ? \"Guatemala\" : x === \"SV\" ? \"El Salvador\" : x };\n      }), m) + \"</div>\" +\n      '<p class=\"sub\">Pauta de Meta Ads en <b>' + esc(m) + \"</b>, del periodo \" +\n      esc((D.corrida || {}).rango || \"\") + \".</p>\" +\n      kpis + tablaCampanas(m) +\n      '<p class=\"aclara\">' + esc(d._nota_activas || \"\") + \"</p>\" +\n      '<div class=\"cab sub-cab\"><h2>Redes sociales</h2></div>' +\n      '<p class=\"sub\">Orgánico de las cuentas reportadas. <b>No hay corte por ' +\n      \"país</b>: el portal tiene una sola marca y GT y SV comparten cuenta, así que \" +\n      \"repartir estas interacciones entre los dos mercados sería inventarlo.</p>\" +\n      bloqueGraficas() + bloqueRedes() + \"</section>\";\n  }\n\n\n  /* ═════════════ gráficas ═════════════ */\n\n  /* Un gráfico de líneas en SVG, sin librería. Decisiones que no son de gusto:\n\n     - **Dos medidas, dos gráficos.** Interacciones y vistas tienen escalas\n       distintas (34 contra 184). Meterlas en un eje doble haría que el lector\n       compare alturas que no son comparables, y es el error más común de este\n       tipo de gráfico. Van separadas.\n     - **Un hueco no es un cero.** Donde la serie vale null la línea se corta.\n       Las semanas anteriores a la muestra de cada red no son semanas sin\n       interacción: son semanas que no leímos.\n     - **El texto nunca lleva el color de la serie.** La identidad la da el punto\n       de color al lado, no el color de la letra: un verde o un ámbar claro no se\n       leen como texto.\n     - **Se etiqueta una sola línea al final.** Tres etiquetas al borde derecho\n       se pisan cuando las series convergen, y separarlas a mano las despega de\n       su línea. Se rotula la más alta; la leyenda y el tooltip cargan el resto. */\n\n  var GEO = { w: 520, h: 236, iz: 44, de: 58, ar: 16, ab: 34 };\n\n  function escalaLinda(max) {\n    if (!(max > 0)) return { max: 1, pasos: [0, 1] };\n    var mag = Math.pow(10, Math.floor(Math.log10(max)));\n    var paso = mag / 2;\n    while (max / paso > 5) paso *= 2;\n    var tope = Math.ceil(max / paso) * paso;\n    var pasos = [];\n    for (var v = 0; v <= tope + 1e-9; v += paso) pasos.push(v);\n    return { max: tope, pasos: pasos };\n  }\n\n  function grafico(id, cfg) {\n    var S = cfg.series.filter(function (s) {\n      return s.valores.some(function (v) { return v != null; });\n    });\n    if (!S.length || !cfg.semanas.length) {\n      return '<div class=\"hueco chico\">Sin serie para graficar en este periodo.</div>';\n    }\n    var G = GEO;\n    var n = cfg.semanas.length;\n    var pico = 0;\n    S.forEach(function (s) {\n      s.valores.forEach(function (v) { if (v != null && v > pico) pico = v; });\n    });\n    var esc = escalaLinda(pico);\n    var px = function (i) {\n      return G.iz + (n === 1 ? 0 : i * (G.w - G.iz - G.de) / (n - 1));\n    };\n    var py = function (v) {\n      return G.ar + (1 - v / esc.max) * (G.h - G.ar - G.ab);\n    };\n\n    var partes = [];\n\n    // Rejilla: hairline sólida, recesiva, con su tick redondo a la izquierda.\n    esc.pasos.forEach(function (v) {\n      var y = py(v);\n      partes.push('<line class=\"g-rej\" x1=\"' + G.iz + '\" y1=\"' + y.toFixed(1) +\n        '\" x2=\"' + (G.w - G.de) + '\" y2=\"' + y.toFixed(1) + '\"/>');\n      partes.push('<text class=\"g-tick\" x=\"' + (G.iz - 9) + '\" y=\"' +\n        (y + 3.5).toFixed(1) + '\" text-anchor=\"end\">' + ent(v) + \"</text>\");\n    });\n\n    // Eje de semanas: una etiqueta cada dos para que no se amontonen.\n    cfg.semanas.forEach(function (w, i) {\n      if (i % 2 !== (n - 1) % 2) return;\n      partes.push('<text class=\"g-tick\" x=\"' + px(i).toFixed(1) + '\" y=\"' +\n        (G.h - 14) + '\" text-anchor=\"middle\">' + esc2(w.etiqueta) + \"</text>\");\n    });\n\n    // Cada serie: tramos continuos, relleno opcional, y un punto por dato.\n    S.forEach(function (s, si) {\n      var tramos = [], actual = [];\n      s.valores.forEach(function (v, i) {\n        if (v == null) { if (actual.length) { tramos.push(actual); actual = []; } return; }\n        actual.push([px(i), py(v)]);\n      });\n      if (actual.length) tramos.push(actual);\n\n      tramos.forEach(function (t) {\n        var d = t.map(function (p, k) {\n          return (k ? \"L\" : \"M\") + p[0].toFixed(1) + \" \" + p[1].toFixed(1);\n        }).join(\" \");\n        if (cfg.area && t.length > 1) {\n          var base = py(0).toFixed(1);\n          partes.push('<path class=\"g-area\" d=\"' + d + \" L\" +\n            t[t.length - 1][0].toFixed(1) + \" \" + base + \" L\" +\n            t[0][0].toFixed(1) + \" \" + base + ' Z\" fill=\"' + s.color + '\"/>');\n        }\n        partes.push('<path class=\"g-linea\" d=\"' + d + '\" stroke=\"' + s.color + '\"/>');\n        if (t.length === 1) {\n          partes.push('<circle class=\"g-pto\" cx=\"' + t[0][0].toFixed(1) + '\" cy=\"' +\n            t[0][1].toFixed(1) + '\" r=\"4\" fill=\"' + s.color + '\"/>');\n        }\n      });\n      s.valores.forEach(function (v, i) {\n        if (v == null) return;\n        partes.push('<circle class=\"g-pto\" data-s=\"' + si + '\" data-i=\"' + i +\n          '\" cx=\"' + px(i).toFixed(1) + '\" cy=\"' + py(v).toFixed(1) +\n          '\" r=\"4\" fill=\"' + s.color + '\"/>');\n      });\n    });\n\n    // Una sola etiqueta directa: la serie que termina más arriba.\n    var alta = null;\n    S.forEach(function (s) {\n      for (var i = s.valores.length - 1; i >= 0; i--) {\n        if (s.valores[i] == null) continue;\n        if (!alta || s.valores[i] > alta.v) alta = { s: s, v: s.valores[i], i: i };\n        break;\n      }\n    });\n    if (alta) {\n      partes.push('<text class=\"g-fin\" x=\"' + (px(alta.i) + 9).toFixed(1) +\n        '\" y=\"' + (py(alta.v) + 4).toFixed(1) + '\">' + ent(alta.v) + \"</text>\");\n    }\n\n    // Cruz y zona de captura del puntero.\n    partes.push('<line class=\"g-cruz\" id=\"' + id + '-cruz\" x1=\"0\" y1=\"' + G.ar +\n      '\" x2=\"0\" y2=\"' + (G.h - G.ab) + '\" style=\"opacity:0\"/>');\n    partes.push('<rect id=\"' + id + '-caza\" x=\"' + G.iz + '\" y=\"' + G.ar +\n      '\" width=\"' + (G.w - G.iz - G.de) + '\" height=\"' + (G.h - G.ar - G.ab) +\n      '\" fill=\"transparent\" style=\"cursor:crosshair\"/>');\n\n    var leyenda = S.length > 1\n      ? '<div class=\"g-ley\">' + S.map(function (s) {\n          return '<span><i style=\"background:' + s.color + '\"></i>' +\n            esc2(s.nombre) + \"</span>\";\n        }).join(\"\") + \"</div>\"\n      : \"\";\n\n    var tabla = '<details class=\"g-tabla\"><summary>Ver la tabla</summary>' +\n      '<div class=\"tabla-wrap\"><table class=\"tabla\"><thead><tr><th>Semana</th>' +\n      S.map(function (s) { return '<th class=\"n\">' + esc2(s.nombre) + \"</th>\"; }).join(\"\") +\n      \"</tr></thead><tbody>\" +\n      cfg.semanas.map(function (w, i) {\n        return \"<tr><td>\" + esc2(w.etiqueta) + \"</td>\" + S.map(function (s) {\n          var v = s.valores[i];\n          return '<td class=\"n\">' + (v == null ? \"—\" : ent(v)) + \"</td>\";\n        }).join(\"\") + \"</tr>\";\n      }).join(\"\") + \"</tbody></table></div></details>\";\n\n    return '<div class=\"graf\" id=\"' + id + '\" data-graf=\\'' +\n      esc2(JSON.stringify({\n        semanas: cfg.semanas.map(function (w) { return w.etiqueta; }),\n        series: S.map(function (s) {\n          return { n: s.nombre, v: s.valores, c: s.color };\n        }),\n        unidad: cfg.unidad, geo: G, max: esc.max\n      })) + \"'>\" +\n      '<div class=\"graf-cab\"><h4>' + esc2(cfg.titulo) + \"</h4>\" +\n        (cfg.subtitulo ? \"<p>\" + esc2(cfg.subtitulo) + \"</p>\" : \"\") + \"</div>\" +\n      leyenda +\n      '<div class=\"graf-lienzo\"><svg viewBox=\"0 0 ' + G.w + \" \" + G.h +\n        '\" role=\"img\" aria-label=\"' + esc2(cfg.titulo) + '\">' + partes.join(\"\") +\n        \"</svg><div class=\\\"g-tip\\\" id=\\\"\" + id + \"-tip\\\"></div></div>\" +\n      tabla + \"</div>\";\n  }\n\n  function bloqueGraficas() {\n    var rs = D.redes_sociales, se = (rs && rs.serie_semanal) || null;\n    if (!se || !se.semanas || !se.semanas.length) return \"\";\n    var COL = [\"var(--c1)\", \"var(--c2)\", \"var(--c3)\"];\n    var orden = [\"facebook\", \"instagram\", \"youtube\"];\n    var serInt = orden.filter(function (r) { return se.interacciones[r]; })\n      .map(function (r, i) {\n        return { nombre: RED[r] || r, valores: se.interacciones[r], color: COL[i] };\n      });\n    var serVis = orden.filter(function (r) { return se.vistas[r]; })\n      .map(function (r, i) {\n        return { nombre: RED[r] || r, valores: se.vistas[r], co       });
    });

  /* ═════════════ gráficas ═════════════ */

  /* Un gráfico de líneas en SVG, sin librería. Decisiones que no son de gusto:

     - **Dos medidas, dos gráficos.** Interacciones y vistas tienen escalas
       distintas (34 contra 184). Meterlas en un eje doble haría que el lector
       compare alturas que no son comparables, y es el error más común de este
       tipo de gráfico. Van separadas.
     - **Un hueco no es un cero.** Donde la serie vale null la línea se corta.
       Las semanas anteriores a la muestra de cada red no son semanas sin
       interacción: son semanas que no leímos.
     - **El texto nunca lleva el color de la serie.** La identidad la da el punto
       de color al lado, no el color de la letra: un verde o un ámbar claro no se
       leen como texto.
     - **Se etiqueta una sola línea al final.** Tres etiquetas al borde derecho
       se pisan cuando las series convergen, y separarlas a mano las despega de
       su línea. Se rotula la más alta; la leyenda y el tooltip cargan el resto. */

  var GEO = { w: 520, h: 236, iz: 44, de: 58, ar: 16, ab: 34 };

  function escalaLinda(max) {
    if (!(max > 0)) return { max: 1, pasos: [0, 1] };
    var mag = Math.pow(10, Math.floor(Math.log10(max)));
    var paso = mag / 2;
    while (max / paso > 5) paso *= 2;
    var tope = Math.ceil(max / paso) * paso;
    var pasos = [];
    for (var v = 0; v <= tope + 1e-9; v += paso) pasos.push(v);
    return { max: tope, pasos: pasos };
  }

  function grafico(id, cfg) {
    var S = cfg.series.filter(function (s) {
      return s.valores.some(function (v) { return v != null; });
    });
    if (!S.length || !cfg.semanas.length) {
      return '<div class="hueco chico">Sin serie para graficar en este periodo.</div>';
    }
    var G = GEO;
    var n = cfg.semanas.length;
    var pico = 0;
    S.forEach(function (s) {
      s.valores.forEach(function (v) { if (v != null && v > pico) pico = v; });
    });
    var esc = escalaLinda(pico);
    var px = function (i) {
      return G.iz + (n === 1 ? 0 : i * (G.w - G.iz - G.de) / (n - 1));
    };
    var py = function (v) {
      return G.ar + (1 - v / esc.max) * (G.h - G.ar - G.ab);
    };

    var partes = [];

    // Rejilla: hairline sólida, recesiva, con su tick redondo a la izquierda.
    esc.pasos.forEach(function (v) {
      var y = py(v);
      partes.push('<line class="g-rej" x1="' + G.iz + '" y1="' + y.toFixed(1) +
        '" x2="' + (G.w - G.de) + '" y2="' + y.toFixed(1) + '"/>');
      partes.push('<text class="g-tick" x="' + (G.iz - 9) + '" y="' +
        (y + 3.5).toFixed(1) + '" text-anchor="end">' + ent(v) + "</text>");
    });

    // Eje de semanas: una etiqueta cada dos para que no se amontonen.
    cfg.semanas.forEach(function (w, i) {
      if (i % 2 !== (n - 1) % 2) return;
      partes.push('<text class="g-tick" x="' + px(i).toFixed(1) + '" y="' +
        (G.h - 14) + '" text-anchor="middle">' + esc2(w.etiqueta) + "</text>");
    });

    // Cada serie: tramos continuos, relleno opcional, y un punto por dato.
    S.forEach(function (s, si) {
      var tramos = [], actual = [];
      s.valores.forEach(function (v, i) {
        if (v == null) { if (actual.length) { tramos.push(actual); actual = []; } return; }
        actual.push([px(i), py(v)]);
      });
      if (actual.length) tramos.push(actual);

      tramos.forEach(function (t) {
        var d = t.map(function (p, k) {
          return (k ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1);
        }).join(" ");
        if (cfg.area && t.length > 1) {
          var base = py(0).toFixed(1);
          partes.push('<path class="g-area" d="' + d + " L" +
            t[t.length - 1][0].toFixed(1) + " " + base + " L" +
            t[0][0].toFixed(1) + " " + base + ' Z" fill="' + s.color + '"/>');
        }
        partes.push('<path class="g-linea" d="' + d + '" stroke="' + s.color + '"/>');
        if (t.length === 1) {
          partes.push('<circle class="g-pto" cx="' + t[0][0].toFixed(1) + '" cy="' +
            t[0][1].toFixed(1) + '" r="4" fill="' + s.color + '"/>');
        }
      });
      s.valores.forEach(function (v, i) {
        if (v == null) return;
        partes.push('<circle class="g-pto" data-s="' + si + '" data-i="' + i +
          '" cx="' + px(i).toFixed(1) + '" cy="' + py(v).toFixed(1) +
          '" r="4" fill="' + s.color + '"/>');
      });
    });

    // Una sola etiqueta directa: la serie que termina más arriba.
    var alta = null;
    S.forEach(function (s) {
      for (var i = s.valores.length - 1; i >= 0; i--) {
        if (s.valores[i] == null) continue;
        if (!alta || s.valores[i] > alta.v) alta = { s: s, v: s.valores[i], i: i };
        break;
      }
    });
    if (alta) {
      partes.push('<text class="g-fin" x="' + (px(alta.i) + 9).toFixed(1) +
        '" y="' + (py(alta.v) + 4).toFixed(1) + '">' + ent(alta.v) + "</text>");
    }

    // Cruz y zona de captura del puntero.
    partes.push('<line class="g-cruz" id="' + id + '-cruz" x1="0" y1="' + G.ar +
      '" x2="0" y2="' + (G.h - G.ab) + '" style="opacity:0"/>');
    partes.push('<rect id="' + id + '-caza" x="' + G.iz + '" y="' + G.ar +
      '" width="' + (G.w - G.iz - G.de) + '" height="' + (G.h - G.ar - G.ab) +
      '" fill="transparent" style="cursor:crosshair"/>');

    var leyenda = S.length > 1
      ? '<div class="g-ley">' + S.map(function (s) {
          return '<span><i style="background:' + s.color + '"></i>' +
            esc2(s.nombre) + "</span>";
        }).join("") + "</div>"
      : "";

    var tabla = '<details class="g-tabla"><summary>Ver la tabla</summary>' +
      '<div class="tabla-wrap"><table class="tabla"><thead><tr><th>Semana</th>' +
      S.map(function (s) { return '<th class="n">' + esc2(s.nombre) + "</th>"; }).join("") +
      "</tr></thead><tbody>" +
      cfg.semanas.map(function (w, i) {
        return "<tr><td>" + esc2(w.etiqueta) + "</td>" + S.map(function (s) {
          var v = s.valores[i];
          return '<td class="n">' + (v == null ? "—" : ent(v)) + "</td>";
        }).join("") + "</tr>";
      }).join("") + "</tbody></table></div></details>";

    return '<div class="graf" id="' + id + '" data-graf=\'' +
      esc2(JSON.stringify({
        semanas: cfg.semanas.map(function (w) { return w.etiqueta; }),
        series: S.map(function (s) {
          return { n: s.nombre, v: s.valores, c: s.color };
        }),
        unidad: cfg.unidad, geo: G, max: esc.max
      })) + "'>" +
      '<div class="graf-cab"><h4>' + esc2(cfg.titulo) + "</h4>" +
        (cfg.subtitulo ? "<p>" + esc2(cfg.subtitulo) + "</p>" : "") + "</div>" +
      leyenda +
      '<div class="graf-lienzo"><svg viewBox="0 0 ' + G.w + " " + G.h +
        '" role="img" aria-label="' + esc2(cfg.titulo) + '">' + partes.join("") +
        "</svg><div class=\"g-tip\" id=\"" + id + "-tip\"></div></div>" +
      tabla + "</div>";
  }

  function bloqueGraficas() {
    var rs = D.redes_sociales, se = (rs && rs.serie_semanal) || null;
    if (!se || !se.semanas || !se.semanas.length) return "";
    var COL = ["var(--c1)", "var(--c2)", "var(--c3)"];
    var orden = ["facebook", "instagram", "youtube"];
    var serInt = orden.filter(function (r) { return se.interacciones[r]; })
      .map(function (r, i) {
        return { nombre: RED[r] || r, valores: se.interacciones[r], color: COL[i] };
      });
    var serVis = orden.filter(function (r) { return se.vistas[r]; })
      .map(function (r, i) {
        return { nombre: RED[r] || r, valores: se.vistas[r], color: COL[orden.indexOf(r)] };
      });

    var g1 = grafico("gInt", {
      titulo: "Interacciones por semana",
      subtitulo: "Reacciones más comentarios de las publicaciones de cada semana",
      semanas: se.semanas, series: serInt, unidad: "interacciones",
    });
    var g2 = serVis.length ? grafico("gVis", {
      titulo: "Vistas de video por semana",
      subtitulo: "Solo " + serVis.map(function (s) { return s.nombre; }).join(" y ") +
        ": las demás redes no devuelven vistas",
      semanas: se.semanas, series: serVis, unidad: "vistas", area: true,
    }) : '<div class="hueco chico">Ninguna de las redes reportadas devuelve ' +
      "vistas de video.</div>";

    return '<div class="grid2 grafs">' +
      '<article class="panel">' + g1 + "</article>" +
      '<article class="panel">' + g2 + "</article>" + "</div>" +
      '<div class="panel aviso"><h3>Cómo leer estas dos gráficas</h3><ul class="mini">' +
      "<li><b>Qué mide cada punto.</b> " + esc2(se._que_mide || "") + "</li>" +
      "<li><b>Por qué las líneas arrancan en semanas distintas.</b> " +
      esc2(se._por_que_arrancan_distinto || "") + "</li>" +
      "<li><b>Dos gráficas, no una.</b> Interacciones y vistas tienen escalas " +
      "muy distintas. Ponerlas en un mismo eje doble haría comparar alturas que " +
      "no son comparables.</li>" +
      "</ul></div>";
  }

  /* ═════════════ 3 · Competencia ═════════════ */

  function tarjetaMarca(b) {
    var ms = Object.keys(b.mercados).sort();
    var presion = ms.map(function (m) {
      var c = b.mercados[m];
      return '<div class="pres"><span>' + esc(m) + "</span><b>" +
        ent(c.presion_real) + "</b><i>anuncios que disputan</i>" +
        (c.activos_declarados !== c.presion_real
          ? '<u title="Anuncios activos totales de la página">de ' +
            ent(c.activos_declarados) + " activos</u>" : "") + "</div>";
    }).join("");

    var mensajes = (b.mensajes || []).length
      ? '<div class="mensajes"><span class="mini-et">Sus mensajes, por lo que ' +
        'repite y por lo que no mata</span>' +
        b.mensajes.map(function (m) {
          return '<div class="msg"><div class="msg-t">' + esc(m.titular) + "</div>" +
            '<div class="msg-d"><span><b>' + m.repeticiones +
            "</b> anuncios · " + pct(m.cuota) + " de su inventario</span>" +
            "<span><b>" + m.dias_vivo + "</b> días vivo · último hace " +
            m.dias_desde_el_ultimo + " d</span></div></div>";
        }).join("") +
        '<p class="aclara"><b>No es un ranking de efectividad.</b> La Ad Library no ' +
        "publica rendimiento de anunciantes comerciales: no hay impresiones, ni " +
        "gasto, ni conversiones. Lo que sí se ve es en qué apuestan — cuánto " +
        "repiten un mensaje y cuánto tiempo lo dejan vivo.</p></div>"
      : (!b.activos
        ? '<div class="hueco chico"><b>No tiene anuncios activos</b> en los mercados ' +
          "que medimos, así que no hay mensaje que leer. Eso no dice nada de lo que " +
          "anuncia fuera de aquí." + "</div>"
        : !b.muestra
        ? '<div class="hueco chico"><b>No se guardó muestra de sus anuncios.</b> ' +
          "De esta marca solo se midió cuántos de sus anuncios tocan nuestra " +
          "categoría, sobre su inventario completo. No se leyeron titulares, así " +
          "que no se puede decir qué mensaje repite." +
          (b.metodo ? '<div class="metodo">Método: ' + esc(b.metodo) + "</div>" : "") +
          "</div>"
        : '<div class="hueco chico">Se leyeron ' + b.muestra + " de sus anuncios y " +
          "ninguno trae un titular legible: son plantillas dinámicas sin renderizar " +
          "o anuncios sin titular.</div>");

    var extra = [];
    ms.forEach(function (m) {
      var c = b.mercados[m];
      if (c.lanzados_10d > 0) {
        extra.push("<li>" + esc(m) + ": <b>" + c.lanzados_10d +
          "</b> anuncios lanzados en los últimos 10 días" +
          (c.lanzados_3d ? " (" + c.lanzados_3d + " en los últimos 3)" : "") + ".</li>");
      }
      if (c.plantillas_sin_renderizar > 0) {
        extra.push("<li>" + esc(m) + ": <b>" + c.plantillas_sin_renderizar +
          "</b> anuncios muestran una plantilla dinámica sin renderizar " +
          "(<code>{{…}}</code>). Puede ser normal o un error suyo de " +
          "configuración; requiere revisión humana.</li>");
      }
    });

    return '<article class="panel marca">' +
      '<div class="marca-cab"><h3>' + esc(b.nombre) + "</h3>" +
      '<div class="tags">' + (b.categorias || []).map(function (c) {
        return '<span class="chip">' + esc(c === "hardware" ? "punto de venta" : c) +
          "</span>";
      }).join("") + (b.moneda ? '<span class="chip">' + esc(b.moneda) + "</span>" : "") +
      "</div></div>" +
      '<div class="presiones">' + presion + "</div>" +
      (b.nota ? '<p class="nota">' + esc(b.nota) + "</p>" : "") +
      mensajes +
      (extra.length ? '<ul class="mini">' + extra.join("") + "</ul>" : "") +
      (b.advertencia ? '<p class="adv">⚠ ' + esc(b.advertencia) + "</p>" : "") +
      (b.url ? '<a class="ext" href="' + esc(b.url) + '" target="_blank" ' +
        'rel="noopener noreferrer">' + ico.link +
        "Ver sus anuncios reales en la Ad Library</a>" : "") +
      "</article>";
  }

  function competencia() {
    var todas = marcas();
    var comp = todas.filter(function (b) { return b.rol === "competidor"; });
    var refs = todas.filter(function (b) { return b.rol === "referente"; });
    var sm = sinMedir();

    var lista, sub = "", explica;
    if (V.grupo === "referentes") {
      lista = refs;
      explica = "Marcas que <b>no disputan</b> nuestros mercados. Se miran para " +
        "aprender, no se cuentan como amenaza.";
    } else {
      var cat = V.categoria;
      lista = comp.filter(function (b) {
        return (b.categorias || []).indexOf(cat) >= 0;
      });
      sub = segmentado("categoria", [
        { v: "software", n: "Software" },
        { v: "hardware", n: "Punto de venta" }
      ], cat);
      explica = "Marcas que pautan en nuestros mercados y disputan nuestro espacio " +
        "de mensaje o de público.";
    }

    var faltantes = sm.filter(function (x) {
      return V.grupo === "referentes" ? x.rol === "referente" : x.rol === "competidor";
    });

    var avisosFalt = faltantes.map(function (x) {
      return '<article class="panel falta-marca"><h3>' + esc(x.nombre) + "</h3>" +
        '<div class="badge-falta">' + esc(x.estado) + "</div>" +
        "<p><b>No se midió.</b> Que no aparezca aquí no significa que no anuncie: " +
        "significa que no lo pudimos preguntar.</p>" +
        (x.por_que_falta ? '<p class="aclara">' + esc(x.por_que_falta) + "</p>" : "") +
        (x.como_obtenerlo ? '<p class="remedio"><b>Cómo desbloquearlo:</b> ' +
          esc(x.como_obtenerlo) + "</p>" : "") +
        "</article>";
    }).join("");

    var cuerpoL = lista.length || avisosFalt
      ? '<div class="grid2">' + lista.map(tarjetaMarca).join("") + avisosFalt + "</div>"
      : '<div class="hueco">Ninguna marca medida en esta categoría.</div>';

    return '<section id="competencia"><div class="cab"><h2>Competencia</h2>' +
      segmentado("grupo", [
        { v: "competencia", n: "Competencia" },
        { v: "referentes", n: "Referentes" }
      ], V.grupo) + "</div>" +
      '<p class="sub">' + explica + "</p>" +
      (sub ? '<div class="sub-seg">' + sub + "</div>" : "") +
      cuerpoL +
      '<div class="panel aviso"><h3>Cómo leer estos números</h3><ul class="mini">' +
      "<li><b>Es una foto, no una serie.</b> La Ad Library no acepta rango de " +
      "fechas: solo responde qué está activo ahora. Por eso una corrida " +
      "retroactiva no puede incluir competencia.</li>" +
      "<li><b>Volumen no es presión.</b> Banco Industrial tiene 845 anuncios " +
      "activos en GT y solo 2 tocan pagos. Sumar los 845 inflaría la presión " +
      "competitiva 21 veces.</li>" +
      "<li><b>Solo se midieron las marcas del registro.</b> Un competidor que " +
      "nadie agregó no aparece, y su ausencia aquí no es evidencia de nada.</li>" +
      "</ul></div></section>";
  }

  /* ═════════════ 4 · Referencias ═════════════ */

  function referencias() {
    var R = D.referencias;
    if (!R) return '<section id="referencias"><div class="cab"><h2>Referencias</h2>' +
      "</div><div class=\"hueco\">Sin datos de referencias en esta corrida.</div></section>";

    var filas = (R.contraste || []).map(function (f) {
      return "<tr><td><b>" + esc(f.dimension) + "</b></td><td>" + esc(f.qpaypro) +
        "</td><td>" + esc(f.competencia) + "</td><td>" + esc(f.referentes) +
        '</td></tr><tr class="lectura-f"><td colspan="4">' + esc(f.lectura) +
        "</td></tr>";
    }).join("");

    var t = R.territorios || {};
    var terr = "";
    if ((t.saturados || []).length || (t.libres || []).length) {
      terr = '<div class="grid2">' +
        (t.saturados || []).map(function (s) {
          return '<article class="panel terr ocupado"><div class="terr-et">' +
            "Territorio ocupado</div><h3>«" + esc(s.mensaje) + "»</h3>" +
            "<p>" + esc(s.lectura) + "</p>" +
            '<p class="aclara">' + esc(s.de) + " · " + esc(s.mercado) + " · " +
            s.repeticiones + " anuncios · " + s.dias_vivo + " días vivo</p></article>";
        }).join("") +
        (t.libres || []).map(function (l) {
          return '<article class="panel terr libre"><div class="terr-et">' +
            "Territorio sin disputa</div><h3>" + esc(l.mercado) + "</h3>" +
            "<p>" + esc(l.lectura) + "</p></article>";
        }).join("") + "</div>";
    }

    var bus = (R.busquedas || []).map(function (b) {
      return '<article class="panel busq"><div class="busq-cab">' +
        '<span class="chip">' + esc(b.formato) + "</span>" +
        '<span class="chip gris">búsqueda sin curar</span></div>' +
        "<h3>" + esc(b.tema) + "</h3>" +
        '<p class="aclara">' + esc(b.motivo) + "</p>" +
        '<div class="consulta">' + esc(b.consulta) + "</div>" +
        '<a class="ext" href="' + esc(b.url) + '" target="_blank" ' +
        'rel="noopener noreferrer">' + ico.link + "Abrir la búsqueda en Pinterest</a>" +
        "</article>";
    }).join("");

    var lims = (R.limites || []).map(function (l) {
      return "<li><b>" + esc(l.que) + " · " + esc(l.estado) + ".</b> " +
        esc(l.detalle) + (l.remedio ? " <i>" + esc(l.remedio) + "</i>" : "") + "</li>";
    }).join("");

    return '<section id="referencias"><div class="cab"><h2>Referencias</h2></div>' +
      '<p class="sub">Lo nuestro contra lo de ellos, y de ahí adónde ir a buscar ' +
      "cómo se ve.</p>" +
      '<div class="tabla-wrap"><table class="tabla contraste"><thead><tr>' +
      "<th>Dimensión</th><th>QPayPro</th><th>Competencia</th><th>Referentes</th>" +
      "</tr></thead><tbody>" + filas + "</tbody></table></div>" +
      (terr ? '<div class="cab sub-cab"><h2>Territorios de mensaje</h2></div>' + terr : "") +
      '<div class="cab sub-cab"><h2>Dónde buscar referencia visual</h2></div>' +
      '<p class="sub">Cada búsqueda sale de un dato de arriba. <b>Ningún pin fue ' +
      "visto ni verificado por el sistema</b>: son búsquedas, no referencias " +
      "curadas. Quien las abre elige.</p>" +
      (bus ? '<div class="grid3">' + bus + "</div>"
           : '<div class="hueco">Sin búsquedas que proponer en esta corrida.</div>') +
      '<div class="panel aviso"><h3>Lo que esta sección no puede dar</h3>' +
      '<ul class="mini">' + lims + "</ul></div></section>";
  }

  /* ═════════════ 5 · Estrategia ═════════════ */

  function selectorResponsable(t, asig) {
    var d = E.decisiones[t.id] || {};
    if (!asig.habilitada) {
      return '<div class="asig bloq"><span class="mini-et">Responsable</span>' +
        '<select disabled><option>Sin lista de personas</option></select>' +
        '<p class="aclara">' + esc(asig.motivo_bloqueo || "") + "</p></div>";
    }
    var ops = ['<option value="">Sin asignar</option>'].concat(
      (asig.personas || []).map(function (p) {
        return '<option value="' + esc(p.id_sprint) + '"' +
          (d.responsable === p.id_sprint ? " selected" : "") + ">" +
          esc(p.nombre) + (p.rol ? " · " + esc(p.rol) : "") + "</option>";
      }));
    return '<div class="asig"><span class="mini-et">Responsable</span>' +
      '<select data-asignar="' + esc(t.id) + '"' + (soloLectura ? " disabled" : "") +
      ">" + ops.join("") + "</select></div>";
  }

  function tarjetaTarea(t, asig) {
    var d = E.decisiones[t.id];
    var estado = d ? d.estado : null;
    var refs = (t.referencias || []).map(function (r) {
      return '<a class="ref-mini" href="' + esc(r.url) + '" target="_blank" ' +
        'rel="noopener noreferrer">' + esc(r.tema) + "</a>";
    }).join("");

    return '<article class="tarea' + (estado ? " " + estado : "") + '">' +
      '<div class="tarea-cab"><span class="chip ' + esc(t.tipo) + '">' +
        esc(t.tipo === "pauta" ? "cambio en pauta" : t.tipo) + "</span>" +
        (t.requiere_humano ? '<span class="chip alerta">la aplica una persona</span>' : "") +
        (estado ? '<span class="sello ' + esc(estado) + '">' +
          (estado === "aceptada" ? "Aceptada" : "Rechazada") + "</span>" : "") +
      "</div>" +
      "<h3>" + esc(t.titulo) + "</h3>" +
      '<p class="porque">' + esc(t.porque) + "</p>" +
      (t.angulo ? '<div class="campo"><span class="mini-et">Ángulo</span><p>' +
        esc(t.angulo) + "</p></div>" : "") +
      (t.no_decir ? '<div class="campo no-decir"><span class="mini-et">No decir</span>' +
        "<p>«" + esc(t.no_decir) + "» — ese terreno ya lo paga la competencia.</p>" +
        "</div>" : "") +
      (t.instruccion_exacta
        ? '<div class="campo instruccion"><span class="mini-et">Instrucción exacta ' +
          'para quien la aplique</span><p>' + esc(t.instruccion_exacta) + "</p></div>"
        : "") +
      (t.tipo !== "pauta"
        ? '<div class="campo"><span class="mini-et">Cuántas piezas</span><p>' +
          (t.piezas != null ? "<b>" + t.piezas + "</b> · " + esc(t.piezas_motivo)
            : "<b>Lo decide la mesa.</b> " + esc(t.piezas_motivo)) + "</p></div>"
        : "") +
      (t.copy ? '<div class="campo copy-bloq"><span class="mini-et">Copy</span>' +
        "<p><b>" + esc(t.copy.estado) + ".</b> " + esc(t.copy.motivo) + "</p>" +
        '<details><summary>Qué falta para desbloquearlo</summary><ul class="mini">' +
        (t.copy.falta || []).map(function (f) { return "<li>" + esc(f) + "</li>"; })
          .join("") + "</ul><p class=\"aclara\">Se llena en <code>" +
        esc(t.copy.donde) + "</code></p></details></div>" : "") +
      (refs ? '<div class="campo"><span class="mini-et">Referencia visual</span>' +
        '<div class="refs">' + refs + "</div></div>" : "") +
      '<details class="ev"><summary>Evidencia (' + (t.evidencia || []).length +
        ")</summary><ul class=\"mini\">" +
        (t.evidencia || []).map(function (e) { return "<li>" + esc(e) + "</li>"; })
          .join("") + "</ul></details>" +
      '<div class="tarea-pie">' +
        '<div class="acciones">' +
        '<button type="button" class="btn ok' + (estado === "aceptada" ? " on" : "") +
          '" data-decidir="' + esc(t.id) + '" data-estado="aceptada"' +
          (soloLectura ? " disabled" : "") + ">" + ico.tic + "Aceptar</button>" +
        '<button type="button" class="btn no' + (estado === "rechazada" ? " on" : "") +
          '" data-decidir="' + esc(t.id) + '" data-estado="rechazada"' +
          (soloLectura ? " disabled" : "") + ">" + ico.x + "Rechazar</button>" +
        "</div>" +
        (estado === "aceptada" ? selectorResponsable(t, asig) : "") +
      "</div></article>";
  }


  function estrategiaActiva() {
    var est = D.estrategia || {}, es = est.estrategias || [];
    if (!es.length) return null;
    var hay = es.filter(function (e) { return e.id === E.estrategia; })[0];
    return hay || es.filter(function (e) { return e.recomendada; })[0] || es[0];
  }

  function selectorEstrategia() {
    var est = D.estrategia || {}, es = est.estrategias || [];
    if (!es.length) return "";
    var act = estrategiaActiva();
    return '<div class="ests">' + es.map(function (e) {
      var on = e.id === act.id;
      return '<article class="est' + (on ? " on" : "") + '">' +
        '<div class="est-cab">' +
          (e.recomendada ? '<span class="chip rec">Recomendada por el análisis</span>'
                         : '<span class="chip gris">Alternativa</span>') +
          (on ? '<span class="est-marca">' + ico.tic + "Elegida</span>" : "") +
        "</div>" +
        "<h3>" + esc(e.nombre) + "</h3>" +
        '<p class="est-que">' + esc(e.en_pocas_palabras) + "</p>" +
        '<div class="campo"><span class="mini-et">Por qué es buena idea</span><p>' +
          esc(e.por_que) + "</p></div>" +
        '<div class="campo est-no"><span class="mini-et">Cuándo NO conviene</span>' +
          "<p>" + esc(e.cuando_no_conviene) + "</p></div>" +
        (e._por_que_recomendada
          ? '<p class="aclara">' + esc(e._por_que_recomendada) + "</p>" : "") +
        '<details><summary>Evidencia (' + (e.evidencia || []).length +
          ')</summary><ul class="mini">' +
          (e.evidencia || []).map(function (x) { return "<li>" + esc(x) + "</li>"; })
            .join("") + "</ul></details>" +
        '<div class="est-pie">' +
          '<span class="aclara">Activa ' + e.tareas.length +
            (e.tareas.length === 1 ? " tarea" : " tareas") + " de producción</span>" +
          (on ? "" : '<button type="button" class="btn chico" data-estrategia="' +
            esc(e.id) + '"' + (soloLectura ? " disabled" : "") +
            ">Usar esta</button>") +
        "</div></article>";
    }).join("") + "</div>" +
    '<p class="aclara aviso-linea">Cambiar de estrategia cambia las tareas de ' +
    "producción que se proponen: una tarea sin una estrategia detrás es una " +
    "ocurrencia. Las decisiones que ya tomaron sobre una tarea se conservan, y " +
    "las tareas de configuración de pauta no dependen de la estrategia porque " +
    "son higiene.</p>";
  }

  function formNuevaTarea(asig) {
    var ops = asig.habilitada
      ? '<label class="np-campo"><span class="mini-et">Responsable</span>' +
        '<select id="npResp"><option value="">Sin asignar</option>' +
        (asig.personas || []).map(function (p) {
          return '<option value="' + esc(p.id_sprint) + '">' + esc(p.nombre) +
            (p.rol ? " · " + esc(p.rol) : "") + "</option>";
        }).join("") + "</select></label>"
      : "";
    return '<article class="panel nueva-tarea">' +
      '<div class="nt-cab"><h3>Agregar una idea del equipo</h3>' +
      '<span class="chip gris">entra directo a aceptadas</span></div>' +
      '<p class="aclara">Si a la mesa se le ocurre algo mejor que lo que propone ' +
      "el análisis, va aquí. Queda marcada como idea del equipo: no trae " +
      "evidencia del sistema, y esa diferencia se conserva para que nadie la lea " +
      "después como un hallazgo.</p>" +
      '<div class="np-rejilla">' +
        '<label class="np-campo np-ancho"><span class="mini-et">Qué hay que hacer</span>' +
        '<input type="text" id="npTitulo" maxlength="140" ' +
        'placeholder="Ej. Video del POS en un negocio real de San Salvador"></label>' +
        '<label class="np-campo np-ancho"><span class="mini-et">En qué consiste y por qué</span>' +
        '<textarea id="npDetalle" rows="3" maxlength="900" ' +
        'placeholder="El ángulo, el público, qué debería mostrar…"></textarea></label>' +
        '<div class="np-campo"><span class="mini-et">Tipo de pieza</span>' +
          '<div class="seg" id="npTipo">' +
          '<button type="button" class="seg-b on" data-nptipo="arte">Arte</button>' +
          '<button type="button" class="seg-b" data-nptipo="video">Video</button>' +
          "</div></div>" +
        ops +
        '<label class="np-campo np-ancho"><span class="mini-et">Links o referencias ' +
        '(uno por línea)</span><textarea id="npRefs" rows="2" maxlength="900" ' +
        'placeholder="https://…"></textarea></label>' +
      "</div>" +
      '<div class="np-pie">' +
        '<button type="button" class="btn chico pri" id="npAgregar"' +
        (soloLectura ? " disabled" : "") + ">Agregar a aceptadas</button>" +
        (soloLectura ? '<span class="aclara">Esta vista es de solo lectura.</span>'
                     : "") +
      "</div></article>";
  }

  function tarjetaPropia(t, asig) {
    var refs = (t.referencias || []).map(function (u) {
      return '<a class="ref-mini" href="' + esc(u) + '" target="_blank" ' +
        'rel="noopener noreferrer">' + esc(u.replace(/^https?:\/\//, "").slice(0, 42)) +
        "</a>";
    }).join("");
    var estado = t.estado || "aceptada";
    var sel = "";
    if (estado === "aceptada") {

  function avisar(txt) {

  /* Se renderiza en un contenedor propio, NUNCA reemplazando todo el body.
     Cuando la página se publica como fragmento, el <style> y el <link> de
     fuentes viven dentro del body: hacer body.innerHTML = ... los destruía y
     la página quedaba sin una sola línea de CSS. Pasó, y así no puede volver
     a pasar. */
  function raiz() {
    var r = document.getElementById("raiz");
    if (!r) {
      r = document.createElement("div");
      r.id = "raiz";

    }

  function pintar(anclaje) {
    var y = anclaje ? window.scrollY : null;
    raiz().innerHTML = cuerpo();

    conectar();
    if (y != null) window.scrollTo(0, y);
