<title>Lead Magnet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700&family=Figtree:wght@400;500;700&display=swap">
<style>
/* Una pantalla, cinco frases. Sin tablas, sin jerga, sin SQL.
   Todo numero sale del dato; ninguno esta escrito a mano. */
:root{
  --papel:#f7f8fa; --tarjeta:#ffffff; --tinta:#14171c; --suave:#5d646e;
  --linea:#e3e7ec; --azul:#1f5fbf; --verde:#1d7a4e; --rojo:#b3301f;
  --sombra:0 1px 2px rgba(20,23,28,.04), 0 10px 26px -14px rgba(20,23,28,.18);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --papel:#0f1215; --tarjeta:#171b20; --tinta:#eef1f5; --suave:#98a1ad;
  --linea:#262c33; --azul:#7aa9f0; --verde:#5fc48c; --rojo:#f0836f;
  --sombra:0 1px 2px rgba(0,0,0,.3), 0 10px 26px -14px rgba(0,0,0,.6);
}}
:root[data-theme="dark"]{
  --papel:#0f1215; --tarjeta:#171b20; --tinta:#eef1f5; --suave:#98a1ad;
  --linea:#262c33; --azul:#7aa9f0; --verde:#5fc48c; --rojo:#f0836f;
  --sombra:0 1px 2px rgba(0,0,0,.3), 0 10px 26px -14px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
body{background:var(--papel);color:var(--tinta);margin:0;
  font-family:Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased;
  padding-inline:16px;padding-block:28px 56px}
.hoja{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
h1{font-family:Archivo,system-ui,sans-serif;font-weight:700;font-size:clamp(26px,5vw,34px);
  letter-spacing:-.02em;margin:0;text-wrap:balance}
.sub{color:var(--suave);font-size:15px;margin:6px 0 0}

.mandos{display:flex;flex-wrap:wrap;gap:10px}
.mando{display:flex;align-items:center;gap:9px;background:var(--tarjeta);border:1px solid var(--linea);
  border-radius:999px;padding:8px 14px;box-shadow:var(--sombra)}
.mando label{font-size:13px;color:var(--suave);font-weight:500}
.mando select{font:inherit;font-size:15px;font-weight:600;color:var(--tinta);background:transparent;
  border:0;padding:2px 0;cursor:pointer;max-width:56vw}
.mando select:focus-visible{outline:2px solid var(--azul);outline-offset:3px;border-radius:5px}

.frases{display:flex;flex-direction:column;gap:14px;counter-reset:f}
.frase{background:var(--tarjeta);border:1px solid var(--linea);border-radius:18px;
  padding:22px 24px;box-shadow:var(--sombra)}
.frase p{margin:0;font-size:clamp(19px,2.6vw,23px);line-height:1.42;text-wrap:pretty}
.frase .porque{margin-top:10px;font-size:15px;color:var(--suave);line-height:1.5}
.n{font-family:Archivo,system-ui,sans-serif;font-weight:700;font-variant-numeric:tabular-nums;
  font-size:1.5em;line-height:1;letter-spacing:-.02em;color:var(--azul);
  display:inline-block;vertical-align:-.06em}
.n.bien{color:var(--verde)} .n.mal{color:var(--rojo)}
.frase.alerta{border-color:color-mix(in srgb,var(--rojo) 42%,var(--linea))}
strong{font-weight:700}

.pie{color:var(--suave);font-size:14px;border-top:1px solid var(--linea);padding-top:18px}
.pie b{color:var(--tinta);font-weight:600}
@media (max-width:420px){ .frase{padding:18px 18px} }
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="hoja">
  <header>
    <h1>Lead Magnet</h1>
    <p class="sub" id="sub"></p>
  </header>

  <div class="mandos">
    <div class="mando"><label for="mercado">Mercado</label>
      <select id="mercado"></select></div>
    <div class="mando"><label for="mes">Cuándo</label>
      <select id="mes"></select></div>
  </div>

  <div class="frases" id="frases"></div>
  <p class="pie" id="pie"></p>
</div>

<script id="datos" type="application/json">__DATOS__</script>
<script>
const D = JSON.parse(document.getElementById("datos").textContent);
const V = D.dic, F = V.fecha, L = D.leads, T = D.tratos, R = D.resp;
const lF=0,lPA=1,lCA=2,lCL=7,lCO=11;
const tPA=1,tCA=2,tET=4,tCI=15;
const rF=0,rUS=2,rVI=6;
const GANADO = V.etapa.indexOf("closed won");
const MES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto",
             "septiembre","octubre","noviembre","diciembre"];
const nf = n => Number(n).toLocaleString("es-GT");
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const enCristiano = f => { const [a,m,d] = f.split('-');
  return Number(d) + ' de ' + MES[Number(m)-1] + ' de ' + a; };
const num = (v,cls) => '<span class="n'+(cls?" "+cls:"")+'">'+nf(v)+'</span>';

/* Los meses del selector salen de los LEADS, no del calendario: un mes sin
   leads en la lista prometeria dato que no hay. */
const meses = [...new Set(L.map(r=>F[r[lF]].slice(0,7)))].sort();
const paises = V.pais.filter(p => p !== "Sin país" && L.some(r=>V.pais[r[lPA]]===p));

const sel = (id, ops) => {
  document.getElementById(id).innerHTML =
    ops.map(([v,t])=>'<option value="'+esc(v)+'">'+esc(t)+'</option>').join("");
};
sel("mercado", [["","Todos"], ...paises.map(p=>[p,p])]);
sel("mes", [...meses.slice().reverse().map(m=>[m, MES[+m.slice(5,7)-1]+" "+m.slice(0,4)]),
            ["","Todo el año"]]);
document.getElementById("mes").value = meses[meses.length-1];

function pinta(){
  const pais = document.getElementById("mercado").value;
  const mes  = document.getElementById("mes").value;
  const enMes = i => i >= 0 && (!mes || F[i].startsWith(mes));
  const dePais = p => !pais || V.pais[p] === pais;

  const l = L.filter(r => enMes(r[lF]) && dePais(r[lPA]));
  const ventas = T.filter(r => enMes(r[tCI]) && r[tET] === GANADO && dePais(r[tPA]));
  const conv = l.filter(r => r[lCO] === 1).length;
  const enZoho = l.length - conv;

  // Canales: el que trae mas gente y el que mas vende casi nunca son el mismo.
  const cuenta = (arr, col) => { const m = {};
    arr.forEach(r => { const k = V.canal[r[col]]; m[k] = (m[k]||0)+1; }); return m; };
  const top = m => Object.entries(m).sort((a,b)=>b[1]-a[1])[0];
  const porLeads = top(cuenta(l, lCA)) || ["—",0];
  const porVenta = top(cuenta(ventas, tCA)) || ["—",0];

  /* Sin dueno: leads sin Trato, todavia vivos, de alguien que ya no trabaja aca.
     NO se filtra por mes a proposito: no es «lo que paso en septiembre», es la
     pila que hay hoy. Filtrada por mes daba 0 y desaparecia justo el unico
     numero de esta pagina sobre el que se puede actuar manana. */
  const huerf = R.filter(r => r[rVI] === 1 && V.usuario[r[rUS]] !== "activo").length;

  const cuando = mes ? MES[+mes.slice(5,7)-1] + " de " + mes.slice(0,4) : "todo 2026";
  const donde  = pais || "Guatemala y El Salvador";
  document.getElementById("sub").textContent = "Lo que pasó en " + cuando + ", en " + donde + ".";

  const f = [];

  f.push(['Entraron ' + num(l.length) + ' personas interesadas.',
    'Cada una dejó sus datos y quedó guardada en el CRM.']);

  f.push(['De esas, ' + num(ventas.length, "bien") + ' compraron.',
    ventas.length
      ? 'Se cuentan las que cerraron en ' + cuando + ', aunque hayan escrito antes.'
      : 'Todavía ninguna cerró. Los leads recién entrados tardan en decidir.']);

  if (porLeads[1]) f.push([
    '<strong>' + esc(porLeads[0]) + '</strong> trajo la mayoría: ' + num(porLeads[1]) + '.' +
    (porVenta[1] && porVenta[0] !== porLeads[0]
      ? ' Pero quien vendió fue <strong>' + esc(porVenta[0]) + '</strong>, con ' +
        num(porVenta[1], "bien") + '.'
      : (porVenta[1] ? ' Y también es quien más vendió: ' + num(porVenta[1], "bien") + '.' : '')),
    porVenta[1] && porVenta[0] !== porLeads[0]
      ? 'Traer gente y vender no es lo mismo. El canal más ruidoso no es el que deja plata.'
      : 'El mismo canal trae y cierra.']);

  if (conv) f.push([
    'En Zoho vas a ver ' + num(enZoho) + ', no ' + num(l.length) + '.',
    'Zoho esconde a los ' + nf(conv) + ' que ya avanzaron a Trato. No se perdieron: son justo ' +
    'los que van bien. Por eso tu pantalla siempre da menos.']);

  if (huerf) f.push([
    'Hay ' + num(huerf, "mal") + ' personas esperando que nadie puede atender.',
    'Su vendedor ya no trabaja acá y los contactos se quedaron a su nombre: nadie los ve, ' +
    'nadie los llama. Son de todo el año, no solo de ' + cuando + '. Reasignarlos es ' +
    'trabajo de un día, y es lo único de esta página que se puede arreglar esta semana.',
    true]);

  document.getElementById("frases").innerHTML = f.map(([t,p,mal]) =>
    '<div class="frase' + (mal ? ' alerta' : '') + '"><p>' + t + '</p>' +
    '<p class="porque">' + p + '</p></div>').join("");

  document.getElementById("pie").innerHTML =
    'Datos tomados del CRM y de Meta el <b>' + esc(enCristiano(D.calidad.foto)) + '</b>. ' +
    'Se actualizan cuando se vuelve a correr, no solos.';
}

document.getElementById("mercado").addEventListener("change", pinta);
document.getElementById("mes").addEventListener("change", pinta);
pinta();
</script>
