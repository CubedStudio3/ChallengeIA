<!-- ============================================================
     SECCIÓN · Hero inmersivo
     Imagen a sangre con capa oscura y texto centrado encima.
     Para marcas que venden con la foto, no con la ficha técnica.
     ============================================================ -->
<section class="qs-hero-inmersivo">
  <style>
  .qs-hero-inmersivo{
    /* ═══ EDITA AQUÍ ═══════════════════════════════════════════ */
    --qs-alto:         86vh;      /* alto de la sección            */
    --qs-alto-min:     540px;     /* alto mínimo en pantalla chica */
    --qs-velo:         .56;       /* qué tan oscura la capa (0 a 1)*/
    --qs-tinta:        #FFFFFF;   /* color del texto               */
    --qs-acento:       #FFFFFF;   /* fondo del botón               */
    --qs-acento-texto: #101010;   /* texto del botón               */
    --qs-radio:        999px;     /* redondeo del botón            */
    /* ═════════════════════════════════════════════════════════ */

    position:relative; isolation:isolate; overflow:hidden;
    min-height:min(var(--qs-alto), 760px); height:auto;
    display:grid; place-items:center; text-align:center;
    padding:96px 24px; color:var(--qs-tinta); background:#141414;
    font-family:'Inter',-apple-system,'Segoe UI',system-ui,sans-serif;
  }
  .qs-hero-inmersivo *{box-sizing:border-box}
  .qs-hi-foto{position:absolute; inset:0; z-index:-2}
  .qs-hi-foto svg, .qs-hi-foto img{width:100%; height:100%; object-fit:cover; display:block}
  .qs-hero-inmersivo::after{
    content:""; position:absolute; inset:0; z-index:-1;
    background:linear-gradient(180deg, rgba(0,0,0,calc(var(--qs-velo) * .75)) 0%, rgba(0,0,0,calc(var(--qs-velo) * .35)) 40%, rgba(0,0,0,var(--qs-velo)) 100%);
  }
  .qs-hi-caja{max-width:660px; margin:0 auto}
  .qs-hi-linea{
    font-size:11.5px; font-weight:600; letter-spacing:.22em; text-transform:uppercase;
    opacity:.82; margin:0 0 22px;
  }
  .qs-hero-inmersivo h2{
    font-size:clamp(34px,6.4vw,66px); line-height:1.02; letter-spacing:-.035em;
    font-weight:800; margin:0 0 20px; text-wrap:balance;
  }
  .qs-hi-bajada{font-size:17px; line-height:1.6; opacity:.86; margin:0 auto 34px; max-width:46ch}
  .qs-hi-cta{
    font:inherit; font-size:15px; font-weight:600; text-decoration:none; cursor:pointer;
    background:var(--qs-acento); color:var(--qs-acento-texto); border:0;
    border-radius:var(--qs-radio); padding:16px 36px; display:inline-block;
    transition:transform .15s ease;
  }
  .qs-hi-cta:hover{transform:scale(1.03)}
  .qs-hi-pie{
    position:absolute; left:0; right:0; bottom:0; padding:18px 24px;
    display:flex; justify-content:center; gap:30px; flex-wrap:wrap;
    font-size:12.5px; opacity:.72; border-top:1px solid rgba(255,255,255,.16);
  }
  .qs-hi-pie span{display:inline-flex; align-items:center; gap:7px}
  .qs-hi-pie svg{width:14px; height:14px; flex:none}
  @media (max-width:640px){
    .qs-hero-inmersivo{padding:72px 20px 96px; min-height:var(--qs-alto-min)}
    .qs-hi-pie{gap:16px; font-size:11.5px}
  }
  </style>

  <!-- Reemplazar por: <div class="qs-hi-foto"><img src="tu-foto.jpg" alt="Descripción"></div> -->
  <div class="qs-hi-foto" aria-hidden="true">
    <svg viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="qshi1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3B4F5C"/><stop offset=".55" stop-color="#22303A"/><stop offset="1" stop-color="#14202A"/></linearGradient><radialGradient id="qshi2" cx=".7" cy=".25" r=".7"><stop offset="0" stop-color="#8FA9B8" stop-opacity=".45"/><stop offset="1" stop-color="#8FA9B8" stop-opacity="0"/></radialGradient></defs><rect width="1200" height="700" fill="url(#qshi1)"/><rect width="1200" height="700" fill="url(#qshi2)"/><circle cx="880" cy="200" r="150" fill="#A7C0CE" opacity=".18"/><path d="M0 520 C 260 440 420 560 700 470 C 900 410 1080 470 1200 430 L1200 700 L0 700 Z" fill="#0E1920" opacity=".55"/><path d="M0 600 C 300 540 500 640 820 570 C 1000 530 1120 570 1200 550 L1200 700 L0 700 Z" fill="#0A1218" opacity=".7"/></svg>
  </div>

  <div class="qs-hi-caja">
    <p class="qs-hi-linea">Colección de temporada</p>
    <h2>Lo que se pone en el mostrador, se vende</h2>
    <p class="qs-hi-bajada">Piezas hechas en taller guatemalteco, en cantidades cortas. Cuando se acaban, se acaban.</p>
    <a class="qs-hi-cta" href="#">Ver la colección</a>
  </div>

  <div class="qs-hi-pie">
    <span><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M2 5.5h12M2 5.5v7a1 1 0 001 1h10a1 1 0 001-1v-7M2 5.5l1.5-3h9L14 5.5" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>Envío a todo el país</span>
    <span><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><rect x="1.5" y="4" width="13" height="9" rx="2" stroke="currentColor" stroke-width="1.3"/><path d="M1.5 7h13" stroke="currentColor" stroke-width="1.3"/></svg>Visa y Mastercard</span>
    <span><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 1.8l5.2 2.1v4c0 3.2-2.2 5.6-5.2 6.3-3-0.7-5.2-3.1-5.2-6.3v-4L8 1.8z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>Pago verificado</span>
  </div>
</section>
