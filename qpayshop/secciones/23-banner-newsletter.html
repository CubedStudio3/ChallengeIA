<!-- ============================================================
     SECCIÓN · Banner de suscripción
     Correo a cambio de algo concreto. El aviso de privacidad va
     visible, no escondido en un enlace.
     ============================================================ -->
<section class="qs-banner-newsletter">
  <style>
  .qs-banner-newsletter{
    /* ═══ EDITA AQUÍ ═══════════════════════════════════════════ */
    --qs-fondo:       #131417;   /* fondo del bloque               */
    --qs-tinta:       #F2F3EF;   /* color del texto                */
    --qs-tinta-suave: #9A9D96;   /* color de la letra chica        */
    --qs-acento:      #C6F24A;   /* fondo del botón                */
    --qs-acento-txt:  #131417;   /* texto del botón                */
    --qs-borde:       #2E3035;   /* borde del campo                */
    --qs-radio:       12px;      /* redondeo del campo y el botón  */
    --qs-aire:        56px;      /* espacio arriba y abajo         */
    /* ═════════════════════════════════════════════════════════ */

    background:var(--qs-fondo); color:var(--qs-tinta);
    font-family:'Inter',-apple-system,'Segoe UI',system-ui,sans-serif;
    padding:var(--qs-aire) 24px;
  }
  .qs-banner-newsletter *{box-sizing:border-box}
  .qs-bn-reja{
    max-width:1020px; margin:0 auto; display:grid; grid-template-columns:1fr 1fr;
    gap:40px; align-items:center;
  }
  .qs-banner-newsletter h2{font-size:clamp(22px,2.9vw,30px); font-weight:700; letter-spacing:-.025em; margin:0 0 10px; text-wrap:balance}
  .qs-bn-reja > div:first-child p{margin:0; font-size:15px; line-height:1.6; color:var(--qs-tinta-suave); max-width:40ch}
  .qs-bn-campo{display:flex; gap:9px; flex-wrap:wrap}
  .qs-bn-campo input{
    flex:1; min-width:200px; font:inherit; font-size:15px; color:var(--qs-tinta);
    background:transparent; border:1.5px solid var(--qs-borde); border-radius:var(--qs-radio);
    padding:14px 16px; outline:0;
  }
  .qs-bn-campo input::placeholder{color:var(--qs-tinta-suave)}
  .qs-bn-campo input:focus{border-color:var(--qs-acento)}
  .qs-bn-campo button{
    font:inherit; font-size:15px; font-weight:700; cursor:pointer;
    background:var(--qs-acento); color:var(--qs-acento-txt); border:0;
    border-radius:var(--qs-radio); padding:14px 28px;
  }
  .qs-bn-aviso{margin:12px 0 0; font-size:11.5px; line-height:1.5; color:var(--qs-tinta-suave)}
  .qs-bn-aviso a{color:var(--qs-tinta); text-decoration:underline}
  @media (max-width:760px){
    .qs-banner-newsletter{--qs-aire:40px}
    .qs-bn-reja{grid-template-columns:1fr; gap:22px}
    .qs-bn-campo button{width:100%}
  }
  </style>

  <div class="qs-bn-reja">
    <div>
      <h2>Te avisamos cuando vuelva tu talla</h2>
      <p>Un correo por semana con lo que entró a bodega y las rebajas antes de que salgan a la tienda.</p>
    </div>
    <div>
      <form class="qs-bn-campo" onsubmit="return false">
        <label for="qs-bn-correo" class="qs-bn-etiqueta" hidden>Correo electrónico</label>
        <input id="qs-bn-correo" type="email" name="correo" required placeholder="tucorreo@ejemplo.com" autocomplete="email">
        <button type="submit">Suscribirme</button>
      </form>
      <p class="qs-bn-aviso">Usamos tu correo solo para estos avisos. Te puedes dar de baja con un clic desde cualquiera de ellos. <a href="#">Aviso de privacidad</a></p>
    </div>
  </div>
</section>
