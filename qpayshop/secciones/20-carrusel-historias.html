<!-- ============================================================
     SECCIÓN · Carrusel de historias
     Círculos que se deslizan, como las historias de una red. Ocupa
     poco alto y mete muchas colecciones arriba del catálogo.
     ============================================================ -->
<section class="qs-carrusel-historias">
  <style>
  .qs-carrusel-historias{
    /* ═══ EDITA AQUÍ ═══════════════════════════════════════════ */
    --qs-fondo:       #FFFFFF;   /* fondo de la sección            */
    --qs-tinta:       #24131E;   /* color del nombre               */
    --qs-tinta-suave: #6E5866;   /* color del conteo               */
    --qs-anillo-a:    #8E2F63;   /* color inicial del anillo       */
    --qs-anillo-b:    #D3A81C;   /* color final del anillo         */
    --qs-tamano:      84px;      /* diámetro del círculo           */
    --qs-aire:        34px;      /* espacio arriba y abajo         */
    /* ═════════════════════════════════════════════════════════ */

    background:var(--qs-fondo); color:var(--qs-tinta);
    font-family:'Inter',-apple-system,'Segoe UI',system-ui,sans-serif;
    padding:var(--qs-aire) 0;
  }
  .qs-carrusel-historias *{box-sizing:border-box}
  .qs-ch-pista{
    display:flex; gap:20px; overflow-x:auto; padding:2px 24px 6px;
    scroll-snap-type:x proximity; scrollbar-width:none;
  }
  .qs-ch-pista::-webkit-scrollbar{display:none}
  .qs-ch-item{
    flex:0 0 auto; width:var(--qs-tamano); text-align:center;
    text-decoration:none; color:inherit; scroll-snap-align:start;
  }
  .qs-ch-anillo{
    display:block;   /* es un <span> dentro de un <a>: sin esto ignora ancho y alto */
    width:var(--qs-tamano); height:var(--qs-tamano); border-radius:50%; padding:2.5px;
    background:linear-gradient(135deg, var(--qs-anillo-a), var(--qs-anillo-b));
    margin-bottom:9px; transition:transform .18s ease;
  }
  .qs-ch-item:hover .qs-ch-anillo{transform:scale(1.05)}
  .qs-ch-anillo > span{
    display:block; width:100%; height:100%; border-radius:50%; overflow:hidden;
    border:2.5px solid var(--qs-fondo); background:#F4F4F5;
  }
  .qs-ch-anillo svg, .qs-ch-anillo img{width:100%; height:100%; object-fit:cover; display:block}
  .qs-ch-item b{display:block; font-size:12.5px; font-weight:600; line-height:1.3}
  .qs-ch-item span.qs-ch-n{display:block; font-size:11px; color:var(--qs-tinta-suave); margin-top:2px; font-variant-numeric:tabular-nums}
  @media (max-width:560px){ .qs-carrusel-historias{--qs-tamano:70px} .qs-ch-pista{gap:14px; padding-inline:16px} }
  </style>

  <div class="qs-ch-pista" role="region" aria-label="Colecciones">

  </div>
</section>
