<!-- ============================================================
     SECCIÓN · Banner de promoción
     Una sola oferta con su producto, el porcentaje grande y el
     código de cupón. Para la campaña del mes, no para el catálogo.
     ============================================================ -->
<section class="qs-banner-promocion">
  <style>
  .qs-banner-promocion{
    /* ═══ EDITA AQUÍ ═══════════════════════════════════════════ */
    --qs-fondo-a:   #2A1B4D;   /* color inicial del degradado      */
    --qs-fondo-b:   #4B2A63;   /* color final del degradado        */
    --qs-tinta:     #F6F1FF;   /* color del texto                  */
    --qs-acento:    #FFD166;   /* el número grande y el cupón      */
    --qs-boton:     #FFFFFF;   /* fondo del botón                  */
    --qs-boton-txt: #2A1B4D;   /* texto del botón                  */
    --qs-radio:     22px;      /* redondeo del banner              */
    --qs-aire:      48px;      /* espacio arriba y abajo           */
    /* ═════════════════════════════════════════════════════════ */

    font-family:'Inter',-apple-system,'Segoe UI',system-ui,sans-serif;
    padding:var(--qs-aire) 24px; background:transparent;
  }
  .qs-banner-promocion *{box-sizing:border-box}
  .qs-bp-caja{
    max-width:1120px; margin:0 auto; border-radius:var(--qs-radio); overflow:hidden;
    background:linear-gradient(115deg, var(--qs-fondo-a) 0%, var(--qs-fondo-b) 100%);
    color:var(--qs-tinta); display:grid; grid-template-columns:1.25fr .75fr;
    align-items:stretch; position:relative;
  }
  .qs-bp-caja::before{
    content:""; position:absolute; top:-60px; right:26%; width:280px; height:280px;
    border-radius:50%; background:rgba(255,255,255,.07);
  }
  .qs-bp-texto{padding:46px 42px; position:relative; z-index:1}
  .qs-bp-cifra{
    display:flex; align-items:baseline; gap:8px; color:var(--qs-acento);
    font-weight:800; letter-spacing:-.04em; line-height:.9; margin-bottom:14px;
  }
  .qs-bp-cifra b{font-size:clamp(52px,8vw,84px)}
  .qs-bp-cifra span{font-size:clamp(20px,3vw,28px); font-weight:700}
  .qs-banner-promocion h2{font-size:clamp(21px,2.8vw,28px); font-weight:700; letter-spacing:-.025em; margin:0 0 10px; text-wrap:balance}
  .qs-bp-texto > p{margin:0 0 26px; font-size:15px; line-height:1.55; opacity:.82; max-width:40ch}
  .qs-bp-fila{display:flex; align-items:center; gap:14px; flex-wrap:wrap}
  .qs-bp-cta{
    font:inherit; font-size:15px; font-weight:700; text-decoration:none; cursor:pointer;
    background:var(--qs-boton); color:var(--qs-boton-txt); border:0; border-radius:12px;
    padding:15px 30px; display:inline-block; transition:transform .15s ease;
  }
  .qs-bp-cta:hover{transform:translateY(-1px)}
  .qs-bp-cupon{
    font-size:13px; letter-spacing:.02em; opacity:.85;
    display:inline-flex; align-items:center; gap:8px;
  }
  .qs-bp-cupon code{
    font-family:ui-monospace,'SF Mono',Menlo,monospace; font-size:13px; font-weight:700;
    color:var(--qs-acento); border:1.5px dashed currentColor; border-radius:8px; padding:6px 11px;
  }
  .qs-bp-letra{margin:22px 0 0; font-size:11.5px; opacity:.55; max-width:44ch; line-height:1.5}
  .qs-bp-foto{position:relative; min-height:280px; overflow:hidden}
  .qs-bp-foto svg, .qs-bp-foto img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover}
  @media (max-width:820px){
    .qs-banner-promocion{--qs-aire:32px}
    .qs-bp-caja{grid-template-columns:1fr}
    .qs-bp-foto{min-height:190px; order:-1}
    .qs-bp-texto{padding:32px 24px}
  }
  </style>

  <div class="qs-bp-caja">
    <div class="qs-bp-texto">
      <p class="qs-bp-cifra"><b>30</b><span>% menos</span></p>
      <h2>En toda la línea de cuidado personal</h2>
      <p>Del 1 al 15 de octubre, en línea y en el local. Aplica sobre el precio de lista.</p>
      <div class="qs-bp-fila">
        <a class="qs-bp-cta" href="#">Comprar ahora</a>
        <span class="qs-bp-cupon">Usa el código <code>OCTUBRE30</code></span>
      </div>
      <p class="qs-bp-letra">No se acumula con otras promociones. Válido hasta agotar existencias.</p>
    </div>

    <!-- Reemplazar el <svg> por: <img src="promocion.jpg" alt="Descripción de la foto"> -->
    <div class="qs-bp-foto">
      <svg viewBox="0 0 420 420" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs><linearGradient id="qsbp1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6B4A85"/><stop offset="1" stop-color="#3A2456"/></linearGradient></defs><rect width="420" height="420" fill="url(#qsbp1)"/><circle cx="300" cy="120" r="110" fill="#FFD166" opacity=".16"/><rect x="140" y="110" width="140" height="210" rx="24" fill="#C6A8DC" opacity=".75"/><rect x="172" y="152" width="76" height="30" rx="15" fill="#3A2456" opacity=".55"/><rect x="172" y="200" width="50" height="16" rx="8" fill="#3A2456" opacity=".35"/></svg>
    </div>
  </div>
</section>
