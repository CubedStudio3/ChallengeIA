<!-- ============================================================
     SECCIÓN · Compra el set
     Varios productos que se venden juntos, con casillas para
     quitar los que no se quieren y el total que se recalcula.
     Sube el ticket promedio sin descontar nada.
     ============================================================ -->
<section class="qs-compra-el-set">
  <style>
  .qs-compra-el-set{
    /* ═══ EDITA AQUÍ ═══════════════════════════════════════════ */
    --qs-fondo:       #0E241C;   /* fondo de la sección           */
    --qs-panel:       #FFFFFF;   /* fondo del panel de la lista   */
    --qs-tinta:       #E9F4EE;   /* color del texto sobre el fondo*/
    --qs-tinta-panel: #101F19;   /* color del texto en el panel   */
    --qs-tinta-suave: #5F7269;   /* presentación y notas          */
    --qs-acento:      #C9E86B;   /* botón de agregar todo         */
    --qs-acento-txt:  #182605;   /* texto del botón               */
    --qs-radio:       16px;      /* redondeo                      */
    --qs-moneda:      "Q";       /* símbolo de la moneda          */
    --qs-aire:        64px;      /* espacio arriba y abajo        */
    /* ═════════════════════════════════════════════════════════ */

    background:var(--qs-fondo); color:var(--qs-tinta);
    font-family:'Inter',-apple-system,'Segoe UI',system-ui,sans-serif;
    padding:var(--qs-aire) 24px;
  }
  .qs-compra-el-set, .qs-compra-el-set *{box-sizing:border-box}
  .qs-ces-marco{max-width:1060px; margin:0 auto}
  .qs-ces-alto{text-align:center; margin-bottom:28px}
  .qs-compra-el-set h2{font-size:clamp(24px,3.2vw,32px); font-weight:700; letter-spacing:-.028em; margin:0 0 8px}
  .qs-ces-alto p{margin:0; font-size:14.5px; opacity:.78}
  .qs-ces-reja{display:grid; grid-template-columns:1fr 1fr; gap:24px; align-items:stretch}
  .qs-ces-panel{
    background:var(--qs-panel); color:var(--qs-tinta-panel); border-radius:var(--qs-radio);
    padding:20px; display:flex; flex-direction:column; justify-content:center;
  }
  .qs-ces-fila{
    display:grid; grid-template-columns:auto 56px 1fr auto; gap:13px; align-items:center;
    padding:13px 0; border-bottom:1px solid #EDEDEB;
  }
  .qs-ces-fila input[type="checkbox"]{width:18px; height:18px; accent-color:var(--qs-fondo); cursor:pointer; margin:0}
  .qs-ces-mini{width:56px; height:56px; border-radius:10px; overflow:hidden; background:#F2F2F0}
  .qs-ces-mini svg, .qs-ces-mini img{width:100%; height:100%; object-fit:cover; display:block}
  .qs-ces-fila label{min-width:0; cursor:pointer}
  .qs-ces-fila label b{display:block; font-size:13.5px; font-weight:600; line-height:1.35}
  .qs-ces-fila label span{display:block; font-size:11.5px; color:var(--qs-tinta-suave); margin-top:2px}
  .qs-ces-precio{font-size:14px; font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap}
  .qs-ces-fila.qs-apagada label, .qs-ces-fila.qs-apagada .qs-ces-precio{opacity:.42}
  .qs-ces-total{display:flex; justify-content:space-between; align-items:baseline; gap:14px; padding:16px 0 14px; font-variant-numeric:tabular-nums}
  .qs-ces-total span{font-size:13px; color:var(--qs-tinta-suave)}
  .qs-ces-total b{font-size:23px; font-weight:700; letter-spacing:-.02em}
  .qs-ces-cta{
    width:100%; font:inherit; font-size:15px; font-weight:700; cursor:pointer;
    background:var(--qs-acento); color:var(--qs-acento-txt); border:0;
    border-radius:11px; padding:15px 20px;
  }
  .qs-ces-cta:disabled{opacity:.45; cursor:not-allowed}
  .qs-ces-nota{margin:11px 0 0; font-size:11.5px; color:var(--qs-tinta-suave); text-align:center}
  .qs-ces-foto{border-radius:var(--qs-radio); overflow:hidden; background:#2A4A40; min-height:320px}
  .qs-ces-foto svg, .qs-ces-foto img{width:100%; height:100%; object-fit:cover; display:block}
  @media (max-width:820px){
    .qs-compra-el-set{--qs-aire:44px}
    .qs-ces-reja{grid-template-columns:1fr}
    .qs-ces-foto{min-height:200px; order:-1}
  }
  </style>

  <div class="qs-ces-marco">
    <div class="qs-ces-alto">
      <h2>El set completo del taller</h2>
      <p>Quita lo que ya tengas: el total se recalcula solo.</p>
    </div>

    <div class="qs-ces-reja">
      <div class="qs-ces-panel">
        <!-- Fila · el precio va en data-qs-precio, en número plano -->
        <div class="qs-ces-fila">
          <input type="checkbox" id="qs-ces-1" checked data-qs-precio="1240">
          <span class="qs-ces-mini"><svg viewBox="0 0 56 56" aria-hidden="true"><rect width="56" height="56" fill="#C3DBCB"/><rect x="19" y="13" width="18" height="30" rx="5" fill="#8DB39C"/></svg></span>
          <label for="qs-ces-1"><b>Taladro percutor 1/2"</b><span>650 W · con maletín</span></label>
          <span class="qs-ces-precio">Q 1,240.00</span>
        </div>
        <div class="qs-ces-fila">
          <input type="checkbox" id="qs-ces-2" checked data-qs-precio="310">
          <span class="qs-ces-mini"><svg viewBox="0 0 56 56" aria-hidden="true"><rect width="56" height="56" fill="#C5DCCD"/><circle cx="28" cy="28" r="15" fill="#8DB49D"/></svg></span>
          <label for="qs-ces-2"><b>Juego de llaves · 12 piezas</b><span>Acero cromo vanadio</span></label>
          <span class="qs-ces-precio">Q 310.00</span>
        </div>
        <div class="qs-ces-fila">
          <input type="checkbox" id="qs-ces-3" checked data-qs-precio="98">
          <span class="qs-ces-mini"><svg viewBox="0 0 56 56" aria-hidden="true"><rect width="56" height="56" fill="#C8DFD0"/><path d="M28 14l14 28H14z" fill="#8CB39B"/></svg></span>
          <label for="qs-ces-3"><b>Casco con barbiquejo</b><span>Certificado ANSI</span></label>
          <span class="qs-ces-precio">Q 98.00</span>
        </div>

        <div class="qs-ces-total">
          <span data-qs-ces-cuenta>3 productos</span>
          <b data-qs-ces-total>Q 1,648.00</b>
        </div>
        <button class="qs-ces-cta" type="button" data-qs-ces-cta>Agregar los 3 al carrito</button>
        <p class="qs-ces-nota">Se agregan como piezas sueltas: puedes cambiar cantidades en el carrito.</p>
      </div>

      <!-- Reemplazar el <svg> por: <img src="set.jpg" alt="El set completo"> -->
      <div class="qs-ces-foto">
        <svg viewBox="0 0 500 500" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs><linearGradient id="qsces1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#517E65"/><stop offset="1" stop-color="#3A664E"/></linearGradient></defs><rect width="500" height="500" fill="url(#qsces1)"/><circle cx="330" cy="160" r="130" fill="#639076" opacity=".7"/><rect x="120" y="200" width="150" height="220" rx="24" fill="#6E9B81" opacity=".75"/><rect x="155" y="245" width="80" height="26" rx="13" fill="#C5DDCE" opacity=".8"/></svg>
      </div>
    </div>
  </div>

  <script>
  (function(){
    document.querySelectorAll('.qs-compra-el-set').forEach(function(seccion){
      var casillas = seccion.querySelectorAll('[data-qs-precio]');
      var salidaT  = seccion.querySelector('[data-qs-ces-total]');
      var salidaC  = seccion.querySelector('[data-qs-ces-cuenta]');
      var cta      = seccion.querySelector('[data-qs-ces-cta]');
      if(!casillas.length || !salidaT) return;

      var moneda = (getComputedStyle(seccion).getPropertyValue('--qs-moneda') || 'Q').trim().replace(/["']/g, '');

      function suma(){
        var total = 0, n = 0;
        casillas.forEach(function(c){
          var fila = c.closest('.qs-ces-fila');
          if(fila) fila.classList.toggle('qs-apagada', !c.checked);
          if(c.checked){ total += Number(c.dataset.qsPrecio) || 0; n++; }
        });
        salidaT.textContent = moneda + ' ' + total.toLocaleString('es-GT', { minimumFractionDigits:2, maximumFractionDigits:2 });
        if(salidaC) salidaC.textContent = n === 1 ? '1 producto' : n + ' productos';
        if(cta){
          cta.disabled = (n === 0);
          cta.textContent = n === 0 ? 'Elige al menos uno'
                          : n === 1 ? 'Agregar al carrito'
                          : 'Agregar los ' + n + ' al carrito';
        }
      }

      casillas.forEach(function(c){ c.addEventListener('change', suma); });
      suma();   /* el total de la pantalla sale de las casillas, no del HTML escrito */
    });
  })();
  </script>
</section>
