<!-- ============================================================
     SECCIÓN · Barra de envío gratis
     Cuánto falta para el envío sin costo, con barra que avanza.
     Va dentro del carrito o pegada abajo mientras se compra.
     ============================================================ -->
<div class="qs-banner-progreso" data-qs-meta="300" data-qs-lleva="214">
  <!-- data-qs-meta: el monto que libera el envío · data-qs-lleva: lo que va en el carrito -->
  <style>
  .qs-banner-progreso{
    /* ═══ EDITA AQUÍ ═══════════════════════════════════════════ */
    --qs-fondo:       #FFFFFF;   /* fondo del bloque               */
    --qs-tinta:       #0F211F;   /* color del texto                */
    --qs-tinta-suave: #56706D;   /* color de la línea de abajo     */
    --qs-barra:       #E1EDEA;   /* canal de la barra              */
    --qs-avance:      #0E6B63;   /* color del avance               */
    --qs-listo:       #0E6B63;   /* color cuando ya se alcanzó     */
    --qs-moneda:      "Q";       /* símbolo de la moneda           */
    --qs-radio:       14px;      /* redondeo del bloque            */
    /* ═════════════════════════════════════════════════════════ */

    background:var(--qs-fondo); color:var(--qs-tinta);
    font-family:'Inter',-apple-system,'Segoe UI',system-ui,sans-serif;
    border:1px solid var(--qs-barra); border-radius:var(--qs-radio);
    padding:18px 20px; max-width:560px; margin:24px auto;
  }
  .qs-banner-progreso, .qs-banner-progreso *{box-sizing:border-box}
  .qs-bp2-alto{display:flex; align-items:center; gap:10px; margin-bottom:12px}
  .qs-bp2-alto svg{width:19px; height:19px; flex:none; color:var(--qs-avance)}
  .qs-bp2-alto p{margin:0; font-size:14.5px; line-height:1.4}
  .qs-bp2-alto b{font-weight:700}
  .qs-bp2-canal{height:8px; border-radius:999px; background:var(--qs-barra); overflow:hidden}
  .qs-bp2-avance{
    height:100%; border-radius:999px; background:var(--qs-avance);
    width:0; transition:width .6s cubic-bezier(.22,.9,.3,1);
  }
  .qs-bp2-pie{
    display:flex; justify-content:space-between; gap:12px; margin:9px 0 0;
    font-size:12px; color:var(--qs-tinta-suave); font-variant-numeric:tabular-nums;
  }
  .qs-banner-progreso[data-qs-listo="si"] .qs-bp2-alto svg{color:var(--qs-listo)}
  @media (prefers-reduced-motion: reduce){ .qs-bp2-avance{transition:none} }
  </style>

  <div class="qs-bp2-alto">
    <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M2 6.5h11v8H2zM13 9.5h4l2 2.5v2.5h-6z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><circle cx="6" cy="16" r="1.7" stroke="currentColor" stroke-width="1.4"/><circle cx="15.5" cy="16" r="1.7" stroke="currentColor" stroke-width="1.4"/></svg>
    <p data-qs-bp2-texto>Calculando…</p>
  </div>
  <div class="qs-bp2-canal"><div class="qs-bp2-avance" data-qs-bp2-barra></div></div>
  <p class="qs-bp2-pie"><span data-qs-bp2-lleva></span><span data-qs-bp2-meta></span></p>

  <script>
  (function(){
    document.querySelectorAll('.qs-banner-progreso').forEach(function(caja){
      var meta  = Number(caja.dataset.qsMeta)  || 0;
      var lleva = Number(caja.dataset.qsLleva) || 0;
      if(meta <= 0) return;

      var moneda = (getComputedStyle(caja).getPropertyValue('--qs-moneda') || 'Q').trim().replace(/["']/g, '');
      function monto(n){ return moneda + ' ' + n.toFixed(2); }

      var falta = Math.max(0, meta - lleva);
      var pct   = Math.min(100, (lleva / meta) * 100);

      caja.querySelector('[data-qs-bp2-texto]').innerHTML = falta > 0
        ? 'Te faltan <b>' + monto(falta) + '</b> para el envío sin costo'
        : '<b>Ya tienes envío sin costo</b> en este pedido';
      caja.dataset.qsListo = falta > 0 ? 'no' : 'si';
      caja.querySelector('[data-qs-bp2-lleva]').textContent = 'Llevas ' + monto(lleva);
      caja.querySelector('[data-qs-bp2-meta]').textContent  = 'Meta ' + monto(meta);

      /* se pinta en el siguiente cuadro para que la barra se vea avanzar */
      requestAnimationFrame(function(){
        caja.querySelector('[data-qs-bp2-barra]').style.width = pct + '%';
      });
    });
  })();
  </script>
</div>
