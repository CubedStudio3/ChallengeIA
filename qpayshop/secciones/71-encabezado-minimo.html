<!-- ============================================================
     SECCIÓN · Encabezado mínimo
     Logo al centro y un cajón lateral con todo lo demás. Para
     tiendas de pocas categorías, donde un menú largo estorba.
     ============================================================ -->
<div class="qs-encabezado-minimo" data-qs-cajon="cerrado">
  <style>
  .qs-encabezado-minimo, .qs-encabezado-minimo *{box-sizing:border-box}
  .qs-encabezado-minimo{
    /* ═══ EDITA AQUÍ ═══════════════════════════════════════════ */
    --qs-barra:       #FFFFFF;   /* fondo de la barra             */
    --qs-tinta:       #121212;   /* color del texto               */
    --qs-tinta-suave: #6E6E6E;   /* texto secundario              */
    --qs-cajon:       #121212;   /* fondo del cajón               */
    --qs-cajon-txt:   #F4F2EE;   /* texto del cajón               */
    --qs-acento:      #C08A2E;   /* enlace activo del cajón       */
    --qs-globo:       #93400F;   /* fondo del contador            */
    --qs-linea:       #E8E6E1;   /* línea de abajo                */
    --qs-alto:        320px;     /* alto de la demostración       */
    /* ═════════════════════════════════════════════════════════ */

    position:relative; min-height:var(--qs-alto); overflow:hidden;
    background:#FAF9F7; color:var(--qs-tinta);
    font-family:'Inter',-apple-system,'Segoe UI',system-ui,sans-serif;
  }
  .qs-em-barra{
    display:grid; grid-template-columns:1fr auto 1fr; align-items:center;
    background:var(--qs-barra); border-bottom:1px solid var(--qs-linea);
    padding:0 20px; position:relative; z-index:3;
  }
  .qs-em-izq, .qs-em-der{display:flex; align-items:center; gap:4px}
  .qs-em-der{justify-content:flex-end}
  .qs-em-icono{
    font:inherit; cursor:pointer; background:none; border:0; padding:15px 10px;
    color:var(--qs-tinta); display:inline-flex; align-items:center; gap:7px;
    font-size:13.5px; text-decoration:none;
  }
  .qs-em-icono svg{width:19px; height:19px}
  .qs-em-logo{font-size:17px; font-weight:800; letter-spacing:.04em; text-transform:uppercase; padding:16px 12px; text-decoration:none; color:inherit; white-space:nowrap}
  .qs-em-globo{
    background:var(--qs-globo); color:#fff; border-radius:99px; min-width:18px; height:18px;
    font-size:11px; font-weight:700; display:grid; place-items:center; padding:0 5px;
  }
  .qs-em-velo{
    position:absolute; inset:0; z-index:1; background:rgba(18,18,18,.42);
    opacity:0; pointer-events:none; transition:opacity .25s;
  }
  .qs-encabezado-minimo[data-qs-cajon="abierto"] .qs-em-velo{opacity:1; pointer-events:auto}
  .qs-em-panel{
    position:absolute; top:0; bottom:0; left:0; z-index:2; width:min(300px, 84%);
    background:var(--qs-cajon); color:var(--qs-cajon-txt); padding:22px;
    transform:translateX(-100%); transition:transform .28s cubic-bezier(.22,.9,.3,1);
    display:flex; flex-direction:column;
  }
  .qs-encabezado-minimo[data-qs-cajon="abierto"] .qs-em-panel{transform:none}
  @media (prefers-reduced-motion: reduce){ .qs-em-panel{transition:none} }
  .qs-em-panel h2{font-size:11.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; opacity:.6; margin:0 0 16px}
  .qs-em-panel ul{list-style:none; margin:0; padding:0; display:grid; gap:2px}
  .qs-em-panel a{
    display:block; padding:9px 0; font-size:17px; font-weight:600;
    letter-spacing:-.015em; color:inherit; text-decoration:none;
  }
  .qs-em-panel a:hover{color:var(--qs-acento)}
  .qs-em-pie{margin-top:auto; padding-top:20px; border-top:1px solid rgba(255,255,255,.14); font-size:12.5px; opacity:.7; line-height:1.6}
  .qs-em-cerrar{
    position:absolute; top:14px; right:14px; font:inherit; cursor:pointer;
    background:none; border:0; color:inherit; padding:6px; opacity:.7;
  }
  .qs-em-cerrar svg{width:15px; height:15px; display:block}
  .qs-em-hueco{padding:44px 24px; text-align:center; color:var(--qs-tinta-suave); font-size:13.5px}
  @media (max-width:560px){ .qs-em-icono span{display:none} }
  </style>

  <div class="qs-em-barra">
    <div class="qs-em-izq">
      <button class="qs-em-icono" type="button" data-qs-abre aria-expanded="false">
        <svg viewBox="0 0 19 19" fill="none" aria-hidden="true"><path d="M2.5 5h14M2.5 9.5h14M2.5 14h14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <span>Menú</span>
      </button>
    </div>
    <a class="qs-em-logo" href="#">Tienda</a>
    <div class="qs-em-der">
      <a class="qs-em-icono" href="#" aria-label="Buscar"><svg viewBox="0 0 19 19" fill="none" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.6" stroke="currentColor" stroke-width="1.6"/><path d="M12.6 12.6L16.5 16.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></a>
      <a class="qs-em-icono" href="#"><svg viewBox="0 0 19 19" fill="none" aria-hidden="true"><path d="M3 3h2.4l2.2 9.4h7.6l1.8-7H6.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="8.6" cy="15.6" r="1.3" fill="currentColor"/><circle cx="14.4" cy="15.6" r="1.3" fill="currentColor"/></svg><span class="qs-em-globo">3</span></a>
    </div>
  </div>

  <p class="qs-em-hueco">Acá va el contenido de la página.</p>

  <div class="qs-em-velo" data-qs-cierra></div>
  <nav class="qs-em-panel" aria-label="Menú principal">
    <button class="qs-em-cerrar" type="button" data-qs-cierra aria-label="Cerrar el menú">
      <svg viewBox="0 0 15 15" fill="none"><path d="M3 3l9 9M12 3l-9 9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    </button>
    <h2>Catálogo</h2>
    <ul>
      <!-- Enlace · duplicar -->
      <li><a href="#">Novedades</a></li>
      <li><a href="#">Mujer</a></li>
      <li><a href="#">Hombre</a></li>
      <li><a href="#">Accesorios</a></li>
      <li><a href="#">Ofertas</a></li>
    </ul>
    <p class="qs-em-pie">Envíos a todo el país<br>Lunes a sábado, 9 a. m. a 6 p. m.<br>2222 3344</p>
  </nav>

  <script>
  /* Abrir, cerrar con el velo, con la equis y con Escape. Un cajón que solo
     se cierra con un botón chiquito atrapa a quien lo abrió sin querer. */
  (function(){
    var raiz = document.currentScript.closest(".qs-encabezado-minimo");
    var abre = raiz.querySelector("[data-qs-abre]");
    function pon(estado){
      raiz.dataset.qsCajon = estado;
      abre.setAttribute("aria-expanded", String(estado === "abierto"));
    }
    abre.addEventListener("click", function(){
      pon(raiz.dataset.qsCajon === "abierto" ? "cerrado" : "abierto");
    });
    raiz.querySelectorAll("[data-qs-cierra]").forEach(function(b){
      b.addEventListener("click", function(){ pon("cerrado"); });
    });
    raiz.addEventListener("keydown", function(e){
      if(e.key === "Escape" && raiz.dataset.qsCajon === "abierto"){ pon("cerrado"); abre.focus(); }
    });
  })();
  </script>
</div>
