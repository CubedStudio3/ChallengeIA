<!-- ============================================================
     SECCIÓN · Barra de anuncio con cuenta regresiva
     Va pegada arriba del encabezado. Si no se le pone fecha,
     cuenta hasta la medianoche de hoy.
     ============================================================ -->
<div class="qs-barra-anuncio" data-qs-hasta="">
  <!-- En data-qs-hasta va la fecha de cierre: data-qs-hasta="2026-12-24T23:59:59" -->
  <style>
  .qs-barra-anuncio{
    /* ═══ EDITA AQUÍ ═══════════════════════════════════════════ */
    --qs-fondo:   #12261F;   /* fondo de la barra                  */
    --qs-tinta:   #EAF5F0;   /* color del texto                    */
    --qs-acento:  #6FD9A8;   /* números del reloj y el enlace      */
    --qs-alto:    46px;      /* alto de la barra                   */
    /* ═════════════════════════════════════════════════════════ */

    background:var(--qs-fondo); color:var(--qs-tinta);
    font-family:'Inter',-apple-system,'Segoe UI',system-ui,sans-serif;
    min-height:var(--qs-alto); display:flex; align-items:center;
    padding:8px 44px 8px 20px; position:relative; font-size:13.5px;
  }
  .qs-barra-anuncio *{box-sizing:border-box}
  .qs-ba-centro{
    margin:0 auto; display:flex; align-items:center; gap:14px;
    flex-wrap:wrap; justify-content:center; text-align:center;
  }
  .qs-ba-texto strong{font-weight:700}
  .qs-ba-reloj{display:inline-flex; align-items:center; gap:5px; font-variant-numeric:tabular-nums}
  .qs-ba-reloj b{
    background:rgba(255,255,255,.10); color:var(--qs-acento); font-weight:700;
    border-radius:6px; padding:3px 7px; min-width:30px; display:inline-block; text-align:center;
  }
  .qs-ba-reloj i{font-style:normal; opacity:.5}
  .qs-ba-enlace{color:var(--qs-acento); font-weight:600; text-decoration:none; border-bottom:1px solid currentColor; padding-bottom:1px; white-space:nowrap}
  .qs-ba-cerrar{
    position:absolute; right:10px; top:50%; transform:translateY(-50%);
    width:28px; height:28px; display:grid; place-items:center; cursor:pointer;
    background:none; border:0; color:inherit; opacity:.55; border-radius:6px;
  }
  .qs-ba-cerrar:hover{opacity:1; background:rgba(255,255,255,.10)}
  .qs-ba-cerrar svg{width:13px; height:13px}
  @media (max-width:560px){
    .qs-barra-anuncio{font-size:12.5px; padding:9px 40px 9px 14px}
    .qs-ba-centro{gap:8px}
  }
  </style>

  <div class="qs-ba-centro">
    <span class="qs-ba-texto"><strong>Envío sin costo</strong> en compras arriba de Q 300</span>
    <span class="qs-ba-reloj" aria-label="Tiempo restante">
      <b data-qs-h>00</b><i>:</i><b data-qs-m>00</b><i>:</i><b data-qs-s>00</b>
    </span>
    <a class="qs-ba-enlace" href="#">Ver condiciones</a>
  </div>

  <button class="qs-ba-cerrar" type="button" aria-label="Cerrar anuncio">
    <svg viewBox="0 0 14 14" fill="none"><path d="M2 2l10 10M12 2L2 12" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
  </button>

  <script>
  (function(){
    document.querySelectorAll('.qs-barra-anuncio').forEach(function(barra){
      var cerrar = barra.querySelector('.qs-ba-cerrar');
      if(cerrar) cerrar.addEventListener('click', function(){ barra.remove(); });
      /* Para que no vuelva a salir en toda la visita, agrega dentro del click:
         try { sessionStorage.setItem('qs-anuncio', 'cerrado'); } catch(e){}
         y al inicio: try { if(sessionStorage.getItem('qs-anuncio')) barra.remove(); } catch(e){} */

      var hh = barra.querySelector('[data-qs-h]');
      var mm = barra.querySelector('[data-qs-m]');
      var ss = barra.querySelector('[data-qs-s]');
      if(!hh || !mm || !ss) return;

      function meta(){
        var puesta = Date.parse(barra.dataset.qsHasta || '');
        if(puesta && puesta > Date.now()) return puesta;
        var medianoche = new Date();          /* sin fecha puesta: hasta medianoche de hoy */
        medianoche.setHours(24, 0, 0, 0);
        return medianoche.getTime();
      }

      function dos(n){ return String(n).padStart(2, '0'); }

      function tic(){
        var faltan = Math.max(0, meta() - Date.now());
        var t = Math.floor(faltan / 1000);
        hh.textContent = dos(Math.floor(t / 3600));
        mm.textContent = dos(Math.floor(t / 60) % 60);
        ss.textContent = dos(t % 60);
      }

      tic();
      setInterval(tic, 1000);
    });
  })();
  </script>
</div>
