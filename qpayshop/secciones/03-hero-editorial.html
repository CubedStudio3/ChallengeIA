<!-- ============================================================
     SECCIÓN · Hero editorial
     Titular grande en serif, dos columnas desiguales y una tira
     de tres piezas abajo. Para catálogos que se leen como revista.
     ============================================================ -->
<section class="qs-hero-editorial">
  <style>
  /* Tipografía del titular. Si la plantilla ya carga una serif, borra esta línea. */
  @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap');

  .qs-hero-editorial{
    /* ═══ EDITA AQUÍ ═══════════════════════════════════════════ */
    --qs-fondo:       #FAF9F6;   /* fondo de la sección            */
    --qs-tinta:       #16151A;   /* color del texto                */
    --qs-tinta-suave: #6C6A73;   /* color del párrafo y las notas  */
    --qs-linea:       #E3E0D7;   /* color de las líneas divisorias */
    --qs-serif:       'Instrument Serif', Georgia, 'Times New Roman', serif;
    --qs-aire:        76px;      /* espacio arriba y abajo         */
    /* ═════════════════════════════════════════════════════════ */

    background:var(--qs-fondo); color:var(--qs-tinta);
    font-family:'Inter',-apple-system,'Segoe UI',system-ui,sans-serif;
    padding:var(--qs-aire) 24px;
  }
  .qs-hero-editorial *{box-sizing:border-box}
  .qs-he-marco{max-width:1120px; margin:0 auto}
  .qs-he-alto{
    display:flex; justify-content:space-between; align-items:baseline; gap:20px;
    padding-bottom:16px; border-bottom:1px solid var(--qs-linea); margin-bottom:38px;
    font-size:11.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--qs-tinta-suave);
  }
  .qs-hero-editorial h2{
    font-family:var(--qs-serif); font-weight:400;
    font-size:clamp(46px,9vw,112px); line-height:.94; letter-spacing:-.02em;
    margin:0 0 30px; text-wrap:balance; max-width:13ch;
  }
  .qs-hero-editorial h2 i{font-style:italic; color:var(--qs-tinta-suave)}
  .qs-he-cuerpo{
    display:grid; grid-template-columns:1fr auto; gap:40px; align-items:end;
    padding-bottom:42px; border-bottom:1px solid var(--qs-linea); margin-bottom:26px;
  }
  .qs-he-cuerpo p{font-size:16px; line-height:1.65; color:var(--qs-tinta-suave); margin:0; max-width:52ch}
  .qs-he-cta{
    font:inherit; font-size:14px; font-weight:600; text-decoration:none; color:var(--qs-tinta);
    border-bottom:1.5px solid var(--qs-tinta); padding-bottom:3px; white-space:nowrap;
    display:inline-flex; align-items:center; gap:8px;
  }
  .qs-he-cta svg{width:15px; height:15px; transition:transform .18s ease}
  .qs-he-cta:hover svg{transform:translateX(4px)}
  .qs-he-tira{display:grid; grid-template-columns:repeat(3,1fr); gap:20px}
  .qs-he-pieza{text-decoration:none; color:inherit; display:block}
  .qs-he-pieza figure{margin:0}
  .qs-he-lienzo{aspect-ratio:3/4; overflow:hidden; background:#EDE9E0; margin-bottom:12px}
  .qs-he-lienzo svg, .qs-he-lienzo img{width:100%; height:100%; object-fit:cover; display:block; transition:transform .4s ease}
  .qs-he-pieza:hover .qs-he-lienzo svg, .qs-he-pieza:hover .qs-he-lienzo img{transform:scale(1.04)}
  .qs-he-pieza figcaption{display:flex; justify-content:space-between; gap:12px; font-size:13.5px; align-items:baseline}
  .qs-he-pieza figcaption b{font-weight:600}
  .qs-he-pieza figcaption span{color:var(--qs-tinta-suave); font-variant-numeric:tabular-nums}
  @media (max-width:760px){
    .qs-hero-editorial{--qs-aire:46px}
    .qs-he-cuerpo{grid-template-columns:1fr; gap:24px; align-items:start}
    .qs-he-tira{grid-template-columns:1fr 1fr; gap:14px}
    .qs-he-tira .qs-he-pieza:nth-child(3){display:none}
    .qs-he-alto{font-size:10.5px; letter-spacing:.12em}
  }
  </style>

  <div class="qs-he-marco">
    <div class="qs-he-alto"><span>Catálogo 03</span><span>Otoño 2026</span></div>
    <h2>Vestir el <i>mostrador</i> con lo que se hace acá</h2>
    <div class="qs-he-cuerpo">
      <p>Cuarenta piezas de talleres de Antigua, Totonicapán y Quetzaltenango. Cada una con el nombre de quien la hizo y el tiempo que le tomó. Existencias cortas: lo que ves es lo que hay.</p>
      <a class="qs-he-cta" href="#">Recorrer el catálogo <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M2 8h12M9 3l5 5-5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
    </div>

    <div class="qs-he-tira">
      <!-- Cada .qs-he-lienzo lleva un <img src="..." alt="..."> en lugar del <svg> -->
      <a class="qs-he-pieza" href="#"><figure>
        <div class="qs-he-lienzo"><svg viewBox="0 0 300 400" aria-hidden="true"><rect width="300" height="400" fill="#DFDBD0"/><rect x="60" y="70" width="180" height="250" rx="90" fill="#BCB7A7"/><rect x="100" y="120" width="100" height="60" rx="30" fill="#E6E3D9" opacity=".8"/></svg></div>
        <figcaption><b>Bolso tejido</b><span>Q 385</span></figcaption>
      </figure></a>
      <a class="qs-he-pieza" href="#"><figure>
        <div class="qs-he-lienzo"><svg viewBox="0 0 300 400" aria-hidden="true"><rect width="300" height="400" fill="#DFDCD1"/><path d="M150 60 L245 200 L150 340 L55 200 Z" fill="#B7B1A0"/><circle cx="150" cy="200" r="42" fill="#E9E7DE" opacity=".85"/></svg></div>
        <figcaption><b>Manta de telar</b><span>Q 640</span></figcaption>
      </figure></a>
      <a class="qs-he-pieza" href="#"><figure>
        <div class="qs-he-lienzo"><svg viewBox="0 0 300 400" aria-hidden="true"><rect width="300" height="400" fill="#E0DDD2"/><circle cx="150" cy="170" r="88" fill="#B7B1A1"/><rect x="118" y="240" width="64" height="110" rx="14" fill="#908A79"/></svg></div>
        <figcaption><b>Jarro de barro</b><span>Q 175</span></figcaption>
      </figure></a>
    </div>
  </div>
</section>
