<!-- ============================================================
     SECCIÓN · Hero mosaico
     El hero ES el mosaico: cuatro bloques de distinto tamaño, cada
     uno con su botón. Sirve cuando no hay una campaña sola que
     merezca el ancho completo.
     ============================================================ -->
<section class="qs-hero-mosaico">
  <style>
  .qs-hero-mosaico{
    /* ═══ EDITA AQUÍ ═══════════════════════════════════════════ */
    --qs-fondo:   #FAF7EC;   /* fondo de la sección                */
    --qs-tinta:   #1D1C10;   /* color del texto del botón          */
    --qs-boton:   #FFFFFF;   /* fondo del botón                    */
    --qs-radio:   20px;      /* redondeo de los bloques            */
    --qs-alto:    300px;     /* alto de una fila                   */
    --qs-hueco:   14px;      /* separación entre bloques           */
    --qs-aire:    28px;      /* espacio arriba y abajo             */
    /* ═════════════════════════════════════════════════════════ */

    background:var(--qs-fondo);
    font-family:'Inter',-apple-system,'Segoe UI',system-ui,sans-serif;
    padding:var(--qs-aire) 24px;
  }
  .qs-hero-mosaico *{box-sizing:border-box}
  .qs-hm-reja{
    max-width:1200px; margin:0 auto; display:grid; gap:var(--qs-hueco);
    grid-template-columns:repeat(4,1fr); grid-auto-rows:var(--qs-alto);
  }
  .qs-hm-b{
    position:relative; overflow:hidden; border-radius:var(--qs-radio);
    display:flex; align-items:flex-end; justify-content:center; padding:22px;
    text-decoration:none; background:#E4E1DA; isolation:isolate;
  }
  .qs-hm-b1{grid-column:span 2; grid-row:span 2}
  .qs-hm-b2, .qs-hm-b3{grid-column:span 1}
  .qs-hm-b4{grid-column:span 2}
  .qs-hm-b img, .qs-hm-b > svg{position:absolute; inset:0; z-index:-1; width:100%; height:100%; object-fit:cover; transition:transform .5s ease}
  .qs-hm-b:hover img, .qs-hm-b:hover > svg{transform:scale(1.05)}
  .qs-hm-pill{
    background:var(--qs-boton); color:var(--qs-tinta); border-radius:999px;
    padding:13px 30px; font-size:14px; font-weight:700; letter-spacing:-.01em;
    box-shadow:0 6px 20px -8px rgba(0,0,0,.35); white-space:nowrap;
    display:inline-flex; align-items:center; gap:8px; transition:gap .18s ease;
  }
  .qs-hm-b:hover .qs-hm-pill{gap:14px}
  .qs-hm-pill svg{width:13px; height:13px}
  .qs-hm-rotulo{
    position:absolute; top:22px; left:22px; z-index:1; color:#fff;
    font-size:12.5px; font-weight:600; letter-spacing:.08em; text-transform:uppercase;
    text-shadow:0 1px 8px rgba(0,0,0,.45);
  }
  .qs-hm-b1 .qs-hm-rotulo{font-size:15px}
  @media (max-width:860px){
    .qs-hero-mosaico{--qs-alto:200px}
    .qs-hm-reja{grid-template-columns:repeat(2,1fr)}
    .qs-hm-b1{grid-column:span 2; grid-row:span 1}
    .qs-hm-b4{grid-column:span 2}
  }
  </style>

  <div class="qs-hm-reja">
    <!-- Bloque · reemplazar el <svg> por <img src="..." alt=""> -->
    <a class="qs-hm-b qs-hm-b1" href="#">
      <svg viewBox="0 0 600 614" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs><linearGradient id="qshm1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#CAC19A"/><stop offset="1" stop-color="#938A61"/></linearGradient></defs><rect width="600" height="614" fill="url(#qshm1)"/><circle cx="300" cy="260" r="170" fill="#DED6B6" opacity=".55"/><path d="M0 450c160-50 320 50 480-10l120-30v204H0z" fill="#7A714E" opacity=".6"/></svg>
      <span class="qs-hm-rotulo">Cuidado de la piel</span>
      <span class="qs-hm-pill">Ver la línea completa <svg viewBox="0 0 16 16" fill="none"><path d="M2.5 8h11M9 3.5L13.5 8 9 12.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    </a>
    <a class="qs-hm-b qs-hm-b2" href="#">
      <svg viewBox="0 0 300 300" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="300" height="300" fill="#D2CAA5"/><circle cx="150" cy="130" r="82" fill="#B0A67A"/></svg>
      <span class="qs-hm-rotulo">Cabello</span>
      <span class="qs-hm-pill">Ver</span>
    </a>
    <a class="qs-hm-b qs-hm-b3" href="#">
      <svg viewBox="0 0 300 300" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="300" height="300" fill="#D0C8A2"/><rect x="85" y="70" width="130" height="160" rx="30" fill="#A79D73"/></svg>
      <span class="qs-hm-rotulo">Maquillaje</span>
      <span class="qs-hm-pill">Ver</span>
    </a>
    <a class="qs-hm-b qs-hm-b4" href="#">
      <svg viewBox="0 0 600 300" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="600" height="300" fill="#CFC6A0"/><circle cx="430" cy="120" r="130" fill="#B2A97D" opacity=".8"/><path d="M0 210c150-30 290 40 440-10l160-30v130H0z" fill="#918860" opacity=".65"/></svg>
      <span class="qs-hm-rotulo">Accesorios</span>
      <span class="qs-hm-pill">Ver los 38 productos <svg viewBox="0 0 16 16" fill="none"><path d="M2.5 8h11M9 3.5L13.5 8 9 12.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    </a>
  </div>
</section>
