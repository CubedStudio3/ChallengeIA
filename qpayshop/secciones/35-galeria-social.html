<!-- ============================================================
     SECCIÓN · Galería social
     Las fotos de la cuenta, con el usuario encima. Va cerca del
     pie: es prueba de que la tienda está viva.
     ============================================================ -->
<section class="qs-galeria-social">
  <style>
  .qs-galeria-social{
    /* ═══ EDITA AQUÍ ═══════════════════════════════════════════ */
    --qs-fondo:   #FBF4F1;   /* fondo de la sección                */
    --qs-tinta:   #241714;   /* color del texto                    */
    --qs-usuario: #75605A;   /* color del usuario                  */
    --qs-velo:    .40;       /* oscurecido al pasar el mouse       */
    --qs-hueco:   6px;       /* separación entre fotos             */
    --qs-aire:    56px;      /* espacio arriba y abajo             */
    /* ═════════════════════════════════════════════════════════ */

    background:var(--qs-fondo); color:var(--qs-tinta);
    font-family:'Inter',-apple-system,'Segoe UI',system-ui,sans-serif;
    padding:var(--qs-aire) 0;
  }
  .qs-galeria-social, .qs-galeria-social *{box-sizing:border-box}
  .qs-gs-alto{text-align:center; margin:0 auto 24px; padding:0 24px; max-width:640px}
  .qs-galeria-social h2{font-size:clamp(21px,2.7vw,28px); font-weight:700; letter-spacing:-.025em; margin:0 0 7px}
  .qs-gs-alto a{font-size:14px; color:var(--qs-usuario); text-decoration:none; font-weight:500}
  .qs-gs-alto a:hover{color:var(--qs-tinta); text-decoration:underline}
  .qs-gs-reja{display:grid; grid-template-columns:repeat(6,1fr); gap:var(--qs-hueco); padding:0 var(--qs-hueco)}
  .qs-gs-foto{
    position:relative; display:block; aspect-ratio:1/1; overflow:hidden; background:#EDEDEC;
  }
  .qs-gs-foto svg, .qs-gs-foto img{width:100%; height:100%; object-fit:cover; display:block; transition:transform .45s ease}
  .qs-gs-foto:hover svg, .qs-gs-foto:hover img{transform:scale(1.07)}
  .qs-gs-capa{
    position:absolute; inset:0; display:grid; place-items:center; color:#fff;
    background:rgba(0,0,0,var(--qs-velo)); opacity:0; transition:opacity .2s ease;
  }
  .qs-gs-foto:hover .qs-gs-capa, .qs-gs-foto:focus-visible .qs-gs-capa{opacity:1}
  .qs-gs-capa svg{width:26px; height:26px}
  @media (max-width:900px){ .qs-gs-reja{grid-template-columns:repeat(3,1fr)} }
  @media (max-width:480px){ .qs-gs-reja{grid-template-columns:repeat(2,1fr)} .qs-galeria-social{--qs-aire:40px} }
  </style>

  <div class="qs-gs-alto">
    <h2>Así se ve puesto en la calle</h2>
    <a href="#">@laferreteriadelprogreso</a>
  </div>
